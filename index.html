<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>TlouTV Pro — Firestick Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0c10;
            --bg-surface: #161b22;
            --bg-card: #21262d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #ffae00; 
            --focus-glow: rgba(255, 174, 0, 0.4);
            --safe-zone: 5%; 
        }

        * { box-sizing: border-box; outline: none; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            padding: var(--safe-zone);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 40px;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 40px;
            letter-spacing: -1px;
        }

        .nav-item {
            padding: 18px 24px;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            text-align: left;
            width: 100%;
        }

        .nav-item.focused, .nav-item:focus {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--focus-glow);
        }

        .nav-item.active {
            color: var(--accent);
            background: rgba(255, 174, 0, 0.05);
        }

        .content {
            overflow-y: auto;
            padding-bottom: 100px;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }

        .category-title {
            font-family: 'Outfit';
            font-size: 28px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .channel-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 3px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }

        .channel-card.focused {
            border-color: var(--accent);
            transform: scale(1.08);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--focus-glow);
        }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            display: grid;
            place-items: center;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .thumb-container img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .player-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
        }

        .player-overlay.active { display: flex; flex-direction: column; }

        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .player-controls {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .player-overlay.user-active .player-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-back {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 16px 40px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 3px solid transparent;
        }

        .btn-back.focused {
            border-color: white;
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--focus-glow);
        }

        @media (max-width: 800px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar" id="sidebar">
        <div class="logo">TlouTV</div>
        <button class="nav-item focused active" data-cat="all">All Channels</button>
        <button class="nav-item" data-cat="news">News</button>
        <button class="nav-item" data-cat="general">General</button>
        <button class="nav-item" data-cat="music">Music</button>
        <button class="nav-item" data-cat="religious">Religious</button>
        <button class="nav-item" data-cat="sports">Sports</button>
    </div>

    <div class="content" id="content-area">
        <div id="catHeader" class="category-title">All Channels</div>
        <div class="channel-grid" id="grid"></div>
    </div>
</div>

<div class="player-overlay" id="player">
    <video id="videoPlayer" playsinline></video>
    <div class="player-controls">
        <button class="btn-back" id="backBtn">RETURN TO MENU</button>
    </div>
</div>

        {"id":"channel31","name":"Tele Miracle","logo":"https://play-lh.googleusercontent.com/_xLb5cY2Jx9mxWOCcM9eT1mthdxT17zONK19X7dQ3eY9iNL2j88rKxnLhd3bQnMuNvk","url":normalizeStream("https://5790d294af2dc.streamlock.net/MIRACLETV/MIRACLETV/chunklist_w2147348876.m3u8"),"genre":"religious"},
        {"id":"channel32","name":"Radio Tele Hit","logo":"https://play-lh.googleusercontent.com/lujstN5hKyG0JWg_heOw5H7d8NbfzFAGE3Uq0oY9Qo8WxgFB6xD60lXCsGhYa8HDwHg","url":normalizeStream("https://59d39900ebfb8.streamlock.net/RadioTelehit/RadioTelehit/playlist.m3u8"),"genre":"music"},
        {"id":"channel33","name":"Radio Tele Sentinel","logo":"https://radiotelesentinel.com/wp-content/uploads/2025/03/logo-sentinel.png","url":normalizeStream("https://59d39900ebfb8.streamlock.net/radiotelesentinel/radiotelesentinel/chunklist_w2035690488.m3u8"),"genre":"religious"},
        {"id":"channel34","name":"VA Studio","logo":"https://i.imgur.com/bIQjQo1.jpeg","url":normalizeStream("https://haititivi.com/haiti/vastudio/tracks-v1a1/mono.m3u8"),"genre":"music"},
        {"id":"channel35","name":"Radio Tele Planet Compas","logo":"https://play-lh.googleusercontent.com/2TF7iHbKnP1TNz4bnaY8aqozDJ-fK58dyRIANbZvt1XQkpvr57ELdUSpSi0LCHb5waot","url":normalizeStream("https://5dcab9aed5331.streamlock.net/mrcompas1/livestream/playlist.m3u8"),"genre":"music"}
    ];

    let currentFocus = { type: 'nav', index: 0, gridIndex: 0 };
    let filteredChannels = [...CHANNELS];
    let hls = null;
    let activityTimer = null;

    const grid = document.getElementById('grid');
    const navItems = document.querySelectorAll('.nav-item');
    const player = document.getElementById('player');
    const video = document.getElementById('videoPlayer');
    const backBtn = document.getElementById('backBtn');

    function updateView() {
        grid.innerHTML = '';
        const activeNav = document.querySelector('.nav-item.active');
        const cat = activeNav.dataset.cat;
        document.getElementById('catHeader').innerText = activeNav.innerText;
        
        filteredChannels = CHANNELS.filter(c => cat === 'all' || c.genre === cat);
        
        filteredChannels.forEach((ch, idx) => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.id = `ch-${idx}`;
            card.innerHTML = `
                <div class="thumb-container"><img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/200x112/21262d/8b949e?text=TV'"></div>
                <div class="channel-name">${ch.name}</div>
                <div class="channel-badge">LIVE</div>
            `;
            card.onclick = () => play(ch.url);
            grid.appendChild(card);
        });
    }

    function applyFocus() {
        document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
        
        if (player.classList.contains('active')) {
            backBtn.classList.add('focused');
            return;
        }

        if (currentFocus.type === 'nav') {
            navItems[currentFocus.index].classList.add('focused');
        } else {
            const card = document.getElementById(`ch-${currentFocus.gridIndex}`);
            if (card) {
                card.classList.add('focused');
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }

    function showControls() {
        if (!player.classList.contains('active')) return;
        
        player.classList.add('user-active');
        applyFocus();

        if (activityTimer) clearTimeout(activityTimer);
        activityTimer = setTimeout(() => {
            player.classList.remove('user-active');
        }, 3000);
    }

    function moveFocus(dir) {
        if (player.classList.contains('active')) {
            showControls();
            return;
        }

        if (currentFocus.type === 'nav') {
            if (dir === 'DOWN') {
                currentFocus.index = Math.min(currentFocus.index + 1, navItems.length - 1);
            } else if (dir === 'UP') {
                currentFocus.index = Math.max(currentFocus.index - 1, 0);
            } else if (dir === 'RIGHT') {
                if (filteredChannels.length > 0) {
                    currentFocus.type = 'grid';
                    currentFocus.gridIndex = 0;
                }
            }
        } else {
            const containerWidth = document.getElementById('content-area').offsetWidth;
            const cols = Math.floor(containerWidth / 260) || 1;
            
            if (dir === 'LEFT') {
                if (currentFocus.gridIndex % cols === 0) {
                    currentFocus.type = 'nav';
                } else {
                    currentFocus.gridIndex--;
                }
            } else if (dir === 'RIGHT') {
                currentFocus.gridIndex = Math.min(currentFocus.gridIndex + 1, filteredChannels.length - 1);
            } else if (dir === 'DOWN') {
                currentFocus.gridIndex = Math.min(currentFocus.gridIndex + cols, filteredChannels.length - 1);
            } else if (dir === 'UP') {
                if (currentFocus.gridIndex >= cols) {
                    currentFocus.gridIndex -= cols;
                }
            }
        }
        applyFocus();
    }

    function select() {
        if (player.classList.contains('active')) {
            if (player.classList.contains('user-active')) {
                stopPlayer();
            } else {
                showControls();
            }
            return;
        }
        
        if (currentFocus.type === 'nav') {
            navItems.forEach(n => n.classList.remove('active'));
            navItems[currentFocus.index].classList.add('active');
            currentFocus.gridIndex = 0;
            updateView();
            applyFocus();
        } else {
            const ch = filteredChannels[currentFocus.gridIndex];
            if (ch) play(ch.url);
        }
    }

    function play(url) {
        player.classList.add('active');
        showControls();
        
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    function stopPlayer() {
        player.classList.remove('active');
        player.classList.remove('user-active');
        video.pause();
        video.src = "";
        if (hls) {
            hls.destroy();
            hls = null;
        }
        applyFocus();
    }

    window.addEventListener('keydown', (e) => {
        switch(e.keyCode) {
            case 37: moveFocus('LEFT'); break;
            case 38: moveFocus('UP'); break;
            case 39: moveFocus('RIGHT'); break;
            case 40: moveFocus('DOWN'); break;
            case 13: select(); break;
            case 27: case 8:
                if (player.classList.contains('active')) {
                    stopPlayer();
                    e.preventDefault();
                }
                break;
        }
    });

    window.addEventListener('mousemove', () => { if(player.classList.contains('active')) showControls(); });
    window.addEventListener('touchstart', () => { if(player.classList.contains('active')) showControls(); });

    navItems.forEach((item, idx) => {
        item.onclick = () => {
            currentFocus.type = 'nav';
            currentFocus.index = idx;
            select();
        };
    });

    backBtn.onclick = (e) => {
        e.stopPropagation();
        stopPlayer();
    };

    updateView();
    applyFocus();
</script>
</body>
