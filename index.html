    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        setLogLevel('debug');
        
        // Expose global variables for use in the script
        window.initializeApp = initializeApp;
        window.getAuth = getAuth;
        window.signInAnonymously = signInAnonymously;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.getFirestore = getFirestore;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1f2937;
            color: #d1d5db;
        }
        .scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .channel-card {
            min-height: 180px;
        }
        .channel-card-logo {
            width: 100%;
            height: auto;
            max-width: 120px;
            max-height: 80px;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }
        .channel-card:hover .channel-card-logo {
            transform: scale(1.1);
        }
        .video-player-container, .exit-modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .video-player-content {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
        }
        .video-player {
            width: 100%;
            height: 100%;
            display: block;
        }
        .selected-card {
            border: 2px solid #ca8a04;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

    <script type="module">
        // Global variables for Firebase services
        let db;
        let auth;
        let userId = 'default-user-id'; // Default ID for anonymous users
        let channelData = [];
        let favorites = new Set();
        let currentFilter = 'all';
        let hlsInstance = null;
        let currentFocusedIndex = -1; // New variable to track keyboard focus
        let focusedSection = 'menu'; // 'menu' or 'channels'
        let lastSelectedChannelId = null; // New variable to store the ID of the last played channel
        
        // Get global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // DOM Elements
        const channelsList = document.getElementById('channels-list');
        const channelCount = document.getElementById('channel-count');
        const videoModal = document.getElementById('video-modal');
        const videoPlayer = document.getElementById('video-player');
        const loadingSpinner = document.getElementById('loading-spinner');
        const videoContent = document.querySelector('.video-player-content');
        const allChannelsBtn = document.getElementById('all-channels-btn');
        const favoritesBtn = document.getElementById('favorites-btn');
        const mainTitle = document.getElementById('main-title');
        const exitModal = document.getElementById('exit-modal');
        const confirmExitBtn = document.getElementById('confirm-exit-btn');
        const cancelExitBtn = document.getElementById('cancel-exit-btn');
        const exitPlayerBtn = document.getElementById('exit-btn');
        
        // Main app initialization function
        async function initApp() {
            // First, load and render channels immediately
            fetchChannels();

            // Then, initialize Firebase and handle user authentication in the background
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Handle user authentication
            if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                } catch (error) {
                    console.error("Error signing in with custom token, signing in anonymously:", error);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }

            // Listen for auth state changes to update the favorites list
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("Authenticated with user ID:", userId);
                    listenToFavorites();
                } else {
                    console.log("User is signed out.");
                }
            });

            // Event listeners
            confirmExitBtn.addEventListener('click', () => window.history.back());
            cancelExitBtn.addEventListener('click', () => exitModal.style.display = 'none');
            allChannelsBtn.addEventListener('click', () => filterChannels('all'));
            favoritesBtn.addEventListener('click', () => filterChannels('favorites'));
            exitPlayerBtn.addEventListener('click', exitVideoPlayer);
            
            // Add global keydown listener for remote control navigation
            document.addEventListener('keydown', handleKeyNavigation);
        }

        // Fetch channel data from JSON file
        function fetchChannels() {
            try {
                const channelsJsonText = document.getElementById('channels-data').textContent;
                channelData = JSON.parse(channelsJsonText);
                renderChannels();
            } catch (error) {
                console.error("Failed to load channel data:", error);
                channelsList.innerHTML = `<p class="text-red-400 text-center">Failed to load channels. Please try again later.</p>`;
            }
        }

        // Firestore listener for real-time favorite updates
        function listenToFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            onSnapshot(userFavoritesRef, (doc) => {
                if (doc.exists()) {
                    favorites = new Set(doc.data().channels || []);
                } else {
                    favorites = new Set();
                }
                renderChannels();
            });
        }
        
        // Save favorites to Firestore
        async function saveFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            try {
                await setDoc(userFavoritesRef, { channels: Array.from(favorites) }, { merge: true });
            } catch (error) {
                console.error("Error saving favorites:", error);
            }
        }

        // Lazy loading observer
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target.querySelector('img');
                    img.src = img.dataset.src;
                    img.onerror = () => {
                        img.src = "https://placehold.co/120x80/000000/FFFFFF?text=Logo+Fail";
                    };
                    observer.unobserve(entry.target);
                }
            });
        });

        // Renders the list of channels based on the current filter
        function renderChannels() {
            channelsList.innerHTML = '';
            const filteredChannels = channelData.filter(channel => 
                currentFilter === 'all' || favorites.has(channel.id)
            );

            // Update main title with filtered count
            mainTitle.textContent = `${currentFilter === 'all' ? 'All Channels' : 'Favorites'} (${filteredChannels.length})`;

            if (filteredChannels.length === 0 && currentFilter === 'favorites') {
                channelsList.innerHTML = `<p class="text-gray-400 text-center col-span-full mt-10">You have no favorite channels. Add some by clicking the star icon!</p>`;
            }
            
            filteredChannels.forEach(channel => {
                const card = createChannelCard(channel);
                channelsList.appendChild(card);
                observer.observe(card); // Start observing for lazy loading
            });

            // Set initial focus for keyboard navigation
            currentFocusedIndex = filteredChannels.length > 0 ? 0 : -1;
            focusedSection = 'channels';
            updateFocus(currentFocusedIndex);

            channelCount.textContent = filteredChannels.length;
        }
        
        // Toggles the filter between all and favorites
        function filterChannels(filter) {
            currentFilter = filter;
            allChannelsBtn.classList.toggle('bg-yellow-600', filter === 'all');
            allChannelsBtn.classList.toggle('bg-gray-700', filter !== 'all');
            favoritesBtn.classList.toggle('bg-yellow-600', filter === 'favorites');
            favoritesBtn.classList.toggle('bg-gray-700', filter !== 'all');
            renderChannels();
        }

        // Creates a single channel card element
        function createChannelCard(channel) {
            const isFavorite = favorites.has(channel.id);
            const card = document.createElement('div');
            // Re-adding hover classes for the highlight effect
            card.className = "channel-card bg-gray-900 p-6 rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 hover:shadow-2xl hover:bg-gray-800 cursor-pointer flex flex-col items-center justify-center space-y-4 relative group";
            card.dataset.stream = channel.stream;
            card.dataset.name = channel.name;
            card.dataset.id = channel.id;
            // Add a tabindex to make the card focusable
            card.setAttribute('tabindex', '0');

            const logo = document.createElement('img');
            logo.dataset.src = channel.logo; // Use data-src for lazy loading
            logo.alt = `${channel.name} logo`;
            logo.className = "channel-card-logo";

            const name = document.createElement('h3');
            name.textContent = channel.name;
            name.className = "text-lg font-semibold text-yellow-600 text-center mt-2";

            const favoriteIcon = document.createElement('i');
            // Using 'group-hover' to make the icon's color change when the card is hovered
            favoriteIcon.className = `fas fa-star absolute top-2 right-2 text-xl cursor-pointer transition-colors duration-200 ${isFavorite ? 'text-yellow-500' : 'text-gray-500 group-hover:text-yellow-300'}`;
            favoriteIcon.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent the card click event from firing
                toggleFavorite(channel.id);
            });

            card.appendChild(logo);
            card.appendChild(name);
            card.appendChild(favoriteIcon);
            
            card.addEventListener('click', handleChannelClick);
            return card;
        }

        // Toggles a channel's favorite status
        function toggleFavorite(channelId) {
            if (favorites.has(channelId)) {
                favorites.delete(channelId);
            } else {
                favorites.add(channelId);
            }
            saveFavorites();
            renderChannels(); // Re-render to update the icons
        }

        function playStream(streamUrl) {
            // Gracefully stop and destroy the existing HLS stream before creating a new one
            if (hlsInstance) {
                hlsInstance.stopLoad();
                hlsInstance.detachMedia();
                try {
                    hlsInstance.destroy();
                } catch (e) {
                    console.error("Error destroying HLS instance:", e);
                }
                hlsInstance = null;
            }

            // The `hls.js` library is a robust solution for HLS streams, which are often tokenized.
            // We specifically check for .m3u8 and streams with 'extension=ts' in the URL to use hls.js.
            if (Hls.isSupported() && (streamUrl.endsWith('.m3u8') || streamUrl.includes('extension=ts'))) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoPlayer);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play();
                });
                
                // Handle fatal errors with retries or messages
                let errorRetries = 0;
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                displayErrorMessage("Stream is offline or no longer available.");
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                if (errorRetries < 2) {
                                    errorRetries++;
                                    hlsInstance.recoverMediaError();
                                } else {
                                    displayErrorMessage("Media error: Failed to play stream.");
                                }
                                break;
                            default:
                                displayErrorMessage("An unknown error occurred. Please try another channel.");
                                break;
                        }
                        loadingSpinner.classList.add('hidden');
                        videoContent.classList.add('hidden');
                    }
                });
            } else {
                // For other formats or non-Hls.js compatible browsers, try native playback
                videoPlayer.src = streamUrl;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    videoPlayer.play();
                });
                videoPlayer.onerror = () => {
                    displayErrorMessage("Your browser encountered an error with this stream.");
                    loadingSpinner.classList.add('hidden');
                    videoContent.classList.add('hidden');
                };
            }
        }

        // Handles the click event for playing a channel
        function handleChannelClick(event) {
            const card = event.currentTarget;
            const streamUrl = card.dataset.stream;
            const channelName = card.dataset.name;
            lastSelectedChannelId = card.dataset.id; // Store the ID of the last selected channel

            document.title = `Haitian TV Channels - ${channelName}`;
            
            loadingSpinner.classList.remove('hidden');
            videoContent.classList.add('hidden');
            
            playStream(streamUrl);
            
            videoPlayer.onplay = () => {
                loadingSpinner.classList.add('hidden');
                videoContent.classList.remove('hidden');
            };

            videoModal.style.display = 'flex';

            // Set focus to the exit button when the modal opens
            exitPlayerBtn.focus();
            
            // Request full screen on the video player
            if (videoPlayer.requestFullscreen) {
                videoPlayer.requestFullscreen();
            }
        }
        
        // Exits the video player and modal
        function exitVideoPlayer() {
            // Exit fullscreen if active
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }

            if (hlsInstance) {
                hlsInstance.stopLoad();
                hlsInstance.detachMedia();
                try {
                    hlsInstance.destroy();
                } catch (e) {
                    console.error("Error destroying HLS instance on exit:", e);
                }
                hlsInstance = null;
            }
            videoPlayer.pause();
            videoPlayer.removeAttribute('src');
            videoModal.style.display = 'none';
            document.title = "Haitian TV Channels";
            
            // Re-select the last focused channel after exiting
            if (lastSelectedChannelId) {
                const filteredChannels = channelData.filter(channel => currentFilter === 'all' || favorites.has(channel.id));
                const lastChannelIndex = filteredChannels.findIndex(c => c.id === lastSelectedChannelId);
                if (lastChannelIndex !== -1) {
                    currentFocusedIndex = lastChannelIndex;
                    updateFocus(currentFocusedIndex);
                }
            } else {
                currentFocusedIndex = -1;
                updateFocus(currentFocusedIndex);
            }
        }

        function showExitModal() {
            exitModal.style.display = 'flex';
            // Set focus to the confirm button
            confirmExitBtn.focus();
        }

        // Displays a temporary error message
        function displayErrorMessage(message) {
            const messageBox = document.createElement('div');
            messageBox.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 p-4 bg-red-500 text-white rounded-lg shadow-xl text-center z-20';
            messageBox.textContent = message;
            videoModal.appendChild(messageBox);
            setTimeout(() => {
                videoModal.removeChild(messageBox);
            }, 3000); // Hide the message after 3 seconds
        }
        
        // Handles navigation using the keyboard or TV remote
        function handleKeyNavigation(event) {
            const key = event.key;
            const channelCards = Array.from(channelsList.querySelectorAll('.channel-card'));
            const menuButtons = [allChannelsBtn, favoritesBtn];
            
            const numChannels = channelCards.length;
            const numButtons = menuButtons.length;

            const isVideoPlaying = videoModal.style.display === 'flex';
            const isExitModalVisible = exitModal.style.display === 'flex';
            
            // Handle back button presses based on current view
            if (key === 'Escape' || key === 'Backspace' || key === 'GoBack') {
                event.preventDefault(); // Prevents the OS from processing the key press

                if (isVideoPlaying) {
                    exitVideoPlayer();
                    return;
                } else if (isExitModalVisible) {
                    cancelExitBtn.click();
                    return;
                } else {
                    showExitModal();
                    return;
                }
            }

            // Handle other navigation keys
            if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight' || key === 'Enter') {
                event.preventDefault();
                let nextIndex = currentFocusedIndex;

                if (isVideoPlaying) {
                    // When video modal is open, only the exit button is focusable
                    if (key === 'Enter') {
                        exitPlayerBtn.click();
                    }
                    return;
                }
                
                if (isExitModalVisible) {
                    // Navigate between 'Exit' and 'Cancel' buttons
                    const buttons = [confirmExitBtn, cancelExitBtn];
                    const focusedButtonIndex = buttons.findIndex(btn => btn === document.activeElement);
                    if (key === 'ArrowLeft' || key === 'ArrowRight') {
                        const nextButtonIndex = (focusedButtonIndex + 1) % buttons.length;
                        buttons[nextButtonIndex].focus();
                    } else if (key === 'Enter') {
                        document.activeElement.click();
                    }
                    return;
                }

                if (focusedSection === 'menu') {
                    if (key === 'ArrowDown') {
                        focusedSection = 'channels';
                        nextIndex = 0;
                    } else if (key === 'ArrowRight') {
                        nextIndex = (currentFocusedIndex + 1) % numButtons;
                    } else if (key === 'ArrowLeft') {
                        nextIndex = (currentFocusedIndex - 1 + numButtons) % numButtons;
                    } else if (key === 'Enter') {
                        menuButtons[currentFocusedIndex].click();
                        return;
                    }
                } else { // focusedSection === 'channels'
                    const columns = getComputedStyle(channelsList).gridTemplateColumns.split(' ').length;
                    if (key === 'ArrowDown') {
                        nextIndex = (currentFocusedIndex + columns);
                        if (nextIndex >= numChannels) {
                            nextIndex = numChannels - 1;
                        }
                    } else if (key === 'ArrowUp') {
                        nextIndex = (currentFocusedIndex - columns);
                        if (nextIndex < 0) {
                            focusedSection = 'menu';
                            nextIndex = 0;
                        }
                    } else if (key === 'ArrowRight') {
                        nextIndex = (currentFocusedIndex + 1) % numChannels;
                    } else if (key === 'ArrowLeft') {
                        nextIndex = (currentFocusedIndex - 1 + numChannels) % numChannels;
                    } else if (key === 'Enter') {
                        if (numChannels > 0) {
                            channelCards[currentFocusedIndex].click();
                        }
                        return;
                    }
                }
                currentFocusedIndex = nextIndex;
                updateFocus(currentFocusedIndex);
            }
        }

        // Applies the 'selected-card' class and scrolls the element into view
        function updateFocus(index) {
            const focusableElements = focusedSection === 'menu' ? 
                [allChannelsBtn, favoritesBtn] : 
                Array.from(channelsList.querySelectorAll('.channel-card'));
            
            // Remove selection from all elements
            focusableElements.forEach(el => el.classList.remove('selected-card', 'bg-yellow-600', 'text-black', 'bg-gray-700'));
            
            if (index >= 0 && index < focusableElements.length) {
                const element = focusableElements[index];
                if (focusedSection === 'menu') {
                    element.classList.add('selected-card', 'bg-yellow-600', 'text-black');
                    element.classList.remove('bg-gray-700');
                } else {
                    element.classList.add('selected-card');
                }
                element.focus({ preventScroll: true });
                // Scroll into view if it's a channel card
                if (focusedSection === 'channels') {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else if (focusedSection === 'menu') {
                allChannelsBtn.focus();
            }
        }

        // Start the application
        window.onload = initApp;
    </script>
</body>
</html>
