<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>TlouTV Pro — Firestick Fixed (VLC Intent)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0c10;
            --bg-surface: #161b22;
            --bg-card: #21262d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #ffae00; 
            --focus-glow: rgba(255, 174, 0, 0.4);
            --safe-zone: 40px; 
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
            padding: var(--safe-zone);
            gap: 30px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 30px;
            padding-left: 15px;
        }

        .nav-item {
            padding: 16px 20px;
            border-radius: 12px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            font-weight: 600;
            border: 3px solid transparent;
            text-align: left;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-item.focused {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .nav-item.active {
            color: var(--accent);
            background: rgba(255, 174, 0, 0.1);
        }

        .content {
            height: calc(100vh - (var(--safe-zone) * 2));
            overflow-y: auto;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }

        .category-title {
            font-family: 'Outfit';
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 100px;
        }

        .channel-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 15px;
            border: 4px solid transparent;
            transition: all 0.2s ease;
        }

        .channel-card.focused {
            border-color: var(--accent);
            transform: scale(1.08);
            box-shadow: 0 0 20px var(--focus-glow);
        }

        .thumb-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .thumb-container img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fullscreen Player Fallback (In case VLC fails) */
        .player-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            display: none;
        }
        .player-overlay.active { display: block; }

        #videoPlayer {
            width: 100%;
            height: 100%;
        }

        .loading-spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 24px;
            text-align: center;
        }

        .player-controls {
            position: absolute;
            bottom: 50px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
        }

        .btn-back {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 20px;
            border: 4px solid white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="logo">TlouTV</div>
        <div id="nav-list">
            <div class="nav-item active" data-cat="all">All Channels</div>
            <div class="nav-item" data-cat="news">News</div>
            <div class="nav-item" data-cat="general">General</div>
            <div class="nav-item" data-cat="music">Music</div>
            <div class="nav-item" data-cat="religious">Religious</div>
            <div class="nav-item" data-cat="sports">Sports</div>
        </div>
    </div>

    <div class="content" id="scroll-box">
        <div id="cat-label" class="category-title">All Channels</div>
        <div class="channel-grid" id="channel-grid"></div>
    </div>
</div>

<!-- Fallback Player Overlay -->
<div class="player-overlay" id="player">
    <div class="loading-spinner">
        Launching VLC...<br>
        <small style="font-size: 14px; opacity: 0.7;">If it doesn't open, press ENTER to try web player.</small>
    </div>
    <video id="videoPlayer"></video>
    <div class="player-controls">
        <div class="btn-back" id="backBtn">BACK TO MENU</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const CHANNELS = [
        {"id":"tele6","name":"Radio Tele 6 Univers","logo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQhFbArTFlXYPUKKJ_oesEtaxdKyvQBn8D1w&s","url":"https://acwstream.com/lakay/tele6/tracks-v1a1/mono.m3u8","genre":"general"},
        {"id":"channel1","name":"Radio Tele Caraibes","logo":"https://ifex.org/wp-content/uploads/2025/03/haiti-radio-television-caraibes-arson-attack-facebook.jpeg","url":"https://bozztv.com/dvrfl03/hdirect/hdirect-telecaraibes/index.m3u8","genre":"general"},
        {"id":"channel2","name":"Radio Tele Ginen","logo":"https://yt3.googleusercontent.com/ytc/AIdro_k18hgxxj--vlOpIKL8WQ-wOw6AvskQT8eXIPn3qWx4-TU=s900-c-k-c0x00ffffff-no-rj","url":"http://teleginen.srfms.com:1935/teleginen/livestream/playlist.m3u8","genre":"news"},
        {"id":"channel3","name":"Tele Pacific","logo":"https://static.wikia.nocookie.net/logopedia/images/e/e6/Radio_T%C3%A9l%C3%A9_Pacific_Logo.png","url":"https://hls-p1st0n8r.livepush.io/live_cdn/nsOk3qoty1d5HDD/emB7xoUdyMbnjH8/tracks-v1a1/mono.m3u8","genre":"news"},
        {"id":"channel4","name":"Haiti News","logo":"https://m.media-amazon.com/images/I/611Ffvky5yL.png","url":"https://haititivi.com/website/haitinews/index.m3u8","genre":"news"},
        {"id":"channel5","name":"Telemix","logo":"https://i.ibb.co/RB7dzZq/logo-mix-2.png","url":"https://haititivi.com/haiti/telemix1/tracks-v1a1/mono.m3u8","genre":"general"},
        {"id":"channel6","name":"Kajou TV","logo":"https://static.wixstatic.com/media/d205b7_ced5950afd8849e2b21a72f36b3a16ff~mv2.png","url":"https://video1.getstreamhosting.com:1936/8055/8055/chunklist_w1507178321.m3u8","genre":"general"},
        {"id":"channel7","name":"RTH 2000","logo":"https://i.imgur.com/4z0FiEA.png","url":"https://2-fss-2.streamhoster.com/pl_120/amlst:206708-4203440/chunklist_b1998000.m3u8","genre":"general"},
        {"id":"channel8","name":"RTH 2000 TV2","logo":"https://i.imgur.com/4z0FiEA.png","url":"https://2-fss-2.streamhoster.com/pl_122/amlst:206708-4202592/chunklist_b1966000.m3u8","genre":"general"},
        {"id":"channel9","name":"Radio Tele Puissance","logo":"https://radiotelepuissance.com/wp-content/uploads/2020/08/cropped-radio-logo-1.png","url":"https://video1.getstreamhosting.com:1936/8560/8560/chunklist_w486676635.m3u8","genre":"religious"},
        {"id":"channel11","name":"Tele Pam","logo":"https://i.imgur.com/zfnFVqQ.png","url":"https://acwstream.com/acw/stream/telepam/tracks-v1/index.fmp4.m3u8","genre":"general"},
        {"id":"channel12","name":"Radio Tele Boston","logo":"https://i.ibb.co/x3Gx3Ps/unnamed.png","url":"https://tv2.fastcast4u.com:3238/live/radiotelebostonlive.m3u8","genre":"religious"},
        {"id":"channel15","name":"Nago TV","logo":"https://i.ibb.co/fSnCtJb/nago-tv.png","url":"https://acwstream.com/lakay/nagotv/tracks-v1a1/mono.m3u8","genre":"music"},
        {"id":"channel16","name":"Tele 4VEH","logo":"https://4veh.org/en/wp-content/uploads/2021/08/2021-logo-RT-4VEH-ENG-v8.png","url":"https://uni01rtmp.tulix.tv/4vehtv/4vehtv-firetv/playlist.m3u8","genre":"religious"},
        {"id":"channel17","name":"Tele Louange","logo":"https://editor.zenomedia.com/resources/zs_station/436269/CardWebsite/image.png","url":"https://5790d294af2dc.streamlock.net/8124/8124/chunklist_w1901943944.m3u8","genre":"religious"},
        {"id":"channel21","name":"Afrobeats","logo":"https://www.shutterstock.com/image-vector/afro-beat-text-african-drums-260nw-1741803605.jpg","url":"https://stream.ecable.tv/afrobeats/index.m3u8","genre":"music"},
        {"id":"channel22","name":"Trace Urban","logo":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Trace_Urban_logo_2010.svg/2560px-Trace_Urban_logo_2010.svg.png","url":"https://lightning-traceurban-samsungau.amagi.tv/playlist.m3u8","genre":"music"},
        {"id":"channel29","name":"Totalmix Radio","logo":"https://cdn-radiotime-logos.tunein.com/s127273g.png","url":"https://media.streambrothers.com:1936/hpgnrhawxv/hpgnrhawxv/chunklist_w1967596347.m3u8","genre":"sports"},
        {"id":"channel30","name":"Rezo Boul","logo":"https://www.rezoboul.com/uploads/images/logo_site_1714115779.png","url":"https://cdn1.ayitistream.com/web-r1/tracks-v1/index.fmp4.m3u8","genre":"sports"}
    ];

    let state = {
        focus: 'nav',
        navIdx: 0,
        gridIdx: 0,
        filtered: [],
        playing: false,
        vlcAttempted: false
    };

    const navItems = document.querySelectorAll('.nav-item');
    const grid = document.getElementById('channel-grid');
    const scrollBox = document.getElementById('scroll-box');
    const player = document.getElementById('player');
    const video = document.getElementById('videoPlayer');
    const backBtn = document.getElementById('backBtn');
    let hls = null;

    function renderGrid() {
        const cat = navItems[state.navIdx].dataset.cat;
        document.getElementById('cat-label').innerText = navItems[state.navIdx].innerText;
        state.filtered = CHANNELS.filter(c => cat === 'all' || c.genre === cat);
        grid.innerHTML = '';
        state.filtered.forEach((ch, i) => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="thumb-container"><img src="${ch.logo}"></div>
                <div class="channel-name">${ch.name}</div>
            `;
            grid.appendChild(card);
        });
        scrollBox.scrollTop = 0;
    }

    function updateFocus() {
        document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
        if (state.playing) {
            backBtn.classList.add('focused');
            return;
        }
        if (state.focus === 'nav') {
            navItems[state.navIdx].classList.add('focused');
        } else {
            const el = document.getElementById(`card-${state.gridIdx}`);
            if (el) {
                el.classList.add('focused');
                const topPos = el.offsetTop - scrollBox.offsetTop - 100;
                scrollBox.scrollTo({ top: topPos, behavior: 'smooth' });
            }
        }
    }

    function handleEnter() {
        if (state.playing) {
            // If user clicks enter while on the "Launching VLC" screen, trigger web player fallback
            const channel = state.filtered[state.gridIdx];
            startWebPlayback(channel.url);
            return;
        }

        if (state.focus === 'nav') {
            navItems.forEach(n => n.classList.remove('active'));
            navItems[state.navIdx].classList.add('active');
            renderGrid();
            if (state.filtered.length > 0) {
                state.focus = 'grid';
                state.gridIdx = 0;
            }
        } else {
            const channel = state.filtered[state.gridIdx];
            if (channel) launchVLC(channel.url);
        }
        updateFocus();
    }

    /**
     * Launch VLC using Android Intents
     */
    function launchVLC(url) {
        state.playing = true;
        state.vlcAttempted = true;
        player.classList.add('active');
        
        // Android Intent for VLC
        // This will attempt to open VLC directly on Firestick/Android
        const vlcIntent = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;S.title=${encodeURIComponent(state.filtered[state.gridIdx].name)};end`;
        
        console.log("Launching VLC Intent:", vlcIntent);
        window.location.href = vlcIntent;

        // Auto-close overlay after 10 seconds if user stayed in browser (VLC didn't take over)
        setTimeout(() => {
            if (state.playing && !video.src) {
                stopPlayback();
            }
        }, 10000);
    }

    function startWebPlayback(url) {
        player.querySelector('.loading-spinner').innerHTML = "Loading Web Stream...";
        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = url;
            video.play();
        }
    }

    function stopPlayback() {
        state.playing = false;
        player.classList.remove('active');
        video.pause();
        video.src = "";
        if (hls) hls.destroy();
        updateFocus();
    }

    window.addEventListener('keydown', (e) => {
        const key = e.keyCode;
        if (key === 13) {
            e.preventDefault();
            handleEnter();
        } else if (key === 8 || key === 27 || key === 10009) {
            if (state.playing) {
                e.preventDefault();
                stopPlayback();
            }
        } else if (!state.playing) {
            if (key === 38) { // UP
                if (state.focus === 'nav') state.navIdx = Math.max(0, state.navIdx - 1);
                else {
                    const cols = Math.floor(grid.offsetWidth / 240);
                    if (state.gridIdx >= cols) state.gridIdx -= cols;
                }
            } else if (key === 40) { // DOWN
                if (state.focus === 'nav') state.navIdx = Math.min(navItems.length - 1, state.navIdx + 1);
                else {
                    const cols = Math.floor(grid.offsetWidth / 240);
                    state.gridIdx = Math.min(state.filtered.length - 1, state.gridIdx + cols);
                }
            } else if (key === 37) { // LEFT
                if (state.focus === 'grid') {
                    const cols = Math.floor(grid.offsetWidth / 240);
                    if (state.gridIdx % cols === 0) state.focus = 'nav';
                    else state.gridIdx--;
                }
            } else if (key === 39) { // RIGHT
                if (state.focus === 'nav' && state.filtered.length > 0) state.focus = 'grid';
                else if (state.focus === 'grid') state.gridIdx = Math.min(state.filtered.length - 1, state.gridIdx + 1);
            }
            updateFocus();
        }
    });

    renderGrid();
    updateFocus();
</script>

</body>
</html>
