<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TlouTV — Live Haitian TV</title>
<meta name="theme-color" content="#0ea5e9" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --header-h: 72px; /* set at runtime */
    --bg:#0a0f1f; --text:#e9eef7; --muted:#9fb2c7;
    --menu-bg: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    --ring: 0 0 0 4px rgba(79,140,255,.33);

    /* Deep blue tile palette */
    --tile-bg-top:#153066;
    --tile-bg-bot:#0e224a;
    --tile-border:#1b3a7c;
    --tile-border-strong:#5ba0ff;
    --tile-focus-bg:#153a73;
    --logo-canvas:#0b1634;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 5% -10%, rgba(124,58,237,.18), transparent 42%),
      radial-gradient(900px 600px at 110% 0%, rgba(34,211,238,.10), transparent 45%),
      var(--bg);
    overscroll-behavior: contain;
    -webkit-tap-highlight-color: transparent;
    padding-top: calc(var(--header-h) + env(safe-area-inset-top));
  }

  /* Header */
  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:12px 18px;
    backdrop-filter: blur(6px);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:42px; height:42px; border-radius:12px; background:#0000002a; display:grid; place-items:center; }
  .brand .title{ font:800 19px/1 Outfit,Inter,sans-serif; letter-spacing:.3px }
  .brand .sub{ font-size:10px; letter-spacing:2px; color:#a9f0ff; text-transform:uppercase }

  /* Layout */
  .app{
    display:grid; grid-template-columns: 240px 1fr;
    height: calc(100vh - var(--header-h) - env(safe-area-inset-top));
  }

  /* Left Menu */
  .menu{
    border-right:1px solid rgba(255,255,255,.08);
    background: var(--menu-bg);
    padding:14px 10px 24px; overflow:auto;
  }
  .menu h3{ margin:6px 10px 10px; font:700 12px/1 Outfit,Inter; letter-spacing:1px; color:var(--muted); text-transform:uppercase }
  .mitem{
    display:flex; align-items:center; gap:12px; width:100%;
    border:1px solid rgba(255,255,255,.07);
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    color:var(--text); padding:14px; margin:10px 6px; border-radius:14px;
    text-align:left; cursor:pointer; outline:none; touch-action:manipulation;
  }
  .mitem .dot{ width:8px; height:8px; border-radius:50%; background:#22d3ee; opacity:.85 }
  .mitem.active{ outline:var(--ring); border-color:rgba(79,140,255,.45) }
  .focused-menu{ outline:var(--ring); border-color:rgba(79,140,255,.55) }

  /* Content / Grid */
  .content{ overflow:auto; padding:16px 18px 28px; scroll-behavior:auto }
  .search-row{ display:flex; gap:10px; align-items:center; margin:6px 0 16px }
  .search{
    flex:1; padding:13px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.07); color:var(--text); font-size:17px;
  }

  /* Grid — bigger tiles; responsive columns */
  .grid{
    display:grid; gap:16px;
    grid-template-columns: repeat(2, minmax(0,1fr)); /* phones default bigger */
  }
  @media(min-width:600px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media(min-width:960px){ .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media(min-width:1280px){ .grid{ grid-template-columns: repeat(5, minmax(0,1fr)); } }
  @media(min-width:1600px){ .grid{ grid-template-columns: repeat(6, minmax(0,1fr)); } }

  /* TV / Fire TV — larger tiles and gaps */
  body.tv .grid{ grid-template-columns: repeat(5, minmax(0,1fr)); gap:22px; }
  body.tv .card{ min-height: 260px; }
  body.tv .logo img{ width:94%; height:94%; }
  body.tv .title{ font-size:17px; }
  body.tv .meta{ font-size:14px; }

  .card{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:12px; padding:16px 14px;
    border-radius:16px;
    background: linear-gradient(180deg, var(--tile-bg-top), var(--tile-bg-bot));
    color:#f1f5ff;
    border:2px solid var(--tile-border);
    outline:none; cursor:pointer; touch-action:manipulation;
    min-height: 200px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.18);
  }
  .logo{
    width:100%;
    aspect-ratio: 1/1;
    border-radius:12px;
    background:var(--logo-canvas);
    display:grid; place-items:center; overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .logo img{ width:92%; height:92%; object-fit:contain }

  .title{
    text-align:center; font-weight:800; font-size:15px; line-height:1.1;
    width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .meta{
    font-size:12.5px; color:#c4d7ff; text-align:center;
    width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .focused-card{
    border-color: var(--tile-border-strong);
    box-shadow: 0 0 0 4px var(--tile-border-strong);
    background: linear-gradient(180deg, var(--tile-focus-bg), var(--tile-bg-bot));
  }
  .card:focus-visible{ outline:none }

  /* Player overlay */
  .overlay{ position:fixed; inset:0; z-index:50; display:none; }
  .overlay.show{ display:block }
  .overlay.controls-hidden .close-btn,
  .overlay.controls-hidden .error-tray{ display:none !important; }
  .shade{ position:absolute; inset:0; background:rgba(0,0,0,.9) }
  .player-wrap{ position:absolute; inset:0; display:grid; place-items:center; }
  video{ width:100vw; height:100vh; background:#000; outline:none; }

  .close-btn{
    position:absolute; top:16px; right:16px; z-index:60;
    padding:12px 16px; border-radius:14px;
    border:1px solid rgba(255,255,255,.28);
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
    color:#fff; font-weight:800; cursor:pointer;
    outline:none; touch-action:manipulation;
  }
  .close-btn:focus-visible, .close-btn.focused{
    outline:4px solid #22d3ee; box-shadow:0 0 0 6px rgba(34,211,238,.35);
  }

  .error-tray{
    position:absolute; left:16px; bottom:16px; z-index:60;
    display:flex; gap:10px; flex-wrap:nowrap; align-items:center;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2);
    border-radius:12px; padding:10px 12px;
  }
  .e-btn{ border-radius:10px; border:1px solid rgba(255,255,255,.25); padding:9px 12px; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; touch-action:manipulation; }
  .e-btn:focus-visible, .e-btn.focus{ outline:4px solid rgba(91,160,255,.6) }

  .back-toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:70; padding:10px 14px; border-radius:12px;
    background:rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.18);
    color:#fff; font-weight:700; font-size:13px; letter-spacing:.2px;
    opacity:0; pointer-events:none; transition:opacity .15s linear;
  }
  .back-toast.show{ opacity:1; }

  /* Modals (favorites + exit) */
  .modal{ position:fixed; inset:0; z-index:80; display:none; }
  .modal.show{ display:grid; place-items:center; }
  .modal .shade{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .dialog{
    position:relative; z-index:81;
    width:min(92vw, 440px);
    background: linear-gradient(180deg, #153468, #0f2147);
    border:2px solid #2a58b8;
    border-radius:16px; padding:18px;
    color:#eef6ff;
  }
  .dialog h4{ margin:0 0 6px; font:800 19px/1.2 Outfit,Inter }
  .dialog p{ margin:0 0 14px; color:#cfe2ff; font-size:14px }
  .actions{ display:flex; gap:10px; justify-content:flex-end }
  .btn{ border-radius:12px; padding:10px 14px; cursor:pointer; border:1px solid transparent; background:#1a2f5f; color:#e8f1ff; font-weight:700; }
  .btn:focus-visible{ outline:var(--ring) }
  .btn.primary{ background:#5ba0ff; color:#041225; border-color:#9fc2ff; }
  .btn.ghost{ background:#0f2045; border:1px solid #294a9d; color:#eaf1ff; }
</style>
</head>
<body>

<header id="topHeader">

    <div class="brand-badge">

    </div>
    <div>
      <div class="title">TlouTV</div>
      <div class="sub">Live Haitian TV</div>
    </div>
  </div>
</header>

<div class="app">

  <aside class="menu" id="leftMenu">

    <button class="mitem" data-menu data-cat="news" id="mi-news"><span class="dot"></span><span>News</span></button>
    <button class="mitem" data-menu data-cat="general" id="mi-general"><span class="dot"></span><span>General</span></button>
    <button class="mitem" data-menu data-cat="music" id="mi-music"><span class="dot"></span><span>Music</span></button>
    <button class="mitem" data-menu data-cat="religious" id="mi-religious"><span class="dot"></span><span>Religious</span></button>
    <button class="mitem" data-menu data-cat="sports" id="mi-sports"><span class="dot"></span><span>Sports</span></button>
    <h3>My</h3>
    <button class="mitem" data-menu data-cat="favorites" id="mi-fav"><span class="dot"></span><span>Favorites</span></button>
  </aside>

  <!-- RIGHT CONTENT -->
  <section class="content" id="content">
    <div class="search-row">
      <input id="q" class="search" placeholder="Search channels…" />
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- Player Overlay -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="shade"></div>
  <div class="player-wrap">
    <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
  </div>
  <button class="close-btn" id="closeBtn" title="Close (Back ×2 to exit)">✕ Close</button>
  <div class="error-tray" id="errorTray" style="display:none">
    <span id="errMsg" style="opacity:.92">Playback error.</span>
    <button class="e-btn" id="btnRetry" tabindex="0">Retry</button>
    <button class="e-btn" id="btnVLC" tabindex="0">Open in VLC</button>
    <button class="e-btn" id="btnNative" tabindex="0">Open natively</button>
  </div>
</div>

<!-- Favorites Modal -->
<div class="modal" id="favModal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="shade"></div>
  <div class="dialog">
    <h4 id="favTitle">Add to Favorites?</h4>
    <p id="favDesc"></p>
    <div class="actions">
      <button class="btn ghost" id="favCancel">Cancel</button>
      <button class="btn primary" id="favConfirm">Add</button>
    </div>
  </div>
</div>

<!-- Exit App Modal -->
<div class="modal" id="exitModal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="shade"></div>
  <div class="dialog">
    <h4>Exit TlouTV?</h4>
    <p>Do you want to close the app?</p>
    <div class="actions">
      <button class="btn ghost" id="exitCancel">No</button>
      <button class="btn primary" id="exitConfirm">Yes, Exit</button>
    </div>
  </div>
</div>

<!-- Back toast -->
<div class="back-toast" id="backToast">Press Back again to exit</div>

/* ---------- State ---------- */
const NS='tloutv:stable';
let CURRENT_CAT='all';
let lastFocus = null;

/* ---------- Rendering ---------- */
const gridEl = document.getElementById('grid');
const qEl = document.getElementById('q');

function favorites(){ try{return JSON.parse(localStorage.getItem(NS+':fav')||'[]')}catch{return[]} }
function setFavorites(x){ localStorage.setItem(NS+':fav', JSON.stringify([...new Set(x)]) ) }

function filterChannels(){
  const q=(qEl.value||'').toLowerCase();
  return CHANNELS.filter(c=>{
    const matchQ=!q || c.name.toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q);
    const matchCat = CURRENT_CAT==='all'
      ? true
      : (CURRENT_CAT==='favorites'
         ? favorites().includes(c.id)
         : c.genre===CURRENT_CAT);
    return matchQ && matchCat;
  });
}

function card(c,i){
  return `
    <div class="card" data-card data-idx="${i}" tabindex="0" role="button" aria-label="${c.name}">
      <div class="logo">${c.logo?`<img src="${c.logo}" alt="${c.name}" loading="lazy" decoding="async">`:'📺'}</div>
      <div class="title">${c.name}</div>
      <div class="meta">${c.genre||''}</div>
    </div>
  `;
}

let rendered=[];
function render(){
  const list = filterChannels();
  rendered = list;
  gridEl.innerHTML = list.map((c,i)=>card(c,i)).join('') || `<div style="opacity:.7">No results</div>`;
  const first = gridEl.querySelector('[data-card]');
  if(first && !document.querySelector('.focused-card') && document.activeElement.tagName!=='INPUT'){ focusCard(0,true); }
}

/* ---------- Menu ---------- */
const menuItems = Array.from(document.querySelectorAll('[data-menu]'));
function selectMenu(cat){
  CURRENT_CAT = cat;
  menuItems.forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  render();
}
menuItems.forEach(btn=>{
  btn.addEventListener('click',()=>{ selectMenu(btn.dataset.cat); focusMenu(btn); });
});
function focusMenu(el){
  menuItems.forEach(b=>b.classList.remove('focused-menu'));
  el.classList.add('focused-menu'); el.focus();
}

/* ---------- D-Pad Navigation (snappier) ---------- */
let focusedIndex=0;
let lastNavTs = 0;
const NAV_GAP = 45; /* slightly faster than before */
let navRAF = null;

function gridCols(){ 
  if(document.body.classList.contains('tv')) return 5;
  const w=window.innerWidth;
  return w>=1600?6:(w>=1280?5:(w>=960?4:(w>=600?3:2)));
}
function schedule(fn){
  if(navRAF) cancelAnimationFrame(navRAF);
  navRAF = requestAnimationFrame(()=>{ fn(); navRAF=null; });
}
function focusCard(idx, forceTop=false){
  const prev = document.querySelector('.focused-card'); if(prev) prev.classList.remove('focused-card');
  const el = gridEl.querySelector(`[data-card][data-idx="${idx}"]`);
  if(el){
    el.classList.add('focused-card');
    el.focus({preventScroll:false});
    el.scrollIntoView({block: forceTop ? 'start' : 'nearest', inline:'nearest'});
    focusedIndex=idx;
  }
}
function moveFocus(delta){
  const now=Date.now(); if(now-lastNavTs<NAV_GAP) return; lastNavTs=now;
  const total = rendered.length;
  const next = Math.max(0, Math.min(total-1, focusedIndex + delta));
  schedule(()=>focusCard(next));
}
function moveRow(deltaRows){ moveFocus(deltaRows * gridCols()); }

/* ---------- Long-press to Favorite (Enter hold or touch hold) ---------- */
let enterHoldTimer=null, enterHeld=false;
let pointerTimer=null, pointerHeld=false, pointerIdx=null;
/* Smart hold: Fire TV ~520ms, touch ~580ms, desktop ~500ms */
const HOLD_MS = isFireTV ? 520 : (isTouch ? 580 : 500);

function openFavModal(ch){
  favTarget = ch;
  const favs = new Set(favorites());
  const isFav = favs.has(ch.id);
  favTitle.textContent = isFav ? 'Remove from Favorites?' : 'Add to Favorites?';
  favDesc.textContent  = ch.name;
  favConfirm.textContent = isFav ? 'Remove' : 'Add';
  favModal.classList.add('show'); favModal.setAttribute('aria-hidden','false');
  favConfirm.focus();
}
function closeFavModal(){
  favModal.classList.remove('show'); favModal.setAttribute('aria-hidden','true');
  favTarget = null;
  gridEl.querySelector(`[data-card][data-idx="${focusedIndex}"]`)?.focus();
}
function toggleFavorite(id){
  const s=new Set(favorites());
  s.has(id) ? s.delete(id) : s.add(id);
  setFavorites([...s]);
  if(CURRENT_CAT==='favorites') render();
}

/* ---------- Keyboard (grid/menu) ---------- */
document.addEventListener('keydown', (e)=>{
  if(overlay.classList.contains('show') || exitModal.classList.contains('show')) return;

  if(favModal.classList.contains('show')){
    const k=e.key;
    if(k==='Backspace'||k==='Escape'||k==='BrowserBack'){ e.preventDefault(); closeFavModal(); return; }
    if(k==='ArrowLeft'||k==='Left'){ e.preventDefault(); favCancel.focus(); return; }
    if(k==='ArrowRight'||k==='Right'){ e.preventDefault(); favConfirm.focus(); return; }
    if(k==='Enter'){ e.preventDefault(); (document.activeElement===favCancel?favCancel:favConfirm).click(); return; }
    return;
  }

  const ae=document.activeElement;
  const onMenu = ae && ae.hasAttribute('data-menu');
  const onGrid = ae && ae.hasAttribute('data-card');
  const onInput = ae && ae.tagName==='INPUT';
  const key = e.key;
  const dpad = ['ArrowRight','Right','ArrowLeft','Left','ArrowUp','Up','ArrowDown','Down','PageDown','PageUp','Home','End'];
  if(dpad.includes(key)) e.preventDefault();

  if(onGrid){
    if(key==='ArrowRight' || key==='Right'){ moveFocus(1); return; }
    if(key==='ArrowLeft'  || key==='Left'){
      const cols = gridCols();
      if(focusedIndex%cols===0){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); return; }
      moveFocus(-1); return;
    }
    if(key==='ArrowDown' || key==='Down'){ moveRow(1); return; }
    if(key==='ArrowUp'   || key==='Up'){ moveRow(-1); return; }
    if(key==='PageDown'){ moveRow(3); return; }
    if(key==='PageUp'){ moveRow(-3); return; }
    if(key==='Home'){ schedule(()=>focusCard(0,true)); return; }
    if(key==='End'){ schedule(()=>focusCard(rendered.length-1,true)); return; }

    /* Long press Enter -> Favorites */
    if(key==='Enter' && !enterHoldTimer){
      e.preventDefault();
      enterHeld=false;
      enterHoldTimer=setTimeout(()=>{ enterHeld=true; openFavModal(rendered[focusedIndex]); }, HOLD_MS);
      return;
    }
  }

  if(onMenu){
    const i = menuItems.indexOf(ae);
    if(key==='ArrowDown' || key==='Down'){ focusMenu(menuItems[Math.min(menuItems.length-1,i+1)]); return; }
    if(key==='ArrowUp'   || key==='Up'){ focusMenu(menuItems[Math.max(0,i-1)]); return; }
    if(key==='ArrowRight'|| key==='Right'){ focusCard(0,true); return; }
    if(key==='Enter'){ ae.click(); return; }
  }

  if(onInput){
    if(key==='Escape'){ gridEl.querySelector('[data-card]')?.focus(); }
    return;
  }

  if(['ArrowLeft','Left','ArrowUp','Up','ArrowDown','Down','ArrowRight','Right'].includes(key)){
    if(!onMenu && !onGrid && !onInput){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); }
  }
});
document.addEventListener('keyup', (e)=>{
  if(overlay.classList.contains('show') || favModal.classList.contains('show') || exitModal.classList.contains('show')) return;
  if(e.key==='Enter'){
    if(enterHoldTimer){
      clearTimeout(enterHoldTimer); enterHoldTimer=null;
      if(!enterHeld){ openPlayer(rendered[focusedIndex]); }
      enterHeld=false;
    }
  }
});

/* Pointer long-press */
gridEl.addEventListener('pointerdown', (e)=>{
  const card = e.target.closest('[data-card]'); if(!card) return;
  pointerIdx = Number(card.dataset.idx);
  pointerHeld = false;
  clearTimeout(pointerTimer);
  pointerTimer = setTimeout(()=>{ pointerHeld=true; openFavModal(rendered[pointerIdx]); }, HOLD_MS);
});
['pointerup','pointerleave','pointercancel'].forEach(evt=>{
  gridEl.addEventListener(evt, ()=>{ clearTimeout(pointerTimer); });
});
gridEl.addEventListener('click', (e)=>{
  const card = e.target.closest('[data-card]'); if(!card) return;
  if(pointerHeld) { pointerHeld=false; return; }
  const idx = Number(card.dataset.idx); openPlayer(rendered[idx]);
});

/* ---------- Player (HLS + MPEG-TS) ---------- */
const overlay = document.getElementById('overlay');
const player = document.getElementById('player');
const closeBtn = document.getElementById('closeBtn');
const errorTray = document.getElementById('errorTray');
const errMsg = document.getElementById('errMsg');
const btnRetry = document.getElementById('btnRetry');
const btnVLC = document.getElementById('btnVLC');
const btnNative = document.getElementById('btnNative');
const backToast = document.getElementById('backToast');

let hls = null, tsPlayer = null, currentURL = null, currentChannel = null;

let overlayUIVisible = true;
let lastBackTs = 0;
const BACK_DOUBLE_MS = 1200;

function showControls(){ overlay.classList.remove('controls-hidden'); overlayUIVisible = true; }
function hideControls(){ overlay.classList.add('controls-hidden'); overlayUIVisible = false; closeBtn.classList.remove('focused'); }

let toastT=null;
function showBackToast(){ backToast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> backToast.classList.remove('show'), 1100); }

/* Open/Close overlay */
function showOverlay(){
  overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
  showControls();
  lastFocus = document.querySelector('.focused-card') || document.activeElement;
  player.focus();
}
function destroyPlayers(){
  try{ if(hls){ hls.destroy(); hls=null; } }catch(e){}
  try{ if(tsPlayer){ tsPlayer.unload(); tsPlayer.detachMediaElement(); tsPlayer.destroy(); tsPlayer=null; } }catch(e){}
  try{ player.pause(); player.removeAttribute('src'); player.load(); }catch(e){}
}
function hideOverlay(){
  overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true');
  destroyPlayers();
  if(document.fullscreenElement){ document.exitFullscreen?.(); }
  backToast.classList.remove('show'); errorTray.style.display='none';
  lastFocus?.focus();
  clearTimeout(enterHoldTimer); enterHoldTimer=null; enterHeld=false;
  clearTimeout(pointerTimer); pointerTimer=null; pointerHeld=false;
}

/* Error handling — focusable buttons for TV remotes */
function onFatal(msg){
  showControls();
  errorTray.style.display='flex';
  errMsg.textContent = msg || 'Playback error';
  btnRetry.classList.add('focus'); btnRetry.focus();
}
function resetErrors(){
  errorTray.style.display='none';
  btnRetry.classList.remove('focus'); btnVLC.classList.remove('focus'); btnNative.classList.remove('focus');
}

/* Playback */
function isHttpBlocked(u){ return location.protocol==='https:' && isHttp(u); }

function playHls(url){
  hls = new Hls({
    lowLatencyMode:true, enableWorker:true,
    liveSyncDurationCount:3, liveMaxLatencyDurationCount:10,
    backBufferLength:60, progressive:true
  });
  hls.attachMedia(player);
  hls.on(Hls.Events.MEDIA_ATTACHED, ()=> hls.loadSource(url));
  hls.on(Hls.Events.MANIFEST_PARSED, async ()=>{ try{ await player.play(); }catch(e){} requestFS(player); });
  hls.on(Hls.Events.ERROR, (_evt,data)=>{ if(data?.fatal){ onFatal('Playback error: ' + (data?.details || data?.type || 'HLS')); }});
}
function playTs(url){
  if (!window.mpegts || !mpegts.isSupported()){
    onFatal('Your device/browser cannot play MPEG-TS directly.');
    return;
  }
  tsPlayer = mpegts.createPlayer(
    { type: 'mpegts', isLive: true, url },
    { enableWorker:true, liveBufferLatencyChasing:true }
  );
  tsPlayer.attachMediaElement(player);
  tsPlayer.load();
  tsPlayer.play().then(()=>requestFS(player)).catch(()=>requestFS(player));
}
function playURL(url){
  resetErrors(); currentURL = url;
  destroyPlayers();
  if (isHttpBlocked(url)){
    onFatal('This stream is HTTP on an HTTPS page (blocked by the browser). Try “Open in VLC / Open natively”.');
    return;
  }
  if (isHls(url)){
    if (window.Hls && Hls.isSupported()) playHls(url);
    else if (player.canPlayType('application/vnd.apple.mpegurl')){
      player.src = url;
      player.addEventListener('loadedmetadata', async ()=>{ try{ await player.play(); }catch(e){} requestFS(player); }, {once:true});
    } else onFatal('HLS not supported on this device.');
    return;
  }
  if (isTs(url)){ playTs(url); return; }
  location.href = url;
}
async function requestFS(el){
  try{
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
    else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen) await el.msRequestFullscreen();
  }catch(e){}
}
async function openPlayer(ch){ showOverlay(); currentChannel = ch; playURL(ch.url); }

/* Overlay key handling — navigate Close & Error tray with D-pad */
document.addEventListener('keydown', (e)=>{
  if(!overlay.classList.contains('show')) return;
  const k=e.key;

  if(k==='Backspace' || k==='Escape' || k==='BrowserBack'){
    e.preventDefault();
    const now = Date.now();
    if(overlayUIVisible){
      hideControls(); showBackToast(); lastBackTs = now;
    }else{
      if(now - lastBackTs <= BACK_DOUBLE_MS){ hideOverlay(); }
      else { hideControls(); showBackToast(); lastBackTs = now; }
    }
    return;
  }

  const trayVisible = errorTray.style.display!=='none';
  const focusables = trayVisible ? [btnRetry, btnVLC, btnNative, closeBtn] : [closeBtn];
  const idx = focusables.indexOf(document.activeElement);

  if(['ArrowLeft','Left','ArrowRight','Right','ArrowUp','Up','ArrowDown','Down'].includes(k)){
    e.preventDefault(); showControls();
    if(trayVisible){
      if(k==='ArrowLeft' || k==='Left'){ const n = Math.max(0, idx-1); focusables[n].focus(); markTrayFocus(focusables[n]); }
      else if(k==='ArrowRight'|| k==='Right'){ const n = Math.min(focusables.length-1, idx+1); focusables[n].focus(); markTrayFocus(focusables[n]); }
      else if(k==='ArrowUp'   || k==='Up'){ closeBtn.focus(); }
      else if(k==='ArrowDown' || k==='Down'){ btnRetry.focus(); markTrayFocus(btnRetry); }
    }else{
      closeBtn.focus();
    }
    return;
  }

  if(k==='Enter'){
    const el = document.activeElement;
    if(el===closeBtn){ e.preventDefault(); hideOverlay(); return; }
    if(el===btnRetry){ e.preventDefault(); if(currentURL){ playURL(currentURL); } return; }
    if(el===btnVLC){
      e.preventDefault(); if(currentURL){
        const isHttps = /^https:/.test(currentURL);
        const hostless = currentURL.replace(/^https?:\/\//,'');
        const intent = `intent://${hostless}#Intent;package=org.videolan.vlc;scheme=${isHttps?'https':'http'};end`;
        const scheme = 'vlc://' + currentURL;
        const start = Date.now();
        const t = setTimeout(()=>{ if(Date.now()-start<1200){ location.href=intent; setTimeout(()=>{ location.href=currentURL; }, 700); }}, 700);
        location.href = scheme;
        const vis = ()=>{ if(document.hidden) clearTimeout(t); document.removeEventListener('visibilitychange', vis); };
        document.addEventListener('visibilitychange', vis);
      }
      return;
    }
    if(el===btnNative){ e.preventDefault(); if(currentURL){ location.href=currentURL; } return; }
  }
});
function markTrayFocus(el){
  [btnRetry,btnVLC,btnNative].forEach(b=>b.classList.toggle('focus', b===el));
}

/* Error tray actions (mouse/touch) */
btnRetry.onclick = ()=>{ if(currentURL){ playURL(currentURL); } };
btnVLC.onclick   = ()=>{ if(currentURL){
  const isHttps = /^https:/.test(currentURL);
  const hostless = currentURL.replace(/^https?:\/\//,'');
  const intent = `intent://${hostless}#Intent;package=org.videolan.vlc;scheme=${isHttps?'https':'http'};end`;
  const scheme = 'vlc://' + currentURL;
  const start = Date.now();
  const t = setTimeout(()=>{ if(Date.now()-start<1200){ location.href=intent; setTimeout(()=>{ location.href=currentURL; }, 700); }}, 700);
  location.href = scheme;
  const vis = ()=>{ if(document.hidden) clearTimeout(t); document.removeEventListener('visibilitychange', vis); };
  document.addEventListener('visibilitychange', vis);
} };
btnNative.onclick= ()=>{ if(currentURL){ location.href = currentURL; } };

/* ---------- Favorites modal wiring ---------- */
const favModal  = document.getElementById('favModal');
const favTitle  = document.getElementById('favTitle');
const favDesc   = document.getElementById('favDesc');
const favConfirm= document.getElementById('favConfirm');
const favCancel = document.getElementById('favCancel');
let favTarget   = null;

favCancel.addEventListener('click', closeFavModal);
favConfirm.addEventListener('click', ()=>{ if(!favTarget) return; toggleFavorite(favTarget.id); closeFavModal(); });

/* ---------- Exit app modal + main-screen double-back ---------- */
const exitModal   = document.getElementById('exitModal');
const exitCancel  = document.getElementById('exitCancel');
const exitConfirm = document.getElementById('exitConfirm');
let mainBackTs    = 0;

function showExitModal(){
  exitModal.classList.add('show'); exitModal.setAttribute('aria-hidden','false'); exitConfirm.focus();
}
function hideExitModal(){
  exitModal.classList.remove('show'); exitModal.setAttribute('aria-hidden','true');
  document.querySelector('.focused-menu, [data-card].focused-card')?.focus();
}
function tryExitApp(){
  try{ window.close(); }catch(e){}
  setTimeout(()=>{ location.href='about:blank'; }, 60);
}
exitCancel.addEventListener('click', hideExitModal);
exitConfirm.addEventListener('click', tryExitApp);

document.addEventListener('keydown', (e)=>{
  if(overlay.classList.contains('show') || favModal.classList.contains('show')) return;

  if(exitModal.classList.contains('show')){
    if(e.key==='Backspace' || e.key==='Escape' || e.key==='BrowserBack'){ e.preventDefault(); tryExitApp(); return; }
    if(e.key==='ArrowLeft' || e.key==='Left'){ e.preventDefault(); exitCancel.focus(); return; }
    if(e.key==='ArrowRight'|| e.key==='Right'){ e.preventDefault(); exitConfirm.focus(); return; }
    if(e.key==='Enter'){ e.preventDefault(); (document.activeElement===exitCancel?exitCancel:exitConfirm).click(); return; }
    return;
  }

  if(e.key==='Backspace' || e.key==='Escape' || e.key==='BrowserBack'){
    e.preventDefault();
    const now = Date.now();
    if(now - mainBackTs <= 1200){ showExitModal(); mainBackTs = 0; }
    else { mainBackTs = now; showBackToast(); }
  }
});

/* ---------- Wire up ---------- */
const gridElClick = (e)=>{
  const card = e.target.closest('[data-card]'); if(!card) return;
  const idx = Number(card.dataset.idx); openPlayer(rendered[idx]);
};
qEl.addEventListener('input', render);
selectMenu('all');
render();
gridEl.addEventListener('click', gridElClick);
</script>
