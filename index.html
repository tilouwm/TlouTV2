<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TlouTV Pro — Firestick Optimized Web Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-surface: #121722;
      --bg-panel: rgba(22, 27, 34, 0.92);
      --bg-card: rgba(33, 38, 45, 0.92);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent: #ffae00;
      --focus-glow: rgba(255, 174, 0, 0.35);
      --safe-zone: 40px;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0; padding: 0; height: 100vh; width: 100vw;
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(255, 174, 0, 0.10), transparent 60%),
        radial-gradient(900px 500px at 80% 30%, rgba(0, 180, 255, 0.08), transparent 60%),
        linear-gradient(180deg, #07090d, #0a0c10 35%, #06070a);
    }

    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
      padding: var(--safe-zone);
      gap: 26px;
    }

    /* SIDEBAR */
    .sidebar {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .sidebar-panel {
      height: 100%;
      padding: 18px;
      border-radius: var(--radius-xl);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 6px 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 174, 0, 0.12);
      border: 1px solid rgba(255, 174, 0, 0.30);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(255, 174, 0, 0.10);
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .logo {
      font-family: 'Outfit', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .logo small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 6px;
    }

    .nav-item {
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
      color: var(--text-secondary);
      font-size: 18px;
      font-weight: 700;
      border: 1px solid transparent;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      flex: 0 0 auto;
    }

    .nav-item.focused {
      background: rgba(255, 174, 0, 0.10);
      color: var(--text-primary);
      border-color: rgba(255, 174, 0, 0.55);
      box-shadow: 0 0 16px rgba(255, 174, 0, 0.12);
      transform: scale(1.03);
    }

    .nav-item.active {
      color: var(--accent);
      background: rgba(255, 174, 0, 0.08);
      border-color: rgba(255, 174, 0, 0.28);
    }

    .nav-hint {
      margin-top: auto;
      padding: 14px 12px;
      border-top: 1px solid var(--border);
      color: rgba(240, 246, 252, 0.72);
      font-size: 12px;
      line-height: 1.35;
    }

    .nav-hint b { color: var(--text-primary); }
    .nav-hint span { color: var(--accent); font-weight: 800; }

    /* CONTENT */
    .content {
      height: calc(100vh - (var(--safe-zone) * 2));
      overflow-y: auto;
      scrollbar-width: none;
      border-radius: var(--radius-xl);
      background: rgba(18, 23, 34, 0.55);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
    }
    .content::-webkit-scrollbar { display: none; }

    .content-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 6px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .category-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      margin: 0;
      color: var(--text-primary);
      letter-spacing: 0.4px;
    }

    .content-sub {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55%;
      text-align: right;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
      padding-bottom: 140px;
    }

    .channel-card {
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: 0 10px 22px rgba(0,0,0,0.30);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .channel-card.focused {
      border-color: rgba(255, 174, 0, 0.70);
      transform: scale(1.055);
      box-shadow: 0 0 0 2px rgba(255, 174, 0, 0.14), 0 0 22px var(--focus-glow);
    }

    .thumb-container {
      width: 100%;
      aspect-ratio: 16/9;
      background:
        radial-gradient(600px 250px at 20% 20%, rgba(255, 174, 0, 0.06), transparent 55%),
        linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .thumb-container img {
      max-width: 78%;
      max-height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.45));
    }

    .genre-pill {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(240,246,252,0.92);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .channel-name {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .play-chip {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #000;
      background: rgba(255, 174, 0, 0.92);
      border: 1px solid rgba(255, 174, 0, 0.35);
      box-shadow: 0 10px 18px rgba(255, 174, 0, 0.10);
    }

    /* Fullscreen Player Overlay */
    .player-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      display: none;
    }
    .player-overlay.active { display: block; }

    #videoPlayer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--accent);
      font-size: 22px;
      text-align: center;
      z-index: 2100;
      pointer-events: none;
    }

    .player-controls {
      position: absolute;
      bottom: 18px;
      right: 18px;
      z-index: 2200;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .player-overlay.show-menu .player-controls {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-back {
      pointer-events: auto;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: 2px solid var(--accent);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
    }

    .btn-back.focused {
      box-shadow: 0 0 18px var(--focus-glow);
      transform: scale(1.02);
    }

    /* Smaller screens */
    @media (max-width: 900px) {
      :root { --safe-zone: 18px; }
      .app-container { grid-template-columns: 280px 1fr; }
      .content-sub { display: none; }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-panel">
        <div class="brand">
          <div class="brand-badge">T</div>
          <div class="logo">TlouTV<small>PRO</small></div>
        </div>

        <div class="nav" id="nav-list">
          <div class="nav-item active" data-cat="all">All Channels <span class="dot"></span></div>
          <div class="nav-item" data-cat="news">News <span class="dot"></span></div>
          <div class="nav-item" data-cat="general">General <span class="dot"></span></div>
          <div class="nav-item" data-cat="music">Music <span class="dot"></span></div>
          <div class="nav-item" data-cat="religious">Religious <span class="dot"></span></div>
          <div class="nav-item" data-cat="sports">Sports <span class="dot"></span></div>
        </div>

        <div class="nav-hint">
          <b>Remote tips:</b> Use arrows to browse • <span>OK</span> plays • <span>BACK</span> returns.
        </div>
      </div>
    </div>

    <div class="content" id="scroll-box">
      <div class="content-header">
        <h2 id="cat-label" class="category-title">All Channels</h2>
        <div class="content-sub">Arrows to browse • OK to play • BACK to return</div>
      </div>
      <div class="channel-grid" id="channel-grid"></div>
    </div>
  </div>

  <!-- Player Overlay (Web playback only — no VLC) -->
  <div class="player-overlay" id="player" aria-hidden="true">
    <div class="loading-spinner" id="spinner">
      Loading stream...<br>
      <small style="font-size: 14px; opacity: 0.7;">Press BACK to return to the menu.</small>
    </div>
    <video id="videoPlayer"></video>
    <div class="player-controls">
      <div class="btn-back" id="backBtn" role="button" tabindex="0">MENU</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // =========================
    // Channels
    // =========================
    const CHANNELS = [
      {"id":"tele6","name":"Radio Tele 6 Univers","logo":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQhFbArTFlXYPUKKJ_oesEtaxdKyvQBn8D1w&s","url":"https://acwstream.com/lakay/tele6/tracks-v1a1/mono.m3u8","genre":"general"},
      {"id":"channel1","name":"Radio Tele Caraibes","logo":"https://ifex.org/wp-content/uploads/2025/03/haiti-radio-television-caraibes-arson-attack-facebook.jpeg","url":"https://bozztv.com/dvrfl03/hdirect/hdirect-telecaraibes/index.m3u8","genre":"general"},
      {"id":"channel2","name":"Radio Tele Ginen","logo":"https://yt3.googleusercontent.com/ytc/AIdro_k18hgxxj--vlOpIKL8WQ-wOw6AvskQT8eXIPn3qWx4-TU=s900-c-k-c0x00ffffff-no-rj","url":"http://teleginen.srfms.com:1935/teleginen/livestream/playlist.m3u8","genre":"news"},
      {"id":"channel3","name":"Tele Pacific","logo":"https://static.wikia.nocookie.net/logopedia/images/e/e6/Radio_T%C3%A9l%C3%A9_Pacific_Logo.png","url":"https://hls-p1st0n8r.livepush.io/live_cdn/nsOk3qoty1d5HDD/emB7xoUdyMbnjH8/tracks-v1a1/mono.m3u8","genre":"news"},
      {"id":"channel4","name":"Haiti News","logo":"https://m.media-amazon.com/images/I/611Ffvky5yL.png","url":"https://haititivi.com/website/haitinews/index.m3u8","genre":"news"},
      {"id":"channel5","name":"Telemix","logo":"https://i.ibb.co/RB7dzZq/logo-mix-2.png","url":"https://haititivi.com/haiti/telemix1/tracks-v1a1/mono.m3u8","genre":"general"},
      {"id":"channel6","name":"Kajou TV","logo":"https://static.wixstatic.com/media/d205b7_ced5950afd8849e2b21a72f36b3a16ff~mv2.png","url":"https://video1.getstreamhosting.com:1936/8055/8055/chunklist_w1507178321.m3u8","genre":"general"},
      {"id":"channel7","name":"RTH 2000","logo":"https://i.imgur.com/4z0FiEA.png","url":"https://2-fss-2.streamhoster.com/pl_120/amlst:206708-4203440/chunklist_b1998000.m3u8","genre":"general"},
      {"id":"channel8","name":"RTH 2000 TV2","logo":"https://i.imgur.com/4z0FiEA.png","url":"https://2-fss-2.streamhoster.com/pl_122/amlst:206708-4202592/chunklist_b1966000.m3u8","genre":"general"},
      {"id":"channel9","name":"Radio Tele Puissance","logo":"https://radiotelepuissance.com/wp-content/uploads/2020/08/cropped-radio-logo-1.png","url":"https://video1.getstreamhosting.com:1936/8560/8560/chunklist_w486676635.m3u8","genre":"religious"},
      {"id":"channel11","name":"Tele Pam","logo":"https://i.imgur.com/zfnFVqQ.png","url":"https://acwstream.com/acw/stream/telepam/tracks-v1/index.fmp4.m3u8","genre":"general"},
      {"id":"channel12","name":"Radio Tele Boston","logo":"https://i.ibb.co/x3Gx3Ps/unnamed.png","url":"https://tv2.fastcast4u.com:3238/live/radiotelebostonlive.m3u8","genre":"religious"},
      {"id":"channel15","name":"Nago TV","logo":"https://i.ibb.co/fSnCtJb/nago-tv.png","url":"https://acwstream.com/lakay/nagotv/tracks-v1a1/mono.m3u8","genre":"music"},
      {"id":"channel16","name":"Tele 4VEH","logo":"https://4veh.org/en/wp-content/uploads/2021/08/2021-logo-RT-4VEH-ENG-v8.png","url":"https://uni01rtmp.tulix.tv/4vehtv/4vehtv-firetv/playlist.m3u8","genre":"religious"},
      {"id":"channel17","name":"Tele Louange","logo":"https://editor.zenomedia.com/resources/zs_station/436269/CardWebsite/image.png","url":"https://5790d294af2dc.streamlock.net/8124/8124/chunklist_w1901943944.m3u8","genre":"religious"},
      {"id":"channel21","name":"Afrobeats","logo":"https://www.shutterstock.com/image-vector/afro-beat-text-african-drums-260nw-1741803605.jpg","url":"https://stream.ecable.tv/afrobeats/index.m3u8","genre":"music"},
      {"id":"channel22","name":"Trace Urban","logo":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Trace_Urban_logo_2010.svg/2560px-Trace_Urban_logo_2010.svg.png","url":"https://lightning-traceurban-samsungau.amagi.tv/playlist.m3u8","genre":"music"},
      {"id":"channel29","name":"Totalmix Radio","logo":"https://cdn-radiotime-logos.tunein.com/s127273g.png","url":"https://media.streambrothers.com:1936/hpgnrhawxv/hpgnrhawxv/chunklist_w1967596347.m3u8","genre":"sports"},
      {"id":"channel30","name":"Rezo Boul","logo":"https://www.rezoboul.com/uploads/images/logo_site_1714115779.png","url":"https://cdn1.ayitistream.com/web-r1/tracks-v1/index.fmp4.m3u8","genre":"sports"}
    ];

    // =========================
    // State + elements
    // =========================
    const state = {
      focus: 'nav',
      navIdx: 0,
      gridIdx: 0,
      filtered: [],
      playing: false,
      currentUrl: '',
      playerMenuVisible: false
    };

    const navItems = document.querySelectorAll('.nav-item');
    const grid = document.getElementById('channel-grid');
    const scrollBox = document.getElementById('scroll-box');
    const player = document.getElementById('player');
    const video = document.getElementById('videoPlayer');
    const backBtn = document.getElementById('backBtn');
    const spinner = document.getElementById('spinner');

    let hls = null;

    // =========================
    // Rendering
    // =========================
    function renderGrid() {
      const cat = navItems[state.navIdx].dataset.cat;
      document.getElementById('cat-label').innerText = navItems[state.navIdx].innerText;

      state.filtered = CHANNELS.filter(c => cat === 'all' || c.genre === cat);
      grid.innerHTML = '';

      state.filtered.forEach((ch, i) => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.id = `card-${i}`;
        card.setAttribute('data-idx', String(i));
        card.innerHTML = `
          <div class="thumb-container">
            <div class="genre-pill">${ch.genre}</div>
            <img src="${ch.logo}" alt="" loading="lazy" onerror="this.style.display='none'">
          </div>
          <div class="card-body">
            <p class="channel-name">${ch.name}</p>
            <span class="play-chip">PLAY</span>
          </div>
        `;
        grid.appendChild(card);
      });

      scrollBox.scrollTop = 0;
    }

    function calcCols() {
      // Firestick stability: calculate from real DOM sizes, fallback to 5.
      const first = grid.querySelector('.channel-card');
      if (!first) return 5;
      const cardW = first.getBoundingClientRect().width || 240;
      const gridW = grid.getBoundingClientRect().width || (cardW * 5);
      const cols = Math.max(1, Math.round(gridW / cardW));
      return Number.isFinite(cols) ? cols : 5;
    }

    function ensureVisible(el) {
      // Avoid smooth scrolling (stutters on many Firestick browsers)
      const boxRect = scrollBox.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const pad = 28;

      if (elRect.top < boxRect.top + pad) {
        scrollBox.scrollTop -= (boxRect.top + pad - elRect.top);
      } else if (elRect.bottom > boxRect.bottom - pad) {
        scrollBox.scrollTop += (elRect.bottom - (boxRect.bottom - pad));
      }
    }

    function updateFocus() {
      document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));

      // While playing: focus MENU only if overlay is visible
      if (state.playing) {
        if (state.playerMenuVisible) backBtn.classList.add('focused');
        return;
      }

      if (state.focus === 'nav') {
        navItems[state.navIdx].classList.add('focused');
      } else {
        const el = document.getElementById(`card-${state.gridIdx}`);
        if (el) {
          el.classList.add('focused');
          ensureVisible(el);
        }
      }
    }

    // =========================
    // Playback
    // =========================
    async function tryFullscreen() {
      // Best-effort fullscreen; may be blocked depending on browser.
      try {
        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (player.requestFullscreen) {
          await player.requestFullscreen();
        } else if (player.webkitRequestFullscreen) {
          player.webkitRequestFullscreen();
        }
      } catch (_) {
        // ignore
      }
    }

    function openPlayer(channel) {
      state.playing = true;
      state.currentUrl = channel.url;
      state.playerMenuVisible = false;

      player.classList.add('active');
      player.classList.remove('show-menu');
      player.setAttribute('aria-hidden', 'false');

      spinner.style.display = 'block';
      spinner.innerHTML = `Loading stream...<br><small style="font-size: 14px; opacity: 0.7;">${channel.name}</small>`;

      // TV browsers behave better with explicit attributes.
      video.controls = true;
      video.autoplay = true;
      video.muted = false;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');

      startWebPlayback(channel.url);
      updateFocus();
    }

    function startWebPlayback(url) {
      // cleanup previous
      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }
      video.removeAttribute('src');
      video.load();

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, async () => {
          try { await video.play(); } catch (_) {}
          await tryFullscreen();
          spinner.style.display = 'none';
        });

        hls.on(Hls.Events.ERROR, () => {
          spinner.style.display = 'block';
          spinner.innerHTML = `Stream error.<br><small style="font-size: 14px; opacity: 0.7;">Press BACK to return.</small>`;
        });
      } else {
        // Native HLS (some devices)
        video.src = url;
        video.addEventListener('canplay', async function onCanPlay() {
          video.removeEventListener('canplay', onCanPlay);
          try { await video.play(); } catch (_) {}
          await tryFullscreen();
          spinner.style.display = 'none';
        });
      }
    }

    function stopPlayback() {
      state.playing = false;
      state.currentUrl = '';
      state.playerMenuVisible = false;

      player.classList.remove('active');
      player.classList.remove('show-menu');
      player.setAttribute('aria-hidden', 'true');

      try { video.pause(); } catch (_) {}
      video.removeAttribute('src');
      video.load();

      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }

      spinner.style.display = 'block';
      spinner.innerHTML = 'Loading stream...<br><small style="font-size: 14px; opacity: 0.7;">Press BACK to return to the menu.</small>';

      updateFocus();
    }

    // =========================
    // Actions
    // =========================
    function togglePlayerMenu() {
      // OK toggles menu visibility (no auto-hide)
      state.playerMenuVisible = !state.playerMenuVisible;
      if (state.playerMenuVisible) {
        player.classList.add('show-menu');
      } else {
        player.classList.remove('show-menu');
      }
      updateFocus();
    }

    function handleEnter() {
      // While playing: OK toggles the MENU overlay only
      if (state.playing) {
        togglePlayerMenu();
        return;
      }

      if (state.focus === 'nav') {
        navItems.forEach(n => n.classList.remove('active'));
        navItems[state.navIdx].classList.add('active');
        renderGrid();
        if (state.filtered.length > 0) {
          state.focus = 'grid';
          state.gridIdx = 0;
        }
      } else {
        const channel = state.filtered[state.gridIdx];
        if (channel) openPlayer(channel);
      }

      updateFocus();
    }

    function handleBack() {
      // BACK always returns to menu
      if (state.playing) {
        stopPlayback();
        return true;
      }

      // From grid, BACK returns to sidebar
      if (state.focus === 'grid') {
        state.focus = 'nav';
        updateFocus();
        return true;
      }

      return false;
    }

    // =========================
    // Input: Click support
    // =========================
    document.getElementById('nav-list').addEventListener('click', (e) => {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      const idx = Array.from(navItems).indexOf(item);
      if (idx >= 0) {
        state.navIdx = idx;
        state.focus = 'nav';
        handleEnter();
      }
    });

    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.channel-card');
      if (!card) return;
      const idx = parseInt(card.getAttribute('data-idx') || '0', 10);
      state.focus = 'grid';
      state.gridIdx = idx;
      updateFocus();
      handleEnter();
    });

    backBtn.addEventListener('click', stopPlayback);

    // =========================
    // Input: Remote / keyboard
    // =========================
    window.addEventListener('keydown', (e) => {
      const keyCode = e.keyCode;
      const key = e.key;

      // OK/Enter
      if (keyCode === 13 || key === 'Enter') {
        e.preventDefault();
        handleEnter();
        return;
      }

      // Back / Escape / Firestick Back (10009)
      if (keyCode === 8 || keyCode === 27 || keyCode === 10009 || key === 'Backspace' || key === 'Escape') {
        const handled = handleBack();
        if (handled) e.preventDefault();
        return;
      }

      if (state.playing) return;

      const cols = calcCols();

      if (keyCode === 38 || key === 'ArrowUp') {
        e.preventDefault();
        if (state.focus === 'nav') {
          state.navIdx = Math.max(0, state.navIdx - 1);
        } else {
          if (state.gridIdx >= cols) state.gridIdx -= cols;
        }
        updateFocus();
        return;
      }

      if (keyCode === 40 || key === 'ArrowDown') {
        e.preventDefault();
        if (state.focus === 'nav') {
          state.navIdx = Math.min(navItems.length - 1, state.navIdx + 1);
        } else {
          state.gridIdx = Math.min(state.filtered.length - 1, state.gridIdx + cols);
        }
        updateFocus();
        return;
      }

      if (keyCode === 37 || key === 'ArrowLeft') {
        e.preventDefault();
        if (state.focus === 'grid') {
          if (state.gridIdx % cols === 0) state.focus = 'nav';
          else state.gridIdx = Math.max(0, state.gridIdx - 1);
          updateFocus();
        }
        return;
      }

      if (keyCode === 39 || key === 'ArrowRight') {
        e.preventDefault();
        if (state.focus === 'nav' && state.filtered.length > 0) {
          state.focus = 'grid';
        } else if (state.focus === 'grid') {
          state.gridIdx = Math.min(state.filtered.length - 1, state.gridIdx + 1);
        }
        updateFocus();
        return;
      }
    });

    window.addEventListener('resize', () => updateFocus());

    // =========================
    // Lightweight tests (console)
    // =========================
    function runTests() {
      console.assert(Array.isArray(CHANNELS) && CHANNELS.length > 0, 'TEST: CHANNELS must be non-empty');
      renderGrid();
      console.assert(grid.children.length === state.filtered.length, 'TEST: grid should render all filtered channels');

      const cols = calcCols();
      console.assert(Number.isInteger(cols) && cols >= 1, 'TEST: calcCols should return integer >= 1');

      // Focus sanity
      state.focus = 'nav'; state.navIdx = 0; updateFocus();
      console.assert(document.querySelector('.nav-item.focused'), 'TEST: nav focused item exists');

      // Player OK behavior: toggles menu (show then hide), does NOT stop playback
      state.playing = true;
      state.playerMenuVisible = false;
      player.classList.add('active');
      player.classList.remove('show-menu');

      handleEnter();
      console.assert(state.playing === true, 'TEST: OK while playing should NOT stop playback');
      console.assert(player.classList.contains('show-menu') === true, 'TEST: OK while playing should show menu');

      handleEnter();
      console.assert(state.playing === true, 'TEST: OK again while playing should NOT stop playback');
      console.assert(player.classList.contains('show-menu') === false, 'TEST: OK again while playing should hide menu');

      // Cleanup test state
      state.playing = false;
      state.playerMenuVisible = false;
      player.classList.remove('active');
      player.classList.remove('show-menu');
    }

    // Boot
    renderGrid();
    updateFocus();
    runTests();
  </script>
</body>
</html>
