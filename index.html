
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TlouTv 2.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h1 class="logo">TlouTv</h1>
      <div class="search-tools">
        <button id="toggleSearch">🔍</button>
        <input type="text" id="searchInput" placeholder="Search..." style="display:none;" />
        <button id="searchBtn" style="display:none;">Go</button>
      </div>
      <nav>
        <ul>
          <li class="menu-item" data-category="favorites">⭐ Favorites</li>
          <li class="menu-item active" data-category="haiti">🇭🇹 Haiti</li>
          <li class="menu-item" data-category="france">🇫🇷 France</li>
          <li class="menu-item" data-category="usa">🇺🇸 USA</li>
          <li class="menu-item" data-category="caribbean">🌴 Caribbean</li>
        </ul>
      </nav>
    </aside>
   <main class="main-content">
  <div id="channelRows">
    <!-- This will be filled dynamically by script.js -->
  </div>
</main>
  </div>

  <div id="videoModal" class="video-modal" style="display: none;">
    <video id="videoPlayer" controls autoplay></video>
    
    <button id="closePlayer">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
