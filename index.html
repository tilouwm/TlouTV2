            font-family: 'Montserrat', sans-serif;
            background-color: #1f2937;
            color: #d1d5db;
        }
        .scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        .channel-card-logo {
            width: 100%;
            height: auto;
            max-width: 120px;
            max-height: 80px;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out;
        }
        .channel-card:hover .channel-card-logo {
            transform: scale(1.1);
        }
        .video-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .video-player-content {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .video-player {
            width: 100%;
            height: 100%;
            display: block;
        }
        .selected-card {
            border: 2px solid #ca8a04; /* A dark yellow border */
        }
        /* Loader styles */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        let hlsInstance = null; // A global variable to hold the HLS.js instance

        // Function to create a single channel card element
        function createChannelCard(channel) {
            const card = document.createElement('div');
            card.className = "channel-card bg-gray-900 p-6 rounded-xl shadow-lg transition-all duration-300 transform hover:scale-105 hover:shadow-2xl hover:border-2 hover:border-yellow-600 cursor-pointer flex flex-col items-center justify-center space-y-4";
            card.dataset.stream = channel.stream;
            card.dataset.name = channel.name;

            const logo = document.createElement('img');
            logo.src = channel.logo;
            logo.alt = `${channel.name} logo`;
            logo.className = "channel-card-logo";

            const name = document.createElement('h3');
            name.textContent = channel.name;
            name.className = "text-lg font-semibold text-yellow-600 text-center";

            card.appendChild(logo);
            card.appendChild(name);

            // Add click event listener to handle selection and video playback
            card.addEventListener('click', () => {
                const videoModal = document.getElementById('video-modal');
                const videoPlayer = document.getElementById('video-player');
                const loadingSpinner = document.getElementById('loading-spinner');
                const videoContent = document.querySelector('.video-player-content');
                const streamUrl = card.dataset.stream;
                const channelName = card.dataset.name;

                // Update the page title
                document.title = `Haitian TV Channels - ${channelName}`;

                // Remove highlight from all other cards
                document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('selected-card'));
                // Add highlight to the selected card
                card.classList.add('selected-card');
                
                // Show loading spinner and hide video content
                loadingSpinner.classList.remove('hidden');
                videoContent.classList.add('hidden');
                
                // If a previous HLS instance exists, destroy it to prevent memory leaks
                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(streamUrl);
                    hlsInstance.attachMedia(videoPlayer);

                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoPlayer.play();
                    });

                    // --- NEW LOGIC FOR ERROR RECOVERY ---
                    let errorRetries = 0;
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS.js error:', data);
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    displayErrorMessage("Network error: Stream failed to load.");
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    // This is the new recovery attempt logic
                                    if (errorRetries < 2) {
                                        errorRetries++;
                                        console.log(`Media error, attempting to recover... Retry #${errorRetries}`);
                                        hlsInstance.recoverMediaError();
                                    } else {
                                        displayErrorMessage("Media error: Failed to play stream after several retries. Audio may still work.");
                                    }
                                    break;
                                default:
                                    displayErrorMessage("An unknown error occurred. Please try another channel.");
                                    break;
                            }
                        }
                    });

                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    videoPlayer.src = streamUrl;
                    videoPlayer.addEventListener('loadedmetadata', () => {
                        videoPlayer.play();
                    });
                } else {
                    displayErrorMessage('Your browser does not support HLS video streaming.');
                }
                
                // Event listener for when video starts playing
                videoPlayer.onplay = () => {
                    loadingSpinner.classList.add('hidden');
                    videoContent.classList.remove('hidden');
                };

                videoModal.style.display = 'flex';
                // Request full screen for the video player container
                if (videoPlayer) {
                    const playerContainer = document.getElementById('video-modal');
                    if (playerContainer.requestFullscreen) {
                        playerContainer.requestFullscreen();
                    } else if (playerContainer.mozRequestFullScreen) { // Firefox
                        playerContainer.mozRequestFullScreen();
                    } else if (playerContainer.webkitRequestFullscreen) { // Chrome, Safari and Opera
                        playerContainer.webkitRequestFullscreen();
                    } else if (playerContainer.msRequestFullscreen) { // IE/Edge
                        playerContainer.msRequestFullscreen();
                    }
                }
            });
            return card;
        }

        // Function to handle the video player and modal when exiting full-screen
        function exitVideoPlayer() {
            const videoModal = document.getElementById('video-modal');
            const videoPlayer = document.getElementById('video-player');
            videoPlayer.pause();
            videoPlayer.removeAttribute('src'); // Stop stream to save bandwidth
            videoModal.style.display = 'none';
            document.title = "Haitian TV Channels"; // Reset page title
            // Clear the selected card highlight
            document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('selected-card'));
            
            // Explicitly exit full screen to fix the unresponsive UI issue on some devices
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari, Chrome and Opera */
                document.webkitExitFullscreen();
            } else if (document.mozCancelFullScreen) { /* Firefox */
                document.mozCancelFullScreen();
            } else if (document.msExitFullscreen) { /* IE/Edge */
                document.msExitFullscreen();
            }
        }

        // Function to display an error message
        function displayErrorMessage(message) {
            const videoModal = document.getElementById('video-modal');
            const loadingSpinner = document.getElementById('loading-spinner');
            const videoContent = document.querySelector('.video-player-content');
            
            loadingSpinner.classList.add('hidden');
            videoContent.classList.add('hidden');

            const messageBox = document.createElement('div');
            messageBox.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 p-4 bg-red-500 text-white rounded-lg shadow-xl text-center';
            messageBox.textContent = message;
            videoModal.appendChild(messageBox);
            setTimeout(() => messageBox.remove(), 5000);
        }
        
        // Listen for the exit button click
        document.getElementById('exit-btn').addEventListener('click', exitVideoPlayer);

        // Listen for full-screen exit events
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                exitVideoPlayer();
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) {
                exitVideoPlayer();
            }
        });
        document.addEventListener('mozfullscreenchange', () => {
            if (!document.mozFullScreenElement) {
                exitVideoPlayer();
            }
        });
        document.addEventListener('MSFullscreenChange', () => {
            if (!document.msFullscreenElement) {
                exitVideoPlayer();
            }
        });


        // Function to render the list of channels
        function renderChannels() {
            const channelsListContainer = document.getElementById('channels-list');
            const channelCountElement = document.getElementById('channel-count');
            channelsListContainer.innerHTML = '';
            channelsData.forEach(channel => {
                const channelCard = createChannelCard(channel);
                channelsListContainer.appendChild(channelCard);
            });
            channelCountElement.textContent = channelsData.length;
        }

        // Call the function to render the channels when the page loads
        document.addEventListener('DOMContentLoaded', renderChannels);
