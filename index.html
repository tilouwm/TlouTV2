<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TlouTV Pro — Netflix TV Style (Firestick)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#05060a;
      --card:#1b212c;
      --border:rgba(255,255,255,.10);
      --text:#f0f6fc;
      --muted:rgba(240,246,252,.65);
      --accent:#ffae00;
      --glow:rgba(255,174,0,.35);
      --safe:34px;
      --tileW:240px;
      --tileH:135px;
      --gap:14px;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui;color:var(--text);}
    body{overflow-x:hidden;background:linear-gradient(180deg,#04050a,#070910 40%,#04050a);}

    /* TOP BAR */
    .topbar{
      position:fixed;top:0;left:0;right:0;z-index:50;
      padding:calc(var(--safe) - 6px) var(--safe) 14px;
      background:linear-gradient(180deg,rgba(5,6,10,.95),rgba(5,6,10,.55),transparent);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .brand{display:flex;align-items:center;gap:12px;min-width:170px;}
    .badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,174,0,.15);color:var(--accent);font-family:Outfit;font-weight:900;}
    .brand-title{font-family:Outfit;font-weight:900;font-size:26px;}
    .brand-title small{display:block;font-size:11px;color:var(--muted);letter-spacing:1.4px;}

    /* TABS */
    .tabs-viewport{
      position:relative;
      padding:8px;
      border-radius:999px;
      background:rgba(20,24,33,.60);
      border:1px solid var(--border);
      max-width:calc(100vw - 420px);
      overflow:hidden; /* keep the page from shifting */
      touch-action:pan-y; /* allow swipe without page shifting */
    }
    .tabs-rail{display:flex;gap:10px;transform:translateX(0);will-change:transform;}
    .tab{
      flex:0 0 auto;
      padding:10px 14px;
      border-radius:999px;
      font-weight:900;
      font-size:14px;
      color:var(--muted);
      white-space:nowrap;
      border:1px solid transparent;
      cursor:pointer;
      user-select:none;
    }
    .tab.active{background:var(--accent);color:#000;}
    .tab.focused{border-color:rgba(255,174,0,.6);box-shadow:0 0 0 2px rgba(255,174,0,.18),0 0 18px var(--glow);}

    /* Netflix fade cues */
    .fade-left,.fade-right{pointer-events:none;position:absolute;top:0;bottom:0;width:46px;z-index:5;opacity:.95;}
    .fade-left{left:0;background:linear-gradient(90deg,#05060a,transparent);}    
    .fade-right{right:0;background:linear-gradient(-90deg,#05060a,transparent);}   

    /* ROWS */
    .rows{
      position:relative;
      padding:calc(var(--safe) + 72px) var(--safe) calc(var(--safe) + 70px);
      height:100vh;
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:none;
      overscroll-behavior:contain;
    }
    .rows::-webkit-scrollbar{display:none;}

    .row{margin-bottom:26px;}
    .row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 6px;}
    .row-title{font-family:Outfit;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.3px;}
    .row-meta{font-size:12px;font-weight:800;color:rgba(240,246,252,.55);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}

    .rail-wrap{
      position:relative;
      overflow:hidden;
      border-radius:18px;
      background:rgba(20,24,33,.35);
      border:1px solid rgba(255,255,255,.06);
      padding:12px;
      touch-action:pan-y;
    }

    .rail-fade-left,.rail-fade-right{pointer-events:none;position:absolute;top:0;bottom:0;width:56px;z-index:4;opacity:.85;}
    .rail-fade-left{left:0;background:linear-gradient(90deg,rgba(5,6,10,.95),transparent);}    
    .rail-fade-right{right:0;background:linear-gradient(-90deg,rgba(5,6,10,.95),transparent);}   

    .rail{display:flex;gap:var(--gap);transform:translateX(0);will-change:transform;}

    .tile{width:var(--tileW);flex:0 0 auto;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--border);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;user-select:none;cursor:pointer;}
    .tile.focused{transform:scale(1.08);border-color:var(--accent);box-shadow:0 0 22px var(--glow);z-index:2;}

    .thumb{height:var(--tileH);display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
    .thumb img{width:100%;height:100%;object-fit:contain;object-position:center;padding:14px;background:#000;}
    .tile-foot{padding:10px 12px;font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* PLAYER */
    .player-overlay{position:fixed;inset:0;background:#000;z-index:2000;display:none;}
    .player-overlay.active{display:block;}
    #videoPlayer{width:100%;height:100%;background:#000;}

    .player-controls{position:absolute;bottom:18px;right:18px;opacity:0;transition:.2s;}
    .player-overlay.show-menu .player-controls{opacity:1;}
    .btn-back{background:rgba(0,0,0,.6);border:2px solid var(--accent);color:#fff;padding:7px 12px;border-radius:999px;font-weight:900;font-size:13px;letter-spacing:.4px;}
    .btn-back.focused{box-shadow:0 0 18px var(--glow);}

    .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--accent);font-weight:900;text-align:center;}

    @media (max-width:980px){
      :root{--safe:18px;--tileW:210px;--tileH:118px;}
      .tabs-viewport{max-width:calc(100vw - 220px);}
    }
  </style>
</head>

    </div>

    <nav class="tabs-viewport" id="tabsViewport" aria-label="Categories">
      <div class="fade-left"></div><div class="fade-right"></div>
      <div class="tabs-rail" id="tabsRail">
        <div class="tab active" data-cat="all">Home</div>
        <div class="tab" data-cat="news">News</div>
        <div class="tab" data-cat="general">General</div>
        <div class="tab" data-cat="music">Music</div>
        <div class="tab" data-cat="religious">Religious</div>

    </nav>
  </div>

<main class="rows" id="rows"></main>

  const rowsEl = document.getElementById('rows');

  const tabsRail = document.getElementById('tabsRail');

  const video = document.getElementById('videoPlayer');

  /* ================= STATE ================= */
  const state = {
    focus: 'tabs',
    tabIdx: 0,
    rowIdx: 0,
    itemIdx: 0,
    filter: 'all',
    rows: [],
    playing: false,
    menu: false
  };

  /* ================= ENV DETECT (FIRE TV / ANDROID TV) ================= */
  function isFireTv(){
    const ua = navigator.userAgent || '';
    return /AFT|Fire\s?TV|AmazonWebView|KF[A-Z]{2,}/i.test(ua);
  }

  /* ================= TABS: MOMENTUM + SNAP (NO PAGE SHIFT) ================= */
  let tabScrollX = 0;
  let tabVel = 0;
  let tabDragging = false;
  let tabLastX = 0;
  let tabSnapTimer = null;

  function tabsMaxShift(){
    const viewportW = tabsViewport.getBoundingClientRect().width;
    const railW = tabsRail.scrollWidth;
    return Math.max(0, railW - viewportW);
  }

  function applyTabsShift(){
    const max = tabsMaxShift();
    tabScrollX = Math.max(0, Math.min(tabScrollX, max));
    tabsRail.style.transform = `translateX(${-tabScrollX}px)`;
  }

  function snapTabsToCenter(){
    const viewportRect = tabsViewport.getBoundingClientRect();
    const viewportCenter = (viewportRect.left + viewportRect.right) / 2;

    let bestDelta = 0;
    let bestAbs = Infinity;
    tabs.forEach(t => {
      const r = t.getBoundingClientRect();
      const c = (r.left + r.right) / 2;
      const d = c - viewportCenter;
      const ad = Math.abs(d);
      if (ad < bestAbs){ bestAbs = ad; bestDelta = d; }
    });

    tabScrollX += bestDelta;
    applyTabsShift();
  }

  function scheduleTabSnap(){
    if (tabSnapTimer) clearTimeout(tabSnapTimer);
    tabSnapTimer = setTimeout(() => {
      if (!tabDragging && !state.playing) snapTabsToCenter();
    }, 90);
  }

  tabsViewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    tabVel += dx;
    scheduleTabSnap();
  }, { passive:false });

  tabsViewport.addEventListener('pointerdown', (e) => {
    tabDragging = true;
    tabLastX = e.clientX;
    tabsViewport.setPointerCapture?.(e.pointerId);
  });

  tabsViewport.addEventListener('pointermove', (e) => {
    if (!tabDragging) return;
    const dx = tabLastX - e.clientX;
    tabLastX = e.clientX;
    tabVel += dx;
    scheduleTabSnap();
  });

  tabsViewport.addEventListener('pointerup', () => {
    tabDragging = false;
    scheduleTabSnap();
  });

  function tickTabsMomentum(){
    if (Math.abs(tabVel) > 0.15){
      tabScrollX += tabVel;
      tabVel *= 0.92;
      applyTabsShift();
    }
    requestAnimationFrame(tickTabsMomentum);
  }
  tickTabsMomentum();

  /* ================= ROW RAIL: SWIPE SCROLL + MOMENTUM ================= */
  function getTileSize(rowObj){
    const tileEl = rowObj.railEl.querySelector('.tile');
    const tileW = tileEl ? tileEl.getBoundingClientRect().width : 240;
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 14;
    return { tileW, gap };
  }

  function railMaxShift(rowObj){
    const wrapW = rowObj.wrapEl.getBoundingClientRect().width;
    const { tileW, gap } = getTileSize(rowObj);
    const contentW = rowObj.items.length * (tileW + gap) - gap;
    return Math.max(0, contentW - wrapW + 12);
  }

  function applyRailShift(rowObj){
    const max = railMaxShift(rowObj);
    rowObj.scrollX = Math.max(0, Math.min(rowObj.scrollX || 0, max));
    rowObj.railEl.style.transform = `translateX(${-rowObj.scrollX}px)`;
  }

  function attachRailScroll(rowObj){
    rowObj.scrollX = rowObj.scrollX || 0;
    rowObj.velX = 0;
    rowObj.dragging = false;
    rowObj.lastX = 0;

    rowObj.wrapEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      rowObj.velX += dx;
    }, { passive:false });

    rowObj.wrapEl.addEventListener('pointerdown', (e) => {
      rowObj.dragging = true;
      rowObj.lastX = e.clientX;
      rowObj.wrapEl.setPointerCapture?.(e.pointerId);
    });

    rowObj.wrapEl.addEventListener('pointermove', (e) => {
      if (!rowObj.dragging) return;
      const dx = rowObj.lastX - e.clientX;
      rowObj.lastX = e.clientX;
      rowObj.velX += dx;
    });

    rowObj.wrapEl.addEventListener('pointerup', () => {
      rowObj.dragging = false;
    });

    const tick = () => {
      if (!state.playing && Math.abs(rowObj.velX) > 0.12){
        rowObj.scrollX += rowObj.velX;
        rowObj.velX *= 0.90;
        applyRailShift(rowObj);
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  /* ================= HELPERS ================= */
  function clearFocused(){
    document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  }

  function ensureRowVisible(rowEl){
    const box = rowsEl.getBoundingClientRect();
    const r = rowEl.getBoundingClientRect();
    const pad = 24;
    if (r.top < box.top + pad) rowsEl.scrollTop -= (box.top + pad - r.top);
    else if (r.bottom > box.bottom - pad) rowsEl.scrollTop += (r.bottom - (box.bottom - pad));
  }

  function updateRailTransformForFocus(rowObj){
    // For remote navigation: keep focused tile visible.
    // Don't fight while user is swiping.
    if (rowObj.dragging) return;

    const wrapW = rowObj.wrapEl.getBoundingClientRect().width;
    const { tileW, gap } = getTileSize(rowObj);
    const leftTarget = state.itemIdx * (tileW + gap);
    const margin = 80;
    const contentW = rowObj.items.length * (tileW + gap) - gap;
    const maxShift = Math.max(0, contentW - wrapW + margin);

    let shift = leftTarget - margin;
    shift = Math.max(0, Math.min(shift, maxShift));

    rowObj.scrollX = shift;
    applyRailShift(rowObj);
  }

  function updateFocus(){
    clearFocused();

    if (state.playing){
      if (state.menu) backBtn.classList.add('focused');
      return;
    }

    if (state.focus === 'tabs'){
      const tab = tabs[state.tabIdx];
      if (tab) tab.classList.add('focused');
      return;
    }

    const rowObj = state.rows[state.rowIdx];
    if (!rowObj) return;

    const tile = rowObj.railEl.querySelector(`.tile[data-i="${state.itemIdx}"]`);
    if (tile) tile.classList.add('focused');

    updateRailTransformForFocus(rowObj);
    ensureRowVisible(rowObj.rowEl);
  }

  /* ================= RENDER ================= */
  function buildRows(){
    rowsEl.innerHTML = '';
    state.rows = [];

    const genresToShow = (state.filter === 'all')
      ? GENRE_ORDER
      : GENRE_ORDER.filter(g => g === state.filter);

    genresToShow.forEach(g => {
      const items = CHANNELS.filter(c => c.genre === g);
      if (!items.length) return;

      const section = document.createElement('section');
      section.className = 'row';
      section.dataset.genre = g;

      const head = document.createElement('div');
      head.className = 'row-head';
      head.innerHTML = `<div class="row-title">${g.toUpperCase()}</div><div class="row-meta">${items.length} channels</div>`;

      const wrap = document.createElement('div');
      wrap.className = 'rail-wrap';
      wrap.innerHTML = `<div class="rail-fade-left"></div><div class="rail-fade-right"></div>`;

      const rail = document.createElement('div');
      rail.className = 'rail';

      items.forEach((c, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.i = String(i);
        tile.innerHTML = `
          <div class="thumb"><img src="${c.logo}" alt="" loading="lazy" onerror="this.style.display='none'" /></div>
          <div class="tile-foot">${c.name}</div>
        `;
        rail.appendChild(tile);
      });

      wrap.appendChild(rail);
      section.appendChild(head);
      section.appendChild(wrap);
      rowsEl.appendChild(section);

      const rowObj = { genre: g, items, rowEl: section, wrapEl: wrap, railEl: rail, scrollX: 0, velX: 0, dragging: false, lastX: 0 };
      state.rows.push(rowObj);
      attachRailScroll(rowObj);
    });

    state.rowIdx = Math.min(state.rowIdx, Math.max(0, state.rows.length - 1));
    const curRow = state.rows[state.rowIdx];
    state.itemIdx = Math.min(state.itemIdx, Math.max(0, (curRow?.items.length || 1) - 1));

    // Ensure transforms are set immediately
    state.rows.forEach(r => applyRailShift(r));
    updateFocus();
  }

  /* ================= FILTER (TABS) ================= */
  function setFilter(cat){
    state.filter = cat;
    tabs.forEach(t => t.classList.remove('active'));

    const idx = tabs.findIndex(t => (t.dataset.cat || 'all') === cat);
    state.tabIdx = idx >= 0 ? idx : 0;
    tabs[state.tabIdx].classList.add('active');

    state.rowIdx = 0;
    state.itemIdx = 0;

    rowsEl.scrollTop = 0;
    buildRows();
  }

  /* ================= PLAYBACK ================= */
  function cleanupPlayback(){
    if (hls){ try{ hls.destroy(); } catch(_){ } hls = null; }
    try{ video.pause(); } catch(_){ }
    video.srcObject = null;
    video.removeAttribute('src');
    video.load();
  }

  function buildVlcIntent(url){
    // Android intent: intent://host/path#Intent;scheme=https;package=org.videolan.vlc;type=application/x-mpegURL;action=android.intent.action.VIEW;end
    try{
      const u = new URL(url);
      const scheme = (u.protocol || 'https:').replace(':','');
      const path = `${u.host}${u.pathname}${u.search}`;
      const type = /\.m3u8(\?|$)/i.test(url) ? 'application/x-mpegURL' : 'video/*';
      return `intent://${path}#Intent;scheme=${scheme};package=org.videolan.vlc;action=android.intent.action.VIEW;type=${type};end`;
    } catch(_){
      // Worst-case fallback
      return `vlc://${url}`;
    }
  }

  function openExternalFallback(url){
    if (isFireTv()){
      loading.style.display = 'block';
      loading.innerHTML = 'Opening VLC…<br><small style="font-size:14px;opacity:.7;">Press BACK to return</small>';
      const intentUri = buildVlcIntent(url);
      try { window.location.href = intentUri; return; } catch(_){ }
    }

    // Desktop / normal web fallback
    loading.style.display = 'block';
    loading.innerHTML = 'Opening external player…<br><small style="font-size:14px;opacity:.7;">If nothing opens, press BACK.</small>';
    let opened = null;
    try { opened = window.open(url, '_blank'); } catch(_) { opened = null; }
    if (!opened){ try { window.location.assign(url); } catch(_) {} }
  }

  function startWebPlayback(url){
    cleanupPlayback();

    const isHttp = /^http:\/\//i.test(url);
    const httpsTry = isHttp ? url.replace(/^http:\/\//i, 'https://') : url;

    const tryNative = (src) => new Promise((resolve, reject) => {
      let done = false;

      const cleanup = () => {
        video.removeEventListener('canplay', onCanPlay);
        video.removeEventListener('canplaythrough', onCanPlay);
        video.removeEventListener('error', onFail);
        video.removeEventListener('stalled', onFail);
      };

      const onCanPlay = async () => {
        if (done) return;
        done = true;
        cleanup();
        try { await video.play(); } catch(_){ }
        resolve(true);
      };

      const onFail = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('native_fail'));
      };

      video.addEventListener('canplay', onCanPlay);
      video.addEventListener('canplaythrough', onCanPlay);
      video.addEventListener('error', onFail);
      video.addEventListener('stalled', onFail);

      video.controls = true;
      video.autoplay = true;
      video.muted = false;
      video.playsInline = true;
      video.setAttribute('playsinline','');
      video.setAttribute('webkit-playsinline','');

      video.src = src;
      video.load();

      setTimeout(() => {
        if (!done){
          done = true;
          cleanup();
          reject(new Error('native_timeout'));
        }
      }, 6500);
    });

    const tryHlsJs = (src) => new Promise((resolve, reject) => {
      if (!(window.Hls && Hls.isSupported())) return reject(new Error('hls_not_supported'));

      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30,
        xhrSetup: (xhr) => { xhr.withCredentials = false; }
      });

      const cleanup = () => {
        if (!hls) return;
        hls.off(Hls.Events.MANIFEST_PARSED, onParsed);
        hls.off(Hls.Events.ERROR, onError);
      };

      const onParsed = async () => {
        cleanup();
        try { await video.play(); } catch(_){ }
        resolve(true);
      };

      const onError = (_evt, data) => {
        if (data && data.fatal){
          cleanup();
          reject(new Error(data.type || 'hls_fatal'));
        }
      };

      hls.on(Hls.Events.MANIFEST_PARSED, onParsed);
      hls.on(Hls.Events.ERROR, onError);

      hls.loadSource(src);
      hls.attachMedia(video);

      setTimeout(() => {
        cleanup();
        reject(new Error('hls_timeout'));
      }, 9000);
    });

    (async () => {
      try{
        if (httpsTry !== url){
          try { await tryNative(httpsTry); loading.style.display='none'; return; } catch(_){ }
        }
        await tryNative(url);
        loading.style.display = 'none';
        return;
      } catch(_nativeErr){
        try{
          await tryHlsJs(httpsTry);
          loading.style.display = 'none';
          return;
        } catch(_hlsErr){
          openExternalFallback(url);
        }
      }
    })();
  }

  function openPlayer(channel){
    state.playing = true;
    state.menu = false;

    player.classList.add('active');
    player.classList.remove('show-menu');
    player.setAttribute('aria-hidden', 'false');

    loading.style.display = 'block';
    loading.innerHTML = `Loading stream…<br><small style="font-size:14px;opacity:.7;">${channel.name}</small>`;

    startWebPlayback(channel.url);
    updateFocus();
  }

  function stopPlayback(){
    state.playing = false;
    state.menu = false;

    player.classList.remove('active');
    player.classList.remove('show-menu');
    player.setAttribute('aria-hidden', 'true');

    cleanupPlayback();

    loading.style.display = 'block';
    loading.innerHTML = 'Loading stream…';

    updateFocus();
  }

  function togglePlayerMenu(){
    state.menu = !state.menu;
    player.classList.toggle('show-menu', state.menu);
    updateFocus();
  }

  /* ================= ACTIONS ================= */
  function handleEnter(){
    if (state.playing){
      togglePlayerMenu();
      return;
    }

    if (state.focus === 'tabs'){
      const cat = tabs[state.tabIdx]?.dataset.cat || 'all';
      setFilter(cat);
      state.focus = 'rows';
      updateFocus();
      return;
    }

    const rowObj = state.rows[state.rowIdx];
    const ch = rowObj ? rowObj.items[state.itemIdx] : null;
    if (ch) openPlayer(ch);
  }

  function handleBack(){
    if (state.playing){
      stopPlayback();
      return true;
    }

    if (state.focus === 'rows'){
      state.focus = 'tabs';
      updateFocus();
      return true;
    }

    return false;
  }

  /* ================= CLICK SUPPORT ================= */
  tabsRail.addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    state.tabIdx = tabs.indexOf(tab);
    setFilter(tab.dataset.cat || 'all');
    state.focus = 'rows';
    updateFocus();
  });

  rowsEl.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;

    const rowSection = e.target.closest('.row');
    const genre = rowSection ? rowSection.dataset.genre : null;
    const rIdx = state.rows.findIndex(r => r.genre === genre);
    const iIdx = parseInt(tile.dataset.i || '0', 10);

    if (rIdx >= 0){
      state.focus = 'rows';
      state.rowIdx = rIdx;
      state.itemIdx = iIdx;
      updateFocus();
      handleEnter();
    }
  });

  backBtn.addEventListener('click', stopPlayback);

  /* ================= FIRESTICK REMOTE / KEYBOARD ================= */
  window.addEventListener('keydown', (e) => {
    const keyCode = e.keyCode;
    const key = e.key;

    if ([37,38,39,40].includes(keyCode)) e.preventDefault();

    if (keyCode === 13 || key === 'Enter'){
      e.preventDefault();
      handleEnter();
      return;
    }

    if (keyCode === 8 || keyCode === 27 || keyCode === 10009 || key === 'Backspace' || key === 'Escape'){
      const handled = handleBack();
      if (handled) e.preventDefault();
      return;
    }

    if (state.playing) return;

    if (state.focus === 'tabs'){
      if (keyCode === 37 || key === 'ArrowLeft'){
        state.tabIdx = Math.max(0, state.tabIdx - 1);
        updateFocus();
        return;
      }
      if (keyCode === 39 || key === 'ArrowRight'){
        state.tabIdx = Math.min(tabs.length - 1, state.tabIdx + 1);
        updateFocus();
        return;
      }
      if (keyCode === 40 || key === 'ArrowDown'){
        state.focus = 'rows';
        updateFocus();
        return;
      }
      return;
    }

    if (state.focus === 'rows'){
      const rowObj = state.rows[state.rowIdx];
      if (!rowObj) return;

      if (keyCode === 37 || key === 'ArrowLeft'){
        state.itemIdx = Math.max(0, state.itemIdx - 1);
        updateFocus();
        return;
      }
      if (keyCode === 39 || key === 'ArrowRight'){
        state.itemIdx = Math.min(rowObj.items.length - 1, state.itemIdx + 1);
        updateFocus();
        return;
      }
      if (keyCode === 38 || key === 'ArrowUp'){
        if (state.rowIdx === 0){
          state.focus = 'tabs';
        } else {
          state.rowIdx = Math.max(0, state.rowIdx - 1);
          state.itemIdx = Math.min(state.itemIdx, state.rows[state.rowIdx].items.length - 1);
        }
        updateFocus();
        return;
      }
      if (keyCode === 40 || key === 'ArrowDown'){
        state.rowIdx = Math.min(state.rows.length - 1, state.rowIdx + 1);
        state.itemIdx = Math.min(state.itemIdx, state.rows[state.rowIdx].items.length - 1);
        updateFocus();
        return;
      }
    }
  }, { passive:false });

  window.addEventListener('resize', () => {
    updateFocus();
    applyTabsShift();
    state.rows.forEach(r => applyRailShift(r));
  });

  /* ================= TESTS ================= */
  function runTests(){
    console.assert(Array.isArray(CHANNELS) && CHANNELS.length > 0, 'TEST: CHANNELS must be non-empty');
    console.assert(tabs.length >= 2, 'TEST: tabs should exist');

    setFilter('all');
    console.assert(state.rows.length > 0, 'TEST: rows should render on Home');

    const firstRow = state.rows[0];
    console.assert(!!firstRow, 'TEST: first row exists');
    const firstTile = firstRow?.railEl?.querySelector('.tile');
    console.assert(!!firstTile, 'TEST: first tile exists');

    // Row scroll math should be valid
    const generalRow = state.rows.find(r => r.genre === 'general');
    if (generalRow){
      const max = railMaxShift(generalRow);
      console.assert(max >= 0, 'TEST: rail max shift computed');
    }

    // Hls.js presence (optional; native may still work)
    console.assert(typeof window.Hls !== 'undefined', 'TEST: Hls.js should be loaded');

    // VLC intent builder should return a usable string
    const intent = buildVlcIntent('https://example.com/live/playlist.m3u8');
    console.assert(typeof intent === 'string' && intent.length > 10, 'TEST: VLC intent should be buildable');
  }

  /* ================= INIT ================= */
  setFilter('all');
  state.focus = 'tabs';
  updateFocus();
  applyTabsShift();
  runTests();
</script>
</body>
</html>
