        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #2b3e50 0%, #000000 100%);
            color: #ecf0f1;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .sidebar {
            width: 280px;
            background: rgba(189, 195, 199, 0.1);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .app-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #1abc9c, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .app-subtitle {
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .categories {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .category-item {
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            outline: none; /* Remove default outline */
        }

        .category-item:hover, .category-item:focus {
            background: rgba(255, 255, 255, 0.1);
            border-left-color: #1abc9c;
            outline: 2px solid #1abc9c; /* Add a clear focus outline */
        }

        .category-item.active {
            background: rgba(26, 188, 156, 0.2);
            border-left-color: #1abc9c;
        }

        .category-icon {
            font-size: 18px;
        }

        .category-name {
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
        }

        .content-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-title {
            font-size: 20px;
            font-weight: 600;
        }

        .channels-grid {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .channel-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            outline: none; /* Remove default outline */
        }

        .channel-card:hover, .channel-card:focus {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            outline: 2px solid #1abc9c; /* Add a clear focus outline */
        }
        
        .channel-logo {
            width: 100%;
            max-width: 120px;
            height: auto;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .channel-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .channel-description {
            font-size: 14px;
            opacity: 0.8;
            line-height: 1.4;
        }

        .channel-status {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .fullscreen-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .player-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            transition: opacity 0.3s ease;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .live-indicator {
            background: #c0392b;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .close-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        
        .close-button:hover, .close-button:focus {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
            outline: 2px solid #1abc9c;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .message-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            text-align: center;
        }

        .message-box-content {
            margin-bottom: 15px;
        }

        .message-box-close {
            background: #3498db;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            outline: none;
        }

        .message-box-close:hover, .message-box-close:focus {
            background: #2980b9;
            outline: 2px solid #2980b9;
        }

        /* Scrollbar Styling */
        .categories::-webkit-scrollbar,
        .channels-grid::-webkit-scrollbar {
            width: 6px;
        }

        .categories::-webkit-scrollbar-track,
        .channels-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .categories::-webkit-scrollbar-thumb,
        .channels-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .categories::-webkit-scrollbar-thumb:hover,
        .channels-grid::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 250px;
            }
            
            .channels-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 15px;
            }
            
            .channel-card {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .app-container {
                flex-direction: column;
            }
            
            .channels-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>

            </div>
            
            <div class="channels-grid" id="channelsGrid">

            </div>
        </div>
    </div>

    <!-- Fullscreen Video Player -->
    <div class="fullscreen-player" id="fullscreenPlayer">
        <div class="player-header" id="playerHeader">
            <div class="channel-info">

            </div>
            <button class="close-button" id="closeButton" tabindex="0">✕</button>
        </div>
        
        <video class="video-player" id="videoPlayer" controls autoplay>
            Your browser does not support the video element.
        </video>
        
        <div class="loading-spinner" id="loadingSpinner"></div>
    </div>

    <!-- Custom Message Box -->

        <p class="message-box-content" id="messageBoxContent"></p>
        <button class="message-box-close" id="messageBoxClose" tabindex="0">Close</button>
    </div>

            {

                "stream": "https://59d39900ebfb8.streamlock.net/RadioTelehit/RadioTelehit/playlist.m3u8",
                "category": "music",
                "description": "Music hits and entertainment from Radio Tele Hit"
            },
            {
                "id": "channel37",
                "name": "Radio Tele Sentinel",
                "logo": "https://radiotelesentinel.com/wp-content/uploads/2025/03/logo-sentinel.png",
                "stream": "https://59d39900ebfb8.streamlock.net/radiotelesentinel/radiotelesentinel/chunklist_w2035690488.m3u8",
                "category": "religious",
                "description": "Religious programming from Radio Tele Sentinel"
            },
            {
                "id": "channel38",
                "name": "VA Studio",
                "logo": "https://i.imgur.com/bIQjQo1.jpeg",
                "stream": "https://haititivi.com/haiti/vastudio/tracks-v1a1/mono.m3u8",
                "category": "music",
                "description": "Music and shows from VA Studio"
            },
            {
                "id": "channel39",
                "name": "Dream In TV",
                "logo": "https://static.wixstatic.com/media/c20f16_88daef05f04d47a7a4ed5446151b00de.png/v1/fill/w_146,h_148,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/c20f16_88daef05f04d47a7a4ed5446151b00de.png",
                "stream": "https://571561.gvideo.io/videos/571561_gBLHk4sorem4ZE/index-s0q3567v1-v1-a1.m3u8",
                "category": "music",
                "description": "Music channel to help you dream in TV"
            }
        ];

        // DOM Elements
        const categoriesContainer = document.getElementById('categories');
        const channelsGrid = document.getElementById('channelsGrid');
        const contentTitle = document.querySelector('.content-title');
        const fullscreenPlayer = document.getElementById('fullscreenPlayer');
        const videoPlayer = document.getElementById('videoPlayer');
        const currentChannelName = document.getElementById('currentChannelName');
        const closeButton = document.getElementById('closeButton');
        const playerHeader = document.getElementById('playerHeader');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const messageBox = document.getElementById('messageBox');
        const messageBoxContent = document.getElementById('messageBoxContent');
        const messageBoxClose = document.getElementById('messageBoxClose');

        let hls = null;
        let headerTimeout = null;
        let focusableElements = [];
        let currentFocusIndex = 0;
        const channelGridColumns = 3; // Hardcoded value for grid navigation, adjust if needed

        // Initialize app
        function init() {
            setupEventListeners();
            renderChannels('all');
        }

        // Setup event listeners
        function setupEventListeners() {
            categoriesContainer.addEventListener('click', (e) => {
                if (e.target.closest('.category-item')) {
                    const item = e.target.closest('.category-item');
                    const category = item.dataset.category;
                    selectCategory(item, category);
                }
            });

            channelsGrid.addEventListener('click', (e) => {
                const channelCard = e.target.closest('.channel-card');
                if (channelCard) {
                    const channelId = channelCard.dataset.id;
                    const channel = channels.find(c => c.id === channelId);
                    if (channel) {
                        playChannel(channel);
                    }
                }
            });

            closeButton.addEventListener('click', closeFullscreen);
            videoPlayer.addEventListener('loadstart', showLoading);
            videoPlayer.addEventListener('canplay', hideLoading);
            videoPlayer.addEventListener('error', handleVideoError);
            fullscreenPlayer.addEventListener('mousemove', showPlayerHeader);
            fullscreenPlayer.addEventListener('mouseleave', hidePlayerHeader);

            document.addEventListener('keydown', handleKeyNavigation);

            messageBoxClose.addEventListener('click', hideMessage);
        }

        // Handle remote/keyboard navigation
        function handleKeyNavigation(e) {
            const isPlayerVisible = fullscreenPlayer.style.display === 'flex';
            
            if (isPlayerVisible) {
                // Handle navigation within the fullscreen player
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
                    e.preventDefault();
                    closeFullscreen();
                }
                return;
            }

            // Handle navigation in the main view
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveFocus(-1);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveFocus(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                moveFocus(getLeftIndex());
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                moveFocus(getRightIndex());
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                if (focusableElements[currentFocusIndex]) {
                    focusableElements[currentFocusIndex].click();
                }
            } else if (e.key === 'Escape') {
                // Focus the first element on escape
                if (focusableElements.length > 0) {
                    currentFocusIndex = 0;
                    focusableElements[currentFocusIndex].focus();
                }
            }
        }

        function getLeftIndex() {
            if (currentFocusIndex === 0) return 0; // Don't move left from sidebar
            
            const numCategories = categoriesContainer.children.length;
            if (currentFocusIndex < numCategories) {
                return -1; // No left movement in sidebar
            }
            
            const channelIndex = currentFocusIndex - numCategories;
            const channelRow = Math.floor(channelIndex / channelGridColumns);
            const channelCol = channelIndex % channelGridColumns;
            
            if (channelCol === 0) {
                // Move to the last element of the previous row or stay put
                return -1;
            }
            return -1;
        }

        function getRightIndex() {
            const numCategories = categoriesContainer.children.length;
            if (currentFocusIndex < numCategories - 1) {
                return 1; // Right movement in sidebar
            }
            
            const channelIndex = currentFocusIndex - numCategories;
            const channelCol = channelIndex % channelGridColumns;
            
            if (channelCol === channelGridColumns - 1) {
                // Cannot move right from last column
                return 0; 
            }
            if (currentFocusIndex < focusableElements.length - 1) {
                return 1;
            }
            return 0; // No more elements to the right
        }

        // Move the focus to a new element
        function moveFocus(delta) {
            let newIndex = currentFocusIndex + delta;
            if (newIndex < 0) {
                newIndex = 0; // Wrap around to the start
            } else if (newIndex >= focusableElements.length) {
                newIndex = focusableElements.length - 1; // Wrap around to the end
            }

            if (focusableElements[newIndex]) {
                focusableElements[newIndex].focus();
                currentFocusIndex = newIndex;
            }
        }

        // Update the list of focusable elements
        function updateFocusableElements() {
            const categoryItems = Array.from(document.querySelectorAll('.category-item'));
            const channelCards = Array.from(document.querySelectorAll('.channel-card'));
            focusableElements = [...categoryItems, ...channelCards];
            
            // Set initial focus
            if (focusableElements.length > 0) {
                focusableElements[currentFocusIndex].focus();
            }
        }

        // Show a custom message box
        function showMessage(message) {
            messageBoxContent.textContent = message;
            messageBox.style.display = 'block';
        }

        // Hide the custom message box
        function hideMessage() {
            messageBox.style.display = 'none';
        }

        // Select category
        function selectCategory(item, category) {
            document.querySelectorAll('.category-item').forEach(cat => cat.classList.remove('active'));
            item.classList.add('active');
            
            const categoryNames = {
                all: 'All Channels',
                news: 'News Channels',
                music: 'Music Channels', 
                general: 'General Entertainment',
                sports: 'Sports Channels',
                religious: 'Religious Programs'
            };
            
            contentTitle.textContent = categoryNames[category] || 'All Channels';
            renderChannels(category);
        }

        // Render channels based on category
        function renderChannels(category) {
            const filteredChannels = category === 'all' 
                ? channels 
                : channels.filter(channel => channel.category === category);

            channelsGrid.innerHTML = '';

            if (filteredChannels.length === 0) {
                const noChannelsMessage = document.createElement('div');
                noChannelsMessage.className = 'text-center text-gray-400 p-8';
                noChannelsMessage.textContent = 'No channels found in this category.';
                channelsGrid.appendChild(noChannelsMessage);
            } else {
                filteredChannels.forEach(channel => {
                    const channelCard = document.createElement('div');
                    channelCard.className = 'channel-card';
                    channelCard.dataset.id = channel.id;
                    channelCard.dataset.stream = channel.stream;
                    channelCard.dataset.name = channel.name;
                    channelCard.dataset.category = channel.category;
                    channelCard.tabIndex = 0; // Make channel cards focusable

                    // Updated onerror to show TlouTV text
                    channelCard.innerHTML = `
                        <div class="channel-status"></div>
                        <img src="${channel.logo}" alt="${channel.name} Logo" class="channel-logo" onerror="this.onerror=null;this.src='https://placehold.co/100x100/555/fff?text=TlouTV';">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-description">${channel.description}</div>
                    `;

                    channelsGrid.appendChild(channelCard);
                });
            }
            updateFocusableElements();
        }

        // Play channel in fullscreen
        function playChannel(channel) {
            currentChannelName.textContent = channel.name;
            fullscreenPlayer.style.display = 'flex';
            showLoading();
            
            // Set focus to the close button when player opens
            closeButton.focus();

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(channel.stream);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().catch(e => {
                        console.error("Autoplay was prevented:", e);
                        showMessage("Autoplay was prevented by the browser. Please tap to play the video.");
                        hideLoading();
                    });
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = channel.stream;
                videoPlayer.play().catch(e => {
                    console.error("Autoplay was prevented:", e);
                    showMessage("Autoplay was prevented by the browser. Please tap to play the video.");
                    hideLoading();
                });
            }
        }

        // Close fullscreen player
        function closeFullscreen() {
            fullscreenPlayer.style.display = 'none';
            videoPlayer.pause();
            if (hls) {
                hls.destroy();
                hls = null;
            }
            // Return focus to the element that was last selected
            if (focusableElements[currentFocusIndex]) {
                focusableElements[currentFocusIndex].focus();
            }
        }

        // Show/hide loading spinner
        function showLoading() {
            loadingSpinner.style.display = 'block';
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
        }

        // Handle video errors
        function handleVideoError() {
            hideLoading();
            showMessage('Error loading video stream. Please try another channel.');
        }

        // Show player header on mouse move
        function showPlayerHeader() {
            playerHeader.style.opacity = '1';
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => {
                playerHeader.style.opacity = '0';
            }, 3000);
        }

        // Hide player header
        function hidePlayerHeader() {
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => {
                playerHeader.style.opacity = '0';
            }, 1000);
        }

        // Initialize the application
        init();
    </script>
</body>
