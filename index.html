    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        setLogLevel('debug');
        
        // Expose global variables for use in the script
        window.initializeApp = initializeApp;
        window.getAuth = getAuth;
        window.signInAnonymously = signInAnonymously;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.getFirestore = getFirestore;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
    </script>
    <style>
        :root {
            --bg-dark: #121e3d; /* Dark blue background */
            --bg-medium: #1c2849; /* Medium blue for containers */
            --text-light: #F0F0F0;
            --text-gray: #B0B0B0;
            --accent-blue: #4a90e2; /* Bright blue accent */
            --card-border: 2px solid #283e74; /* Darker blue border */
            --card-focus-border: 2px solid var(--accent-blue);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            /* Make the body take up the full viewport height and use flexbox */
            height: 100vh;
            overflow: hidden; /* Hide main body scrollbar */
        }
        
        /* The main container now manages the two columns */
        .main-container {
            height: calc(100vh - 84px); /* Full height minus header height */
            overflow: hidden; /* Hide scrollbar for the container */
        }
        
        /* Channel grid container scrolls independently */
        .channel-grid-container {
            flex-grow: 1; /* Allows it to take up all available space */
            overflow-y: auto; /* Adds a scrollbar only for this section */
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .channel-grid-container::-webkit-scrollbar {
            width: 8px;
            background-color: transparent;
        }
        
        .channel-grid-container::-webkit-scrollbar-thumb {
            background-color: var(--accent-blue);
            border-radius: 4px;
        }

        .video-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .video-player-content {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
        }

        .video-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        .channel-card-container {
            position: relative;
        }

        .channel-card {
            min-height: 200px;
            animation: fadeIn 0.5s ease-out forwards;
            border: var(--card-border);
            transition: all 0.3s ease;
        }

        .selected-card {
            border: var(--card-focus-border);
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
            transform: scale(1.05);
        }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-button {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .category-button:hover {
            background-color: #2b3b64;
        }

        .category-button.active {
            background-color: var(--accent-blue);
            font-weight: 600;
            border-color: transparent;
        }

        .search-bar-focused {
            border: 2px solid var(--accent-blue);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-black p-4 md:p-6 flex flex-col md:flex-row items-center justify-between shadow-xl space-y-4 md:space-y-0">
        <h1 class="text-3xl font-bold tracking-wide text-[var(--accent-blue)]">TlouTV</h1>
        <div class="flex items-center space-x-2 bg-[var(--bg-medium)] rounded-full p-2 px-4 w-full md:w-96 focus-within:ring-2 focus-within:ring-[var(--accent-blue)] transition-all">
            <i class="fas fa-search text-[var(--text-gray)] text-xl"></i>
            <input type="text" id="search-input" placeholder="Search channels..." class="p-1 bg-transparent text-white focus:outline-none w-full">
        </div>
    </header>

    <!-- Main Content Area with two columns -->
    <!-- The main-container class is new and manages the height and overflow -->
    <main class="main-container flex-grow p-4 md:p-6 flex flex-col md:flex-row space-y-6 md:space-y-0 md:space-x-6">
        
        <!-- Left Sidebar - Categories -->
        <aside class="w-full md:w-1/4 bg-[var(--bg-medium)] rounded-lg p-6 shadow-xl flex-shrink-0 md:h-full">
            <h2 class="text-2xl font-bold mb-6 text-[var(--text-light)]">Categories</h2>
            
            <!-- Category buttons -->
            <div id="categories-list" class="space-y-2">
                <button class="category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium active" data-filter="All">
                    <span>All Channels</span>
                    <span id="all-count" class="bg-blue-600 px-2 py-1 text-xs rounded-full">0</span>
                </button>
                <button class="category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium" data-filter="Favorites">
                    <span>Favorites</span>
                    <span id="favorites-count" class="bg-gray-600 px-2 py-1 text-xs rounded-full">0</span>
                </button>
                <!-- Other category buttons will be generated here -->
            </div>
        </aside>

        <!-- Right Main Content - Channel Grid -->
        <!-- This container now handles its own vertical scrolling -->
        <div class="channel-grid-container flex-grow flex flex-col">
            <div class="flex items-baseline mb-4 space-x-2">
                 <h2 id="main-title" class="text-2xl font-semibold text-[var(--text-light)]">All Channels</h2>
                 <span id="channel-count" class="text-[var(--text-gray)] text-lg">(0)</span>
            </div>
            
            <div id="channels-list" class="grid gap-4 sm:gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
                <!-- Channel cards will be generated here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div id="video-modal" class="video-player-container">
        <!-- Exit Button -->
        <button id="exit-btn" class="absolute top-6 right-6 text-white text-3xl font-bold bg-black bg-opacity-50 p-2 rounded-full w-14 h-14 flex items-center justify-center transition-transform transform hover:scale-110 focus:outline-none z-50" tabindex="0">
            <i class="fas fa-times"></i>
        </button>
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center space-y-4 text-white">
            <div class="loader"></div>
            <span>Loading...</span>
        </div>
        <div class="video-player-content hidden">
            <video id="video-player" class="video-player" controls autoplay></video>
        </div>
    </div>

    <!-- Exit Confirmation Modal -->
    <div id="exit-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[1001] hidden">
        <div class="bg-[var(--bg-medium)] p-8 rounded-xl shadow-2xl text-center flex flex-col items-center space-y-6 max-w-sm w-full">
            <h3 class="text-xl font-bold text-[var(--accent-blue)]">Exit Application?</h3>
            <p class="text-[var(--text-gray)]">Are you sure you want to exit the app?</p>
            <div class="flex space-x-4">
                <button id="confirm-exit-btn" class="bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:bg-red-700" tabindex="0">
                    Exit
                </button>
                <button id="cancel-exit-btn" class="bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:bg-gray-700" tabindex="0">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // Global variables for Firebase services
        let db;
        let auth;
        let userId = 'default-user-id'; // Default ID for anonymous users
        let channelData = [];
        let favorites = new Set();
        let currentFilter = 'All';
        let currentCategory = 'All';
        let hlsInstance = null;
        let currentFocusedIndex = -1; // New variable to track keyboard focus
        let focusedSection = 'categories'; // 'categories' or 'channels'
        let lastSelectedChannelId = null; // New variable to store the ID of the last played channel
        let allChannelsCount = 0;
        
        // Get global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // DOM Elements
        const channelsList = document.getElementById('channels-list');
        const mainTitle = document.getElementById('main-title');
        const channelCountSpan = document.getElementById('channel-count');
        const videoModal = document.getElementById('video-modal');
        const videoPlayer = document.getElementById('video-player');
        const loadingSpinner = document.getElementById('loading-spinner');
        const videoContent = document.querySelector('.video-player-content');
        const exitModal = document.getElementById('exit-modal');
        const confirmExitBtn = document.getElementById('confirm-exit-btn');
        const cancelExitBtn = document.getElementById('cancel-exit-btn');
        const exitPlayerBtn = document.getElementById('exit-btn');
        const searchInput = document.getElementById('search-input');
        const searchInputWrapper = searchInput.parentElement;
        const filterButtons = document.querySelectorAll('.category-button'); // Now all sidebar buttons are categories
        const categoriesList = document.getElementById('categories-list');
        const allCountSpan = document.getElementById('all-count');
        const favoritesCountSpan = document.getElementById('favorites-count');

        // State for search keyboard
        let isSearchKeyboardVisible = false;
        
        // Main app initialization function
        async function initApp() {
            // First, load and render channels immediately
            fetchChannels();

            // Then, initialize Firebase and handle user authentication in the background
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            // Handle user authentication
            if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                } catch (error) {
                    console.error("Error signing in with custom token, signing in anonymously:", error);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }

            // Listen for auth state changes to update the favorites list
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("Authenticated with user ID:", userId);
                    listenToFavorites();
                } else {
                    console.log("User is signed out.");
                }
            });

            // Event listeners
            confirmExitBtn.addEventListener('click', () => window.history.back());
            cancelExitBtn.addEventListener('click', () => exitModal.style.display = 'none');
            exitPlayerBtn.addEventListener('click', exitVideoPlayer);
            searchInput.addEventListener('input', (e) => filterChannels());
            
            // Add category listeners
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    currentCategory = btn.dataset.filter;
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderCategories();
                    filterChannels();
                });
            });

            // Set up search bar focus and blur events
            searchInput.addEventListener('focus', () => {
                isSearchKeyboardVisible = true;
                searchInputWrapper.classList.add('search-bar-focused');
            });

            searchInput.addEventListener('blur', () => {
                isSearchKeyboardVisible = false;
                searchInputWrapper.classList.remove('search-bar-focused');
            });

            // Add global keydown listener for remote control navigation
            document.addEventListener('keydown', handleKeyNavigation);
        }
        
        // Filter and search channels
        function filterChannels() {
            const query = searchInput.value.toLowerCase();
            let filtered = channelData;
            
            if (currentCategory === 'Favorites') {
                filtered = filtered.filter(channel => favorites.has(channel.id));
            } else if (currentCategory !== 'All') {
                filtered = filtered.filter(channel => filtered.filter(c => c.category === currentCategory));
            }
            
            if (query) {
                filtered = filtered.filter(channel => channel.name.toLowerCase().includes(query));
            }
            
            renderChannels(filtered);
        }

        // Fetch channel data from JSON file
        function fetchChannels() {
            try {
                const channelsJsonText = document.getElementById('channels-data').textContent;
                channelData = JSON.parse(channelsJsonText);
                allChannelsCount = channelData.length;
                allCountSpan.textContent = allChannelsCount;
                renderCategories();
                filterChannels();
            } catch (error) {
                console.error("Failed to load channel data:", error);
                channelsList.innerHTML = `<p class="text-red-400 text-center col-span-full">Failed to load channels. Please try again later.</p>`;
            }
        }

        // Firestore listener for real-time favorite updates
        function listenToFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            onSnapshot(userFavoritesRef, (doc) => {
                if (doc.exists()) {
                    favorites = new Set(doc.data().channels || []);
                } else {
                    favorites = new Set();
                }
                favoritesCountSpan.textContent = favorites.size;
                filterChannels();
            });
        }
        
        // Save favorites to Firestore
        async function saveFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            try {
                await setDoc(userFavoritesRef, { channels: Array.from(favorites) }, { merge: true });
            } catch (error) {
                console.error("Error saving favorites:", error);
            }
        }
        
        // Render categories list and counts
        function renderCategories() {
            // Do not clear the list, just add to it.
            const existingCategories = Array.from(categoriesList.querySelectorAll('.dynamic-category-button'));
            existingCategories.forEach(btn => btn.remove());

            const categories = [...new Set(channelData.map(c => c.category))].sort();
            
            categories.forEach(cat => {
                const count = channelData.filter(c => c.category === cat).length;
                const button = document.createElement('button');
                button.className = `category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium dynamic-category-button ${currentCategory === cat ? 'active' : ''}`;
                button.textContent = cat;
                button.dataset.filter = cat;
                button.dataset.category = cat;
                
                const countSpan = document.createElement('span');
                countSpan.className = `px-2 py-1 text-xs rounded-full ${currentCategory === cat ? 'bg-white text-black' : 'bg-gray-600'}`;
                countSpan.textContent = count;
                
                button.appendChild(countSpan);
                categoriesList.appendChild(button);
                
                button.addEventListener('click', () => {
                    currentCategory = cat;
                    document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    filterChannels();
                });
            });

            // Update active states for All and Favorites
            document.getElementById('all-count').parentElement.classList.toggle('active', currentCategory === 'All');
            document.getElementById('favorites-count').parentElement.classList.toggle('active', currentCategory === 'Favorites');
        }

        // Lazy loading observer
        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target.querySelector('img');
                    img.src = img.dataset.src;
                    img.onerror = () => {
                        img.src = "https://placehold.co/120x80/000000/FFFFFF?text=No+Image";
                    };
                    observer.unobserve(entry.target);
                }
            });
        });

        // Renders the list of channels based on the current filter
        function renderChannels(channelsToRender) {
            channelsList.innerHTML = '';
            
            mainTitle.textContent = currentCategory === 'Favorites' ? 'My Favorites' : `${currentCategory === 'All' ? 'All' : currentCategory} Channels`;
            channelCountSpan.textContent = `(${channelsToRender.length})`;
            
            if (channelsToRender.length === 0) {
                 channelsList.innerHTML = `<p class="text-gray-400 text-center col-span-full mt-10">No channels found for this selection.</p>`;
                 return;
            }

            channelsToRender.forEach(channel => {
                const card = createChannelCard(channel);
                channelsList.appendChild(card);
                observer.observe(card); // Start observing for lazy loading
            });

            // Set initial focus for keyboard navigation
            currentFocusedIndex = channelsToRender.length > 0 ? 0 : -1;
            focusedSection = 'categories';
            updateFocus(currentFocusedIndex);
        }
        
        // Creates a single channel card element
        function createChannelCard(channel) {
            const isFavorite = favorites.has(channel.id);
            const card = document.createElement('div');
            card.className = "channel-card channel-card-container bg-[var(--bg-medium)] p-4 sm:p-6 rounded-lg shadow-lg transition-all duration-300 transform hover:scale-105 hover:shadow-2xl cursor-pointer flex flex-col items-center justify-center space-y-2 relative";
            card.dataset.stream = channel.stream;
            card.dataset.name = channel.name;
            card.dataset.id = channel.id;
            card.setAttribute('tabindex', '0');

            const logo = document.createElement('img');
            logo.dataset.src = channel.logo; // Use data-src for lazy loading
            logo.alt = `${channel.name} logo`;
            logo.className = "w-24 h-24 object-contain rounded-full border-2 border-gray-600 mb-2";

            const name = document.createElement('h3');
            name.textContent = channel.name;
            name.className = "text-center text-md font-semibold text-[var(--text-light)] truncate w-full";

            const category = document.createElement('p');
            category.textContent = channel.category;
            category.className = "text-center text-sm text-[var(--text-gray)]";
            
            // Favorite button
            const favButton = document.createElement('button');
            favButton.className = `absolute top-2 right-2 p-2 rounded-full transition-colors duration-200 text-xl ${isFavorite ? 'text-red-500 hover:text-red-400' : 'text-gray-400 hover:text-white'}`;
            favButton.innerHTML = `<i class="${isFavorite ? 'fas fa-heart' : 'far fa-heart'}"></i>`;
            favButton.onclick = (e) => {
                e.stopPropagation(); // Prevent card from being clicked
                toggleFavorite(channel.id);
            };

            card.appendChild(logo);
            card.appendChild(favButton);
            card.appendChild(name);
            card.appendChild(category);

            card.addEventListener('click', (e) => {
                if (e.target.closest('.channel-card')) {
                    // Save the ID of the channel that was just played
                    lastSelectedChannelId = channel.id;
                    playVideo(channel.stream);
                }
            });

            return card;
        }

        // Handles loading and playing a video stream using hls.js
        function playVideo(streamUrl) {
            videoModal.style.display = 'flex';
            loadingSpinner.classList.remove('hidden');
            videoContent.classList.add('hidden');
            videoPlayer.pause();
            
            // Check if HLS is supported by the browser
            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls();
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(videoPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play().catch(error => {
                        console.error('Autoplay prevented:', error);
                    });
                    loadingSpinner.classList.add('hidden');
                    videoContent.classList.remove('hidden');
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    console.error('HLS.js error:', data);
                    loadingSpinner.classList.add('hidden');
                    videoContent.classList.remove('hidden');
                    const message = `Error playing video: ${data.details}. The stream might be offline or an unsupported format.`;
                    showCustomMessage(message);
                    videoPlayer.pause();
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                // Fallback for native HLS support (Safari)
                videoPlayer.src = streamUrl;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    videoPlayer.play().catch(error => {
                        console.error('Autoplay prevented:', error);
                    });
                    loadingSpinner.classList.add('hidden');
                    videoContent.classList.remove('hidden');
                });
            } else {
                loadingSpinner.classList.add('hidden');
                showCustomMessage('HLS is not supported by your browser.');
            }
        }
        
        // Stops the video and hides the player modal
        function exitVideoPlayer() {
            videoPlayer.pause();
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            videoModal.style.display = 'none';
            
            // Find the last selected channel card and highlight it
            const cardToHighlight = document.querySelector(`.channel-card[data-id="${lastSelectedChannelId}"]`);
            if (cardToHighlight) {
                const allCards = Array.from(channelsList.querySelectorAll('.channel-card'));
                const lastFocusedIndex = allCards.indexOf(cardToHighlight);
                currentFocusedIndex = lastFocusedIndex;
                updateFocus(lastFocusedIndex);
                cardToHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                cardToHighlight.focus();
            }
        }

        // Toggles a channel's favorite status
        function toggleFavorite(channelId) {
            if (favorites.has(channelId)) {
                favorites.delete(channelId);
            } else {
                favorites.add(channelId);
            }
            saveFavorites();
        }

        // Handles keyboard navigation (D-pad/remote control)
        function handleKeyNavigation(e) {
            const isVideoModalVisible = videoModal.style.display === 'flex';
            if (isVideoModalVisible) {
                // In video player mode, only handle Exit
                if (e.key === 'Backspace' || e.key === 'Escape') {
                    exitVideoPlayer();
                }
                return;
            }

            const activeElement = document.activeElement;
            const cards = Array.from(channelsList.querySelectorAll('.channel-card'));
            const categoryButtons = Array.from(categoriesList.querySelectorAll('.category-button'));

            // Check if search input has focus and a keyboard is active (or presumed active)
            if (activeElement.id === 'search-input' && isSearchKeyboardVisible) {
                // When a virtual keyboard is visible, we need to handle navigation differently
                if (e.key === 'ArrowDown') {
                    // This is the keypress that will take the user out of the search bar
                    e.preventDefault();
                    isSearchKeyboardVisible = false; // "Hide" the virtual keyboard
                    searchInput.blur(); // Remove focus from search bar
                    focusedSection = 'categories';
                    currentFocusedIndex = 0;
                    if (categoryButtons[currentFocusedIndex]) {
                        updateFocus(-1); // Clear search bar focus
                        updateFocus(currentFocusedIndex);
                        categoryButtons[currentFocusedIndex].focus();
                    }
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    isSearchKeyboardVisible = false;
                    searchInput.blur();
                    focusedSection = 'channels';
                    currentFocusedIndex = 0;
                    if (cards[currentFocusedIndex]) {
                        updateFocus(-1);
                        updateFocus(currentFocusedIndex);
                        cards[currentFocusedIndex].focus();
                    }
                }
                return;
            }
            
            // Normal navigation based on the current section
            let newIndex = currentFocusedIndex;
            
            // Handle switching sections with left/right arrows
            if (focusedSection === 'channels' && e.key === 'ArrowLeft') {
                e.preventDefault();
                focusedSection = 'categories';
                updateFocus(-1); // Clear channel focus
                currentFocusedIndex = 0; // Set to the first category
                updateFocus(currentFocusedIndex);
                categoryButtons[currentFocusedIndex].focus();
                return;
            } else if (focusedSection === 'categories' && e.key === 'ArrowRight') {
                e.preventDefault();
                focusedSection = 'channels';
                updateFocus(-1); // Clear category focus
                currentFocusedIndex = 0;
                updateFocus(currentFocusedIndex);
                if (cards[currentFocusedIndex]) {
                    cards[currentFocusedIndex].focus();
                }
                return;
            }
            
            // Handle navigation within the current section
            if (focusedSection === 'categories') {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    newIndex = Math.max(0, currentFocusedIndex - 1);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    newIndex = Math.min(categoryButtons.length - 1, currentFocusedIndex + 1);
                }
                if (newIndex !== currentFocusedIndex) {
                    currentFocusedIndex = newIndex;
                    updateFocus(newIndex);
                    categoryButtons[newIndex].focus();
                }
            } else if (focusedSection === 'channels') {
                const numCols = window.innerWidth >= 1280 ? 5 : window.innerWidth >= 1024 ? 4 : window.innerWidth >= 768 ? 3 : window.innerWidth >= 640 ? 3 : 2;
                
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    newIndex = Math.max(0, currentFocusedIndex - numCols);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    newIndex = Math.min(cards.length - 1, currentFocusedIndex + numCols);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    newIndex = Math.max(0, currentFocusedIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    newIndex = Math.min(cards.length - 1, currentFocusedIndex + 1);
                }
                
                if (newIndex !== currentFocusedIndex) {
                    currentFocusedIndex = newIndex;
                    updateFocus(newIndex);
                    cards[newIndex].focus();
                }
            }
            
            // Handle Enter/OK button press
            if (e.key === 'Enter') {
                if (focusedSection === 'categories') {
                    const focusedButton = categoryButtons[currentFocusedIndex];
                    if (focusedButton) {
                         focusedButton.click();
                    }
                } else if (focusedSection === 'channels') {
                    const focusedCard = cards[currentFocusedIndex];
                    if (focusedCard) {
                        focusedCard.click();
                    }
                }
            } else if (e.key === 'Backspace' || e.key === 'Escape') {
                e.preventDefault();
                exitModal.style.display = 'flex';
            }
        }

        // Updates the visual focus highlight for a given index
        function updateFocus(index) {
            const elements = focusedSection === 'categories' ?
                document.querySelectorAll('.category-button') :
                document.querySelectorAll('.channel-card');
            
            elements.forEach((el, i) => {
                el.classList.remove('selected-card');
            });

            if (index >= 0 && index < elements.length) {
                 elements[index].classList.add('selected-card');
            }
        }

        // Function to show a custom message modal instead of alert()
        function showCustomMessage(message) {
            const modalHtml = `
                <div id="custom-message-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[1002]">
                    <div class="bg-[var(--bg-medium)] p-8 rounded-xl shadow-2xl text-center flex flex-col items-center space-y-6 max-w-sm w-full">
                        <h3 class="text-xl font-bold text-[var(--accent-blue)]">Message</h3>
                        <p class="text-[var(--text-gray)]">${message}</p>
                        <button id="close-message-btn" class="bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:bg-gray-700">
                            Close
                        </button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            document.getElementById('close-message-btn').addEventListener('click', () => {
                const modal = document.getElementById('custom-message-modal');
                modal.remove();
            });
        }

        // Start the application when the window loads
        window.onload = () => {
            initApp();
        };

    </script>
</body>
</html>
