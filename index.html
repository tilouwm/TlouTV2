<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TlouTV — Live Haitian TV</title>
<meta name="theme-color" content="#0ea5e9" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --header-h: 72px;
    --bg:#0a0f1f; --text:#e9eef7; --muted:#9fb2c7;
    /* stronger separation of menu and content on phones */
    --menu-bg: linear-gradient(180deg, rgba(15,33,71,.92), rgba(10,23,50,.88));
    --content-bg: linear-gradient(180deg, rgba(5,10,22,.6), rgba(4,9,20,.5));
    --ring: 0 0 0 4px rgba(79,140,255,.33);
    --tile-bg-top:#153066; --tile-bg-bot:#0e224a;
    --tile-border:#1b3a7c; --tile-border-strong:#5ba0ff;
    --tile-focus-bg:#153a73; --logo-canvas:#0b1634;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 5% -10%, rgba(124,58,237,.18), transparent 42%),
      radial-gradient(900px 600px at 110% 0%, rgba(34,211,238,.10), transparent 45%),
      var(--bg);
    overscroll-behavior: contain;
    -webkit-tap-highlight-color: transparent;
    padding-top: calc(var(--header-h) + env(safe-area-inset-top));
  }

  header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding:12px 18px;
    backdrop-filter: blur(6px);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:42px; height:42px; border-radius:12px; background:#0000002a; display:grid; place-items:center; }
  .brand .title{ font:800 19px/1 Outfit,Inter,sans-serif; letter-spacing:.3px }
  .brand .sub{ font-size:10px; letter-spacing:2px; color:#a9f0ff; text-transform:uppercase }

  .app{
    display:grid; grid-template-columns: 260px 1fr;
    height: calc(100vh - var(--header-h) - env(safe-area-inset-top));
    background: var(--content-bg);
  }

  /* -------- Left menu -------- */
  .menu{
    border-right:1px solid rgba(255,255,255,.14);
    background: var(--menu-bg);
    padding:14px 10px 24px; overflow:auto;
    box-shadow: inset -1px 0 0 rgba(0,0,0,.25);
  }
  .menu h3{ margin:6px 10px 10px; font:700 12px/1 Outfit,Inter; letter-spacing:1px; color:var(--muted); text-transform:uppercase }
  .mitem{
    display:flex; align-items:center; gap:12px; width:100%;
    border:1px solid rgba(255,255,255,.15);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
    color:var(--text); padding:14px; margin:10px 6px; border-radius:14px;
    text-align:left; cursor:pointer; outline:none; touch-action:manipulation;
    transition: box-shadow .12s ease, background .12s ease, border-color .12s ease, transform .08s ease;
  }
  .mitem .dot{ width:8px; height:8px; border-radius:50%; background:#22d3ee; opacity:.85 }

  /* NEW: selected/active menu looks like focused card */
  .mitem.active,
  .mitem.focused-menu{
    border-color: var(--tile-border-strong);
    box-shadow: 0 0 0 4px var(--tile-border-strong);
    background: linear-gradient(180deg, var(--tile-focus-bg), rgba(21,58,115,.55));
    font-weight:800;
    transform: translateZ(0); /* crisp edge on TV */
  }

  /* -------- Content & grid -------- */
  .content{ overflow:auto; padding:16px 18px 28px; scroll-behavior:auto }
  .search-row{ display:flex; gap:10px; align-items:center; margin:6px 0 16px }
  .search{ flex:1; padding:13px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color:var(--text); font-size:17px; }

  .grid{ display:grid; gap:16px; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media(min-width:600px){ .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media(min-width:960px){ .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media(min-width:1280px){ .grid{ grid-template-columns: repeat(5, minmax(0,1fr)); } }
  @media(min-width:1600px){ .grid{ grid-template-columns: repeat(6, minmax(0,1fr)); } }

  /* NEW: roomier TV layout */
  body.tv .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); gap:26px; }
  body.tv .card{ min-height: 300px; padding:20px 18px; }
  body.tv .logo img{ width:96%; height:96%; }
  body.tv .title{ font-size:18px; }
  body.tv .meta{ font-size:14px; opacity:.95; }

  .card{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    gap:12px; padding:16px 14px; border-radius:16px;
    background: linear-gradient(180deg, var(--tile-bg-top), var(--tile-bg-bot));
    color:#f1f5ff; border:2px solid var(--tile-border);
    outline:none; cursor:pointer; touch-action:manipulation; min-height: 220px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.18);
    transition: box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  .logo{ width:100%; aspect-ratio: 1/1; border-radius:12px; background:var(--logo-canvas); display:grid; place-items:center; overflow:hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .logo img{ width:92%; height:92%; object-fit:contain }
  .title{ text-align:center; font-weight:800; font-size:15px; line-height:1.1; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta{ font-size:12.5px; color:#c4d7ff; text-align:center; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .focused-card{
    border-color: var(--tile-border-strong);
    box-shadow: 0 0 0 4px var(--tile-border-strong);
    background: linear-gradient(180deg, var(--tile-focus-bg), var(--tile-bg-bot));
  }
  .card:focus-visible{ outline:none }

  /* -------- Player overlay -------- */
  .overlay{ position:fixed; inset:0; z-index:50; display:none; }
  .overlay.show{ display:block }
  .overlay.controls-hidden .close-btn,
  .overlay.controls-hidden .error-tray{ display:none !important; }
  .shade{ position:absolute; inset:0; background:rgba(0,0,0,.9) }
  .player-wrap{ position:absolute; inset:0; display:grid; place-items:center; }
  video{ width:100vw; height:100vh; background:#000; outline:none; }

  .close-btn{
    position:absolute; top:16px; right:16px; z-index:60;
    padding:12px 16px; border-radius:14px;
    border:1px solid rgba(255,255,255,.28);
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
    color:#fff; font-weight:800; cursor:pointer; outline:none; touch-action:manipulation;
  }
  .close-btn:focus-visible, .close-btn.focused{ outline:4px solid #22d3ee; box-shadow:0 0 0 6px rgba(34,211,238,.35); }

  .error-tray{
    position:absolute; left:16px; bottom:16px; z-index:60; display:flex; gap:10px; align-items:center;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:10px 12px;
  }
  .e-btn{ border-radius:10px; border:1px solid rgba(255,255,255,.25); padding:9px 12px; background:rgba(255,255,255,.1); color:#fff; cursor:pointer; touch-action:manipulation; }
  .e-btn:focus-visible, .e-btn.focus{ outline:4px solid rgba(91,160,255,.6) }

  .back-toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:70; padding:10px 14px; border-radius:12px; background:rgba(0,0,0,.7); border:1px solid rgba(255,255,255,.18); color:#fff; font-weight:700; font-size:13px; opacity:0; pointer-events:none; transition:opacity .15s linear; }
  .back-toast.show{ opacity:1; }

  .modal{ position:fixed; inset:0; z-index:80; display:none; }
  .modal.show{ display:grid; place-items:center; }
  .modal .shade{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .dialog{
    position:relative; z-index:81; width:min(92vw, 440px);
    background: linear-gradient(180deg, #153468, #0f2147);
    border:2px solid #2a58b8; border-radius:16px; padding:18px; color:#eef6ff;
  }
  .dialog h4{ margin:0 0 6px; font:800 19px/1.2 Outfit,Inter }
  .dialog p{ margin:0 0 14px; color:#cfe2ff; font-size:14px }
  .actions{ display:flex; gap:10px; justify-content:flex-end }
  .btn{ border-radius:12px; padding:10px 14px; cursor:pointer; border:1px solid transparent; background:#1a2f5f; color:#e8f1ff; font-weight:700; }
  .btn:focus-visible{ outline:var(--ring) }
  .btn.primary{ background:#5ba0ff; color:#041225; border-color:#9fc2ff; }
  .btn.ghost{ background:#0f2045; border:1px solid #294a9d; color:#eaf1ff; }
</style>
</head>
<body>

<header id="topHeader">
  <div class="brand">
    <div class="brand-badge">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 4l13 8-13 8z" fill="#22d3ee"/></svg>
    </div>
    <div>
      <div class="title">TlouTV</div>
      <div class="sub">Live Haitian TV</div>
    </div>
  </div>
</header>

<div class="app">
  <aside class="menu" id="leftMenu">
    <h3>Browse</h3>
    <button class="mitem focused-menu" data-menu data-cat="all" id="mi-all"><span class="dot"></span><span>All Channels</span></button>
    <button class="mitem" data-menu data-cat="news" id="mi-news"><span class="dot"></span><span>News</span></button>
    <button class="mitem" data-menu data-cat="general" id="mi-general"><span class="dot"></span><span>General</span></button>
    <button class="mitem" data-menu data-cat="music" id="mi-music"><span class="dot"></span><span>Music</span></button>
    <button class="mitem" data-menu data-cat="religious" id="mi-religious"><span class="dot"></span><span>Religious</span></button>
    <button class="mitem" data-menu data-cat="sports" id="mi-sports"><span class="dot"></span><span>Sports</span></button>
    <h3>Sections</h3>
    <button class="mitem" data-menu data-cat="usa" id="mi-usa"><span class="dot"></span><span>USA</span></button>
    <button class="mitem" data-menu data-cat="france" id="mi-fr"><span class="dot"></span><span>France</span></button>
    <h3>My</h3>
    <button class="mitem" data-menu data-cat="favorites" id="mi-fav"><span class="dot"></span><span>Favorites</span></button>
  </aside>

  <section class="content" id="content">
    <div class="search-row">
      <input id="q" class="search" placeholder="Search channels…" />
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- Player Overlay -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="shade"></div>
  <div class="player-wrap">
    <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
  </div>
  <button class="close-btn" id="closeBtn" title="Close (Back ×2 to exit)">✕ Close</button>
  <div class="error-tray" id="errorTray" style="display:none">
    <span id="errMsg" style="opacity:.92">Playback error.</span>
    <button class="e-btn" id="btnRetry" tabindex="0">Retry</button>
    <button class="e-btn" id="btnVLC" tabindex="0">Open in VLC</button>
    <button class="e-btn" id="btnNative" tabindex="0">Open natively</button>
  </div>
</div>

<!-- Favorites Modal -->
<div class="modal" id="favModal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="shade"></div>
  <div class="dialog">
    <h4 id="favTitle">Add to Favorites?</h4>
    <p id="favDesc"></p>
    <div class="actions">
      <button class="btn ghost" id="favCancel">Cancel</button>
      <button class="btn primary" id="favConfirm">Add</button>
    </div>
  </div>
</div>

<!-- Exit App Modal -->
<div class="modal" id="exitModal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="shade"></div>
  <div class="dialog">
    <h4>Exit TlouTV?</h4>
    <p>Do you want to close the app?</p>
    <div class="actions">
      <button class="btn ghost" id="exitCancel">No</button>
      <button class="btn primary" id="exitConfirm">Yes, Exit</button>
    </div>
  </div>
</div>

<div class="back-toast" id="backToast">Press Back again to exit</div>

/* ---------- State & elements ---------- */
const NS='tloutv:stable';
let CURRENT_CAT='all', lastFocus=null;

const gridEl = document.getElementById('grid');
const qEl = document.getElementById('q');
const overlay = document.getElementById('overlay');
let   player = document.getElementById('player');
const closeBtn = document.getElementById('closeBtn');
const errorTray = document.getElementById('errorTray');
const errMsg = document.getElementById('errMsg');
const btnRetry = document.getElementById('btnRetry');
const btnVLC = document.getElementById('btnVLC');
const btnNative = document.getElementById('btnNative');
const backToast = document.getElementById('backToast');

/* ---------- Favorites helpers ---------- */
function favorites(){ try{return JSON.parse(localStorage.getItem(NS+':fav')||'[]')}catch{return[]} }
function setFavorites(x){ localStorage.setItem(NS+':fav', JSON.stringify([...new Set(x)]) ) }

/* ---------- Render ---------- */
function filterChannels(){
  const q=(qEl.value||'').toLowerCase();
  return CHANNELS.filter(c=>{
    const matchQ=!q || c.name.toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q);
    const matchCat = CURRENT_CAT==='all'
      ? true
      : (CURRENT_CAT==='favorites'
         ? favorites().includes(c.id)
         : c.genre===CURRENT_CAT);
    return matchQ && matchCat;
  });
}
function card(c,i){
  return `
    <div class="card" data-card data-idx="${i}" tabindex="0" role="button" aria-label="${c.name}">
      <div class="logo">${c.logo?`<img src="${c.logo}" alt="${c.name}" loading="lazy" decoding="async">`:'📺'}</div>
      <div class="title">${c.name}</div>
      <div class="meta">${c.genre||''}</div>
    </div>
  `;
}
let rendered=[];
function render(){
  const list = filterChannels();
  rendered = list;
  gridEl.innerHTML = list.map((c,i)=>card(c,i)).join('') || `<div style="opacity:.7">No results</div>`;
  const first = gridEl.querySelector('[data-card]');
  if(first && !document.querySelector('.focused-card') && document.activeElement.tagName!=='INPUT'){ focusCard(0,true); }
}

/* ---------- Menu ---------- */
const menuItems = Array.from(document.querySelectorAll('[data-menu]'));
function selectMenu(cat){ CURRENT_CAT = cat; menuItems.forEach(b=>b.classList.toggle('active', b.dataset.cat===cat)); render(); }
menuItems.forEach(btn=>{ btn.addEventListener('click',()=>{ selectMenu(btn.dataset.cat); focusMenu(btn); }); });
function focusMenu(el){ menuItems.forEach(b=>b.classList.remove('focused-menu')); el.classList.add('focused-menu'); el.focus(); }

/* ---------- D-Pad ---------- */
let focusedIndex=0, lastNavTs=0; const NAV_GAP=45; let navRAF=null;
function gridCols(){ if(document.body.classList.contains('tv')) return 4; const w=innerWidth; return w>=1600?6:(w>=1280?5:(w>=960?4:(w>=600?3:2))); }
function schedule(fn){ if(navRAF) cancelAnimationFrame(navRAF); navRAF=requestAnimationFrame(()=>{ fn(); navRAF=null; }); }
function focusCard(idx, forceTop=false){
  const prev=document.querySelector('.focused-card'); if(prev) prev.classList.remove('focused-card');
  const el = gridEl.querySelector(`[data-card][data-idx="${idx}"]`);
  if(el){ el.classList.add('focused-card'); el.focus({preventScroll:false}); el.scrollIntoView({block: forceTop?'start':'nearest', inline:'nearest'}); focusedIndex=idx; }
}
function moveFocus(delta){ const now=Date.now(); if(now-lastNavTs<NAV_GAP) return; lastNavTs=now; const total=rendered.length; const next=Math.max(0,Math.min(total-1,focusedIndex+delta)); schedule(()=>focusCard(next)); }
function moveRow(deltaRows){ moveFocus(deltaRows * gridCols()); }

/* ---------- Long-press to Favorite ---------- */
let enterHoldTimer=null, enterHeld=false, pointerTimer=null, pointerHeld=false, pointerIdx=null;
const HOLD_MS = isFireTV ? 520 : (isTouch ? 580 : 500);

const favModal  = document.getElementById('favModal');
const favTitle  = document.getElementById('favTitle');
const favDesc   = document.getElementById('favDesc');
const favConfirm= document.getElementById('favConfirm');
const favCancel = document.getElementById('favCancel');
let favTarget   = null;

function openFavModal(ch){
  favTarget = ch;
  const s=new Set(favorites());
  const isFav = s.has(ch.id);
  favTitle.textContent = isFav ? 'Remove from Favorites?' : 'Add to Favorites?';
  favDesc.textContent  = ch.name;
  favConfirm.textContent = isFav ? 'Remove' : 'Add';
  favModal.classList.add('show'); favModal.setAttribute('aria-hidden','false'); favConfirm.focus();
}
function closeFavModal(){ favModal.classList.remove('show'); favModal.setAttribute('aria-hidden','true'); favTarget=null; gridEl.querySelector(`[data-card][data-idx="${focusedIndex}"]`)?.focus(); }
function toggleFavorite(id){ const s=new Set(favorites()); s.has(id)?s.delete(id):s.add(id); setFavorites([...s]); if(CURRENT_CAT==='favorites') render(); }

document.addEventListener('keydown',(e)=>{
  if(overlay.classList.contains('show') || exitModal.classList.contains('show')) return;
  if(favModal.classList.contains('show')){
    const k=e.key;
    if(k==='Backspace'||k==='Escape'||k==='BrowserBack'){ e.preventDefault(); closeFavModal(); return; }
    if(k==='ArrowLeft'||k==='Left'){ e.preventDefault(); favCancel.focus(); return;}
    if(k==='ArrowRight'||k==='Right'){ e.preventDefault(); favConfirm.focus(); return;}
    if(k==='Enter'){ e.preventDefault(); (document.activeElement===favCancel?favCancel:favConfirm).click(); return; }
    return;
  }
  const ae=document.activeElement;
  const onMenu = ae && ae.hasAttribute('data-menu');
  const onGrid = ae && ae.hasAttribute('data-card');
  const onInput = ae && ae.tagName==='INPUT';
  const k=e.key;
  const dpad=['ArrowRight','Right','ArrowLeft','Left','ArrowUp','Up','ArrowDown','Down','PageDown','PageUp','Home','End'];
  if(dpad.includes(k)) e.preventDefault();

  if(onGrid){
    if(k==='ArrowRight'||k==='Right'){ moveFocus(1); return; }
    if(k==='ArrowLeft'||k==='Left'){ const cols=gridCols(); if(focusedIndex%cols===0){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); return; } moveFocus(-1); return; }
    if(k==='ArrowDown'||k==='Down'){ moveRow(1); return; }
    if(k==='ArrowUp'||k==='Up'){ moveRow(-1); return; }
    if(k==='PageDown'){ moveRow(3); return; }
    if(k==='PageUp'){ moveRow(-3); return; }
    if(k==='Home'){ schedule(()=>focusCard(0,true)); return; }
    if(k==='End'){ schedule(()=>focusCard(rendered.length-1,true)); return; }
    if(k==='Enter'&&!enterHoldTimer){ e.preventDefault(); enterHeld=false; enterHoldTimer=setTimeout(()=>{ enterHeld=true; openFavModal(rendered[focusedIndex]); }, HOLD_MS); return; }
  }

  if(onMenu){
    const i=menuItems.indexOf(ae);
    if(k==='ArrowDown'||k==='Down'){ focusMenu(menuItems[Math.min(menuItems.length-1,i+1)]); return; }
    if(k==='ArrowUp'||k==='Up'){ focusMenu(menuItems[Math.max(0,i-1)]); return; }
    if(k==='ArrowRight'||k==='Right'){ focusCard(0,true); return; }
    if(k==='Enter'){ ae.click(); return; }
  }

  if(onInput){ if(k==='Escape'){ gridEl.querySelector('[data-card]')?.focus(); } return; }
  if(['ArrowLeft','Left','ArrowUp','Up','ArrowDown','Down','ArrowRight','Right'].includes(k)){ if(!onMenu && !onGrid && !onInput){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); } }
});
document.addEventListener('keyup',(e)=>{
  if(overlay.classList.contains('show') || favModal.classList.contains('show') || exitModal.classList.contains('show')) return;
  if(e.key==='Enter' && enterHoldTimer){ clearTimeout(enterHoldTimer); enterHoldTimer=null; if(!enterHeld){ openPlayer(rendered[focusedIndex]); } enterHeld=false; }
});
gridEl.addEventListener('pointerdown',(e)=>{
  const card=e.target.closest('[data-card]'); if(!card) return;
  pointerIdx=Number(card.dataset.idx); pointerHeld=false; clearTimeout(pointerTimer);
  pointerTimer=setTimeout(()=>{ pointerHeld=true; openFavModal(rendered[pointerIdx]); }, HOLD_MS);
});
['pointerup','pointerleave','pointercancel'].forEach(evt=>{ gridEl.addEventListener(evt, ()=>{ clearTimeout(pointerTimer); }); });
gridEl.addEventListener('click',(e)=>{ const card=e.target.closest('[data-card]'); if(!card) return; if(pointerHeld){ pointerHeld=false; return; } const idx=Number(card.dataset.idx); openPlayer(rendered[idx]); });

/* ---------- Player / External launcher ---------- */
let hls=null, tsPlayer=null, dashPlayer=null, currentURL=null, currentChannel=null;
let overlayUIVisible=false, lastBackTs=0; const BACK_DOUBLE_MS=1200;
let toastT=null;

/* NEW: auto-hide UI until remote interaction */
let overlayHideTimer=null;
function scheduleHideUI(ms=2600){
  clearTimeout(overlayHideTimer);
  overlayHideTimer=setTimeout(()=>{ hideControls(); }, ms);
}
function revealUI(){
  showControls();
  scheduleHideUI();
}

/* Startup watchdog */
let startTimer=null;
function startupWatchStart(){
  clearTimeout(startTimer);
  startTimer = setTimeout(()=>{
    try{
      if(player.readyState < 2 || player.paused){
        onFatal('Stream didn’t start. Choose Retry or open externally.');
      }
    }catch(e){ onFatal('Playback did not start.'); }
  }, 6000);
}
function startupWatchStop(){ clearTimeout(startTimer); startTimer=null; }

function showControls(){ overlay.classList.remove('controls-hidden'); overlayUIVisible=true; }
function hideControls(){ overlay.classList.add('controls-hidden'); overlayUIVisible=false; closeBtn.classList.remove('focused'); }
function showBackToast(){ backToast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=> backToast.classList.remove('show'), 1100); }

function showOverlay(){
  overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
  lastFocus=document.querySelector('.focused-card')||document.activeElement;
  player.focus();
  hideControls();                 // start hidden
  scheduleHideUI(1200);           // ensure hidden soon after open
}
function swapVideoElement(){
  const wrap=document.querySelector('.player-wrap'); const old=player;
  const v=document.createElement('video');
  v.id='player'; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline',''); v.playsInline=true;
  v.controls=true; v.preload='metadata'; v.style.background='#000';
  wrap.replaceChild(v, old);
  player=v;
}
function destroyPlayers(){
  try{ if(hls){ try{ hls.stopLoad(); hls.detachMedia(); }catch(e){} try{ hls.destroy(); }catch(e){} hls=null; } }catch(e){}
  try{ if(tsPlayer){ tsPlayer.unload(); tsPlayer.detachMediaElement(); tsPlayer.destroy(); tsPlayer=null; } }catch(e){}
  try{ if(dashPlayer){ dashPlayer.reset && dashPlayer.reset(); dashPlayer=null; } }catch(e){}
  try{ player.pause(); player.removeAttribute('src'); player.src=''; player.load(); }catch(e){}
  startupWatchStop();
}
function fullyResetPlayer(){
  destroyPlayers();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  swapVideoElement();
}
function hideOverlay(){
  overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true');
  fullyResetPlayer();
  backToast.classList.remove('show'); errorTray.style.display='none';
  setTimeout(()=>{ lastFocus?.focus(); }, 0);
  clearTimeout(enterHoldTimer); enterHoldTimer=null; enterHeld=false;
  clearTimeout(pointerTimer); pointerTimer=null; pointerHeld=false;
  clearTimeout(overlayHideTimer); overlayHideTimer=null;
}

/* Errors */
function onFatal(msg){
  showControls(); // show tray and keep it visible for action
  errorTray.style.display='flex';
  errMsg.textContent = msg || 'Playback error';
  btnRetry.classList.add('focus'); btnRetry.focus();
}
function resetErrors(){
  errorTray.style.display='none';
  btnRetry.classList.remove('focus'); btnVLC.classList.remove('focus'); btnNative.classList.remove('focus');
}

function isHttpBlocked(u){ return location.protocol==='https:' && isHttp(u); }

function playHls(url){
  hls = new Hls({
    lowLatencyMode:true, enableWorker:true,
    liveSyncDurationCount:3, liveMaxLatencyDurationCount:10,
    backBufferLength:60, progressive:true
  });
  hls.attachMedia(player);
  hls.on(Hls.Events.MEDIA_ATTACHED, ()=> hls.loadSource(url));
  hls.on(Hls.Events.MANIFEST_PARSED, async ()=>{
    try{ await player.play(); }catch(e){}
    requestFS(player);
    scheduleHideUI(1500); // hide UI after kickoff
  });
  hls.on(Hls.Events.ERROR, (_evt,data)=>{ if(data?.fatal){ onFatal('Playback error: ' + (data?.details || data?.type || 'HLS')); }});
}
function playTs(url){
  if (!window.mpegts || !mpegts.isSupported()){
    onFatal('Your device/browser cannot play MPEG-TS directly.');
    return;
  }
  tsPlayer = mpegts.createPlayer(
    { type:'mpegts', isLive:true, url },
    { enableWorker:true, liveBufferLatencyChasing:true }
  );
  tsPlayer.attachMediaElement(player);
  tsPlayer.load();
  tsPlayer.play().then(()=>{ requestFS(player); scheduleHideUI(1500); }).catch(()=>requestFS(player));
}
function playDash(url){
  if (!window.dashjs){ onFatal('DASH player missing.'); return; }
  dashPlayer = dashjs.MediaPlayer().create();
  dashPlayer.initialize(player, url, true);
  requestFS(player);
  scheduleHideUI(1500);
}
function playURL(url){
  resetErrors(); currentURL=url; destroyPlayers();
  ['playing'].forEach(ev=>player.addEventListener(ev, startupWatchStop, {once:true}));
  if (isHttpBlocked(url)){ onFatal('HTTP stream blocked on HTTPS page. Use “Open in VLC / Open natively”.'); return; }
  ['error','stalled','abort','emptied'].forEach(ev=>{
    player.addEventListener(ev, ()=>{ onFatal('Playback error ('+ev+')'); }, {once:true});
  });
  startupWatchStart();
  if (isDash(url)){ playDash(url); return; }
  if (isHls(url)){
    if (window.Hls && Hls.isSupported()) playHls(url);
    else if (player.canPlayType('application/vnd.apple.mpegurl')){
      player.src=url;
      player.addEventListener('loadedmetadata', async ()=>{ try{ await player.play(); }catch(e){} requestFS(player); scheduleHideUI(1500); }, {once:true});
    } else onFatal('HLS not supported on this device.');
    return;
  }
  if (isTs(url)){ playTs(url); return; }
  location.href=url;
}

/* Open externally (VLC or Native). Accepts optional urlArg. */
function launchExternal(which, urlArg){
  const url = urlArg || currentURL; if(!url) return;
  if(overlay.classList.contains('show')) hideOverlay(); // ensure clean state
  if(which==='native'){ location.href=url; return; }
  const isHttps=/^https:/i.test(url);
  const hostless=url.replace(/^https?:\/\//,'');
  const intent=`intent://${hostless}#Intent;package=org.videolan.vlc;scheme=${isHttps?'https':'http'};end`;
  const scheme='vlc://'+url;
  const start=Date.now();
  const t=setTimeout(()=>{ if(Date.now()-start<1200){ location.href=intent; }}, 600);
  location.href=scheme;
  const vis=()=>{ if(document.hidden) clearTimeout(t); document.removeEventListener('visibilitychange',vis); };
  document.addEventListener('visibilitychange',vis);
}

/* Request fullscreen:
   keep auto-FS on TV; skip on phones so the Close button is always tappable */
async function requestFS(el){
  if(isTouch) return;
  try{
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
    else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen) await el.msRequestFullscreen();
  }catch(e){}
}

/* Open player */
async function openPlayer(ch){
  currentChannel = ch;
  showOverlay();
  playURL(ch.url);
}

/* Overlay interactions: show UI only when you touch the remote/move pointer */
overlay.addEventListener('pointermove', revealUI);
overlay.addEventListener('mousemove', revealUI);

/* Overlay keys */
document.addEventListener('keydown',(e)=>{
  if(!overlay.classList.contains('show')) return;
  const k=e.key;

  // any key movement reveals controls (except when showing toast only)
  if(!['Backspace','Escape','BrowserBack'].includes(k)) revealUI();

  if(k==='Backspace' || k==='Escape' || k==='BrowserBack'){
    e.preventDefault();
    const now=Date.now();
    if(overlayUIVisible){ hideControls(); showBackToast(); lastBackTs=now; }
    else{ if(now-lastBackTs<=BACK_DOUBLE_MS){ hideOverlay(); } else { hideControls(); showBackToast(); lastBackTs=now; } }
    return;
  }

  const trayVisible = errorTray.style.display!=='none';
  const focusables = trayVisible ? [btnRetry, btnVLC, btnNative, closeBtn] : [closeBtn];
  const idx = focusables.indexOf(document.activeElement);

  if(['ArrowLeft','Left','ArrowRight','Right','ArrowUp','Up','ArrowDown','Down'].includes(k)){
    e.preventDefault(); showControls();
    if(trayVisible){
      if(k==='ArrowLeft'||k==='Left'){ const n=Math.max(0,idx-1); focusables[n].focus(); markTrayFocus(focusables[n]); }
      else if(k==='ArrowRight'||k==='Right'){ const n=Math.min(focusables.length-1,idx+1); focusables[n].focus(); markTrayFocus(focusables[n]); }
      else if(k==='ArrowUp'||k==='Up'){ closeBtn.focus(); }
      else if(k==='ArrowDown'||k==='Down'){ btnRetry.focus(); markTrayFocus(btnRetry); }
    }else{ closeBtn.focus(); }
    return;
  }

  if(k==='Enter'){
    const el=document.activeElement;
    if(el===closeBtn){ e.preventDefault(); hideOverlay(); return; }
    if(el===btnRetry){ e.preventDefault(); if(currentURL){ playURL(currentURL); } return; }
    if(el===btnVLC){ e.preventDefault(); launchExternal('vlc'); return; }
    if(el===btnNative){ e.preventDefault(); launchExternal('native'); return; }
  }
});
function markTrayFocus(el){ [btnRetry,btnVLC,btnNative].forEach(b=>b.classList.toggle('focus', b===el)); }

/* Error tray actions (mouse/touch) */
btnRetry.onclick = ()=>{ if(currentURL){ playURL(currentURL); } };
btnVLC.onclick   = ()=> launchExternal('vlc');
btnNative.onclick= ()=> launchExternal('native');

/* Visibility watchdog */
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && overlay.classList.contains('show')){
    const stalled = player.readyState < 2 || player.paused;
    if(stalled) hideOverlay();
  }
});

/* Global guards */
window.addEventListener('error', ()=>{ if(overlay.classList.contains('show')) hideOverlay(); }, {capture:true});
window.addEventListener('unhandledrejection', ()=>{ if(overlay.classList.contains('show')) hideOverlay(); });

/* ---------- Exit modal (main screen double back) ---------- */
const exitModal   = document.getElementById('exitModal');
const exitCancel  = document.getElementById('exitCancel');
const exitConfirm = document.getElementById('exitConfirm');
let mainBackTs = 0;

function showExitModal(){ exitModal.classList.add('show'); exitModal.setAttribute('aria-hidden','false'); exitConfirm.focus(); }
function hideExitModal(){ exitModal.classList.remove('show'); exitModal.setAttribute('aria-hidden','true'); document.querySelector('.focused-menu, [data-card].focused-card')?.focus(); }
function tryExitApp(){ try{ window.close(); }catch(e){} setTimeout(()=>{ location.href='about:blank'; }, 60); }
exitCancel.addEventListener('click', hideExitModal);
exitConfirm.addEventListener('click', tryExitApp);

document.addEventListener('keydown',(e)=>{
  if(overlay.classList.contains('show') || document.getElementById('favModal').classList.contains('show')) return;
  if(exitModal.classList.contains('show')){
    if(e.key==='Backspace'||e.key==='Escape'||e.key==='BrowserBack'){ e.preventDefault(); tryExitApp(); return; }
    if(e.key==='ArrowLeft'||e.key==='Left'){ e.preventDefault(); exitCancel.focus(); return; }
    if(e.key==='ArrowRight'||e.key==='Right'){ e.preventDefault(); exitConfirm.focus(); return; }
    if(e.key==='Enter'){ e.preventDefault(); (document.activeElement===exitCancel?exitCancel:exitConfirm).click(); return; }
    return;
  }
  if(e.key==='Backspace'||e.key==='Escape'||e.key==='BrowserBack'){
    e.preventDefault();
    const now=Date.now();
    if(now-mainBackTs<=1200){ showExitModal(); mainBackTs=0; }
    else { mainBackTs=now; showBackToast(); }
  }
});

/* ---------- Wire up ---------- */
qEl.addEventListener('input', render);
selectMenu('all');
render();
</script>
</body>
</html>
