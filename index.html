        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        setLogLevel('debug');
        
        // Expose global variables for use in the script
        window.initializeApp = initializeApp;
        window.getAuth = getAuth;
        window.signInAnonymously = signInAnonymously;
        window.signInWithCustomToken = signInWithCustomToken;
        window.onAuthStateChanged = onAuthStateChanged;
        window.getFirestore = getFirestore;
        window.doc = doc;
        window.onSnapshot = onSnapshot;
        window.setDoc = setDoc;
    </script>
    <style>
        :root {
            --bg-dark: #121e3d; /* Dark blue background */
            --bg-medium: #1c2849; /* Medium blue for containers */
            --text-light: #F0F0F0;
            --text-gray: #B0B0B0;
            --accent-blue: #4a90e2; /* Bright blue accent */
            --card-border: 2px solid #283e74; /* Darker blue border */
            --card-focus-border: 3px solid var(--accent-blue);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
        }
        
        .main-container {
            height: calc(100vh - 84px);
            overflow: hidden;
        }
        
        .channel-grid-container {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .channel-grid-container::-webkit-scrollbar {
            width: 8px;
            background-color: transparent;
        }
        
        .channel-grid-container::-webkit-scrollbar-thumb {
            background-color: var(--accent-blue);
            border-radius: 4px;
        }

        .video-player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .video-player-content {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
        }

        .video-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        .channel-card-container {
            position: relative;
        }

        .channel-card {
            min-height: 200px;
            animation: fadeIn 0.5s ease-out forwards;
            border: var(--card-border);
            transition: all 0.3s ease;
            outline: none;
        }

        /* Enhanced focus styles for TV remotes */
        .channel-card:focus,
        .selected-card {
            border: var(--card-focus-border);
            box-shadow: 0 0 25px rgba(74, 144, 226, 0.7);
            transform: scale(1.05);
            outline: none;
        }

        .category-button:focus,
        .category-button.tv-focused {
            background-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.5);
            transform: scale(1.02);
        }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-button {
            transition: all 0.2s;
            border: 2px solid transparent;
            outline: none;
        }
        
        .category-button:hover {
            background-color: #2b3b64;
        }

        .category-button.active {
            background-color: var(--accent-blue);
            font-weight: 600;
            border-color: transparent;
        }

        /* TV-specific focus management */
        .tv-focused {
            outline: 3px solid var(--accent-blue);
            outline-offset: 2px;
        }

        /* Hide default focus outline on buttons for TV */
        button:focus {
            outline: none;
        }

        /* Enhanced button focus for TV - Auto-hide close button */
        .video-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1001;
        }

        .video-controls.show {
            opacity: 1;
        }

        #exit-btn {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid transparent;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #exit-btn:focus,
        #exit-btn.tv-focused {
            background-color: var(--accent-blue);
            transform: scale(1.1);
            outline: none;
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.8);
            border-color: white;
        }

        #confirm-exit-btn:focus,
        #cancel-exit-btn:focus {
            background-color: var(--accent-blue);
            transform: scale(1.1);
            outline: none;
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.7);
        }

        /* Improve video player positioning */
        .video-player-container.active {
            display: flex;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="bg-black p-4 md:p-6 flex flex-col md:flex-row items-center justify-between shadow-xl space-y-4 md:space-y-0">
        <h1 class="text-3xl font-bold tracking-wide text-[var(--accent-blue)]">TlouTV</h1>
    </header>

    <!-- Main Content Area with two columns -->
    <main class="main-container flex-grow p-4 md:p-6 flex flex-col md:flex-row space-y-6 md:space-y-0 md:space-x-6">
        
        <!-- Left Sidebar - Categories -->
        <aside class="w-full md:w-1/4 bg-[var(--bg-medium)] rounded-lg p-6 shadow-xl flex-shrink-0 md:h-full">
            <h2 class="text-2xl font-bold mb-6 text-[var(--text-light)]">Categories</h2>
            
            <!-- Category buttons -->
            <div id="categories-list" class="space-y-2">
                <button class="category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium active" data-filter="All" data-index="0" tabindex="0">
                    <span>All Channels</span>
                    <span id="all-count" class="bg-blue-600 px-2 py-1 text-xs rounded-full">0</span>
                </button>
                <button class="category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium" data-filter="Favorites" data-index="1" tabindex="0">
                    <span>Favorites</span>
                    <span id="favorites-count" class="bg-gray-600 px-2 py-1 text-xs rounded-full">0</span>
                </button>
                <!-- Other category buttons will be generated here -->
            </div>
        </aside>

        <!-- Right Main Content - Channel Grid -->
        <div class="channel-grid-container flex-grow flex flex-col">
            <div class="flex items-baseline mb-4 space-x-2">
                 <h2 id="main-title" class="text-2xl font-semibold text-[var(--text-light)]">All Channels</h2>
                 <span id="channel-count" class="text-[var(--text-gray)] text-lg">(0)</span>
            </div>
            
            <div id="channels-list" class="grid gap-4 sm:gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
                <!-- Channel cards will be generated here by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div id="video-modal" class="video-player-container">
        <!-- Auto-hide Video Controls -->
        <div id="video-controls" class="video-controls">
            <button id="exit-btn" tabindex="0">
                <i class="fas fa-times mr-2"></i>Close
            </button>
        </div>
        
        <!-- Loading Spinner -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center space-y-4 text-white">
            <div class="loader"></div>
            <span>Loading...</span>
        </div>
        <div class="video-player-content hidden">
            <video id="video-player" class="video-player" controls autoplay></video>
        </div>
    </div>

    <!-- Exit Confirmation Modal -->
    <div id="exit-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[1001] hidden">
        <div class="bg-[var(--bg-medium)] p-8 rounded-xl shadow-2xl text-center flex flex-col items-center space-y-6 max-w-sm w-full">
            <h3 class="text-xl font-bold text-[var(--accent-blue)]">Exit Application?</h3>
            <p class="text-[var(--text-gray)]">Are you sure you want to exit the app?</p>
            <div class="flex space-x-4">
                <button id="confirm-exit-btn" class="bg-red-600 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:bg-red-700" tabindex="0">
                    Exit
                </button>
                <button id="cancel-exit-btn" class="bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 hover:bg-gray-700" tabindex="0">
                    Cancel
                </button>
            </div>
        </div>
    </div>

                "name": "France 5",
                "logo": "https://d1yjjnpx0p53s8.cloudfront.net/styles/logo-thumbnail/s3/0022/5801/brand.gif?itok=y-h0OU6A",
                "stream": "https://list.iptvcat.com/my_list/s/ee2693927b3e77b4e9970be9e13c58c9.m3u8",
                "category": "General"
            },
            {
                "id": "channel42",
                "name": "France 3",
                "logo": "https://seriescheries.com/wp-content/uploads/2015/09/france_3_logoactuel.jpg",
                "stream": "https://list.iptvcat.com/my_list/s/26d2e5ba8a979f5ad40daf28bcb47dc6.m3u8",
                "category": "General"
            }
        ]
    </script>
    
    <!--
    !!! Firestore Security Rules !!!
    To ensure your app works correctly and securely, please apply the following security rules in your Firebase project.
    
    service cloud.firestore {
      match /databases/{database}/documents {
        match /artifacts/{appId}/users/{userId}/{collection=**} {
          allow read, write: if request.auth.uid == userId;
        }
      }
    }
    -->
    <script type="module">
        // Global variables for Firebase services
        let db;
        let auth;
        let userId = 'default-user-id';
        let channelData = [];
        let favorites = new Set();
        let currentFilter = 'All';
        let currentCategory = 'All';
        let hlsInstance = null;
        let lastSelectedChannelId = null;
        let allChannelsCount = 0;
        let currentFocusedElement = null;
        let isInVideoMode = false;
        let controlsTimeout = null;
        
        // Get global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // DOM Elements
        const channelsList = document.getElementById('channels-list');
        const mainTitle = document.getElementById('main-title');
        const channelCountSpan = document.getElementById('channel-count');
        const videoModal = document.getElementById('video-modal');
        const videoPlayer = document.getElementById('video-player');
        const loadingSpinner = document.getElementById('loading-spinner');
        const videoContent = document.querySelector('.video-player-content');
        const exitModal = document.getElementById('exit-modal');
        const confirmExitBtn = document.getElementById('confirm-exit-btn');
        const cancelExitBtn = document.getElementById('cancel-exit-btn');
        const exitPlayerBtn = document.getElementById('exit-btn');
        const videoControls = document.getElementById('video-controls');
        const categoriesList = document.getElementById('categories-list');
        const allCountSpan = document.getElementById('all-count');
        const favoritesCountSpan = document.getElementById('favorites-count');
        
        // TV Remote Navigation Functions
        function getAllFocusableElements() {
            if (isInVideoMode) {
                return Array.from(document.querySelectorAll('#exit-btn'));
            }
            
            const categories = Array.from(document.querySelectorAll('.category-button'));
            const channels = Array.from(document.querySelectorAll('.channel-card'));
            return [...categories, ...channels];
        }
        
        function getCurrentFocusedIndex() {
            const focusableElements = getAllFocusableElements();
            const currentElement = document.activeElement;
            return focusableElements.indexOf(currentElement);
        }
        
        function setFocusToElement(element) {
            if (element) {
                // Remove focus from all elements first
                document.querySelectorAll('.selected-card, .tv-focused').forEach(el => {
                    el.classList.remove('selected-card', 'tv-focused');
                });
                
                // Set focus and visual indicator
                element.focus();
                if (element.classList.contains('channel-card')) {
                    element.classList.add('selected-card');
                } else {
                    element.classList.add('tv-focused');
                }
                
                // Ensure element is visible
                element.scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'center', 
                    inline: 'center' 
                });
                
                currentFocusedElement = element;
            }
        }
        
        function findNearestElement(currentElement, direction) {
            const allElements = getAllFocusableElements();
            const currentRect = currentElement.getBoundingClientRect();
            let bestElement = null;
            let bestDistance = Infinity;
            
            allElements.forEach(element => {
                if (element === currentElement) return;
                
                const rect = element.getBoundingClientRect();
                let isInDirection = false;
                let distance = 0;
                
                switch (direction) {
                    case 'ArrowLeft':
                        isInDirection = rect.right <= currentRect.left + 10;
                        distance = Math.abs(rect.top - currentRect.top) + (currentRect.left - rect.right);
                        break;
                    case 'ArrowRight':
                        isInDirection = rect.left >= currentRect.right - 10;
                        distance = Math.abs(rect.top - currentRect.top) + (rect.left - currentRect.right);
                        break;
                    case 'ArrowUp':
                        isInDirection = rect.bottom <= currentRect.top + 10;
                        distance = Math.abs(rect.left - currentRect.left) + (currentRect.top - rect.bottom);
                        break;
                    case 'ArrowDown':
                        isInDirection = rect.top >= currentRect.bottom - 10;
                        distance = Math.abs(rect.left - currentRect.left) + (rect.top - currentRect.bottom);
                        break;
                }
                
                if (isInDirection && distance < bestDistance) {
                    bestDistance = distance;
                    bestElement = element;
                }
            });
            
            return bestElement;
        }
        
        // Video controls auto-hide functionality
        function showVideoControls() {
            if (isInVideoMode) {
                videoControls.classList.add('show');
                
                // Clear existing timeout
                if (controlsTimeout) {
                    clearTimeout(controlsTimeout);
                }
                
                // Hide controls after 3 seconds of inactivity
                controlsTimeout = setTimeout(() => {
                    videoControls.classList.remove('show');
                }, 3000);
            }
        }
        
        function hideVideoControls() {
            videoControls.classList.remove('show');
            if (controlsTimeout) {
                clearTimeout(controlsTimeout);
            }
        }
        
        function handleTVNavigation(event) {
            // Show video controls on any key press when in video mode
            if (isInVideoMode) {
                showVideoControls();
                
                // Focus exit button if not already focused
                if (document.activeElement !== exitPlayerBtn) {
                    setFocusToElement(exitPlayerBtn);
                }
            }
            
            // Allow default behavior for video player controls
            if (isInVideoMode && event.target.tagName === 'VIDEO') {
                return;
            }
            
            const currentElement = document.activeElement;
            let targetElement = null;
            
            switch (event.key) {
                case 'ArrowLeft':
                case 'ArrowRight':
                case 'ArrowUp':
                case 'ArrowDown':
                    event.preventDefault();
                    
                    if (isInVideoMode) {
                        // In video mode, only handle back navigation
                        if (event.key === 'ArrowLeft' || event.key === 'Escape') {
                            exitVideoPlayer();
                        }
                        return;
                    }
                    
                    // Special handling for category to channel navigation
                    if (event.key === 'ArrowRight' && currentElement.classList.contains('category-button')) {
                        const firstChannel = channelsList.querySelector('.channel-card');
                        if (firstChannel) {
                            setFocusToElement(firstChannel);
                            return;
                        }
                    }
                    
                    // Find nearest element in the direction
                    targetElement = findNearestElement(currentElement, event.key);
                    if (targetElement) {
                        setFocusToElement(targetElement);
                    }
                    break;
                    
                case 'Enter':
                    event.preventDefault();
                    
                    if (currentElement.classList.contains('channel-card')) {
                        const channelId = currentElement.getAttribute('data-id');
                        playChannel(channelId);
                    } else if (currentElement.classList.contains('category-button')) {
                        // Fixed: Properly trigger category selection
                        selectCategory(currentElement);
                    } else if (currentElement.id === 'exit-btn') {
                        exitVideoPlayer();
                    }
                    break;
                    
                case 'Escape':
                case 'Backspace':
                    event.preventDefault();
                    
                    if (isInVideoMode) {
                        exitVideoPlayer();
                    } else {
                        showExitModal();
                    }
                    break;
            }
        }
        
        // Fixed: Category selection function
        function selectCategory(button) {
            const categoryFilter = button.dataset.filter;
            
            // Update current category
            currentCategory = categoryFilter;
            
            // Update visual active state
            document.querySelectorAll('.category-button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            
            // Update category count spans
            document.querySelectorAll('.category-button .bg-white').forEach(span => {
                span.className = span.className.replace('bg-white text-black', 'bg-gray-600');
            });
            
            const activeSpan = button.querySelector('span:last-child');
            if (activeSpan) {
                activeSpan.className = activeSpan.className.replace('bg-gray-600', 'bg-white text-black');
            }
            
            // Filter and render channels
            filterChannels();
            
            // Keep focus on the selected category
            setFocusToElement(button);
        }
        
        function showExitModal() {
            exitModal.style.display = 'flex';
            confirmExitBtn.focus();
        }
        
        function hideExitModal() {
            exitModal.style.display = 'none';
            // Return focus to previously focused element
            if (currentFocusedElement) {
                setFocusToElement(currentFocusedElement);
            }
        }
        
        // Main app initialization function
        async function initApp() {
            fetchChannels();

            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                } catch (error) {
                    console.error("Error signing in with custom token, signing in anonymously:", error);
                    await signInAnonymously(auth);
                }
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    console.log("Authenticated with user ID:", userId);
                    listenToFavorites();
                } else {
                    console.log("User is signed out.");
                }
            });

            // Event Listeners
            confirmExitBtn.addEventListener('click', () => window.history.back());
            cancelExitBtn.addEventListener('click', hideExitModal);
            exitPlayerBtn.addEventListener('click', exitVideoPlayer);
            
            // Category click handler - Fixed to use new selectCategory function
            categoriesList.addEventListener('click', (e) => {
                if (e.target.closest('.category-button')) {
                    const button = e.target.closest('.category-button');
                    selectCategory(button);
                }
            });

            // TV Remote Navigation - Global key handler
            document.addEventListener('keydown', handleTVNavigation);
            
            // Video player mouse/touch events for showing controls
            videoModal.addEventListener('mousemove', showVideoControls);
            videoModal.addEventListener('touchstart', showVideoControls);
            
            // Modal key handlers
            exitModal.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    e.preventDefault();
                    const focused = document.activeElement;
                    if (focused === confirmExitBtn) {
                        cancelExitBtn.focus();
                    } else {
                        confirmExitBtn.focus();
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    document.activeElement.click();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    hideExitModal();
                }
            });
            
            // Initialize focus on first category
            setTimeout(() => {
                const firstCategory = document.querySelector('.category-button');
                if (firstCategory) {
                    setFocusToElement(firstCategory);
                }
            }, 500);
        }
        
        function filterChannels() {
            let filtered = channelData;
            
            if (currentCategory === 'Favorites') {
                filtered = filtered.filter(channel => favorites.has(channel.id));
            } else if (currentCategory !== 'All') {
                filtered = filtered.filter(channel => channel.category === currentCategory);
            }
            
            renderChannels(filtered);
            
            // Reset focus to first channel after filter
            setTimeout(() => {
                const firstChannel = channelsList.querySelector('.channel-card');
                if (firstChannel && !document.querySelector('.category-button:focus')) {
                    setFocusToElement(firstChannel);
                }
            }, 100);
        }

        function fetchChannels() {
            try {
                const channelsJsonText = document.getElementById('channels-data').textContent;
                channelData = JSON.parse(channelsJsonText);
                allChannelsCount = channelData.length;
                allCountSpan.textContent = allChannelsCount;
                renderCategories();
                filterChannels();
            } catch (error) {
                console.error("Failed to load channel data:", error);
                channelsList.innerHTML = `<p class="text-red-400 text-center col-span-full">Failed to load channels. Please try again later.</p>`;
            }
        }

        function listenToFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            onSnapshot(userFavoritesRef, (doc) => {
                if (doc.exists()) {
                    favorites = new Set(doc.data().channels || []);
                } else {
                    favorites = new Set();
                }
                favoritesCountSpan.textContent = favorites.size;
                filterChannels();
            });
        }
        
        async function saveFavorites() {
            const userFavoritesRef = doc(db, `/artifacts/${appId}/users/${userId}/favorites`, 'list');
            try {
                await setDoc(userFavoritesRef, { channels: Array.from(favorites) }, { merge: true });
            } catch (error) {
                console.error("Error saving favorites:", error);
            }
        }
        
        function renderCategories() {
            const existingCategories = Array.from(categoriesList.querySelectorAll('.dynamic-category-button'));
            existingCategories.forEach(btn => btn.remove());

            const categories = [...new Set(channelData.map(c => c.category))].sort();
            
            categories.forEach((cat, index) => {
                const count = channelData.filter(c => c.category === cat).length;
                const button = document.createElement('button');
                button.className = `category-button flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm font-medium dynamic-category-button ${currentCategory === cat ? 'active' : ''}`;
                button.textContent = cat;
                button.dataset.filter = cat;
                button.dataset.index = index + 2;
                button.setAttribute('tabindex', '0');
                
                const countSpan = document.createElement('span');
                countSpan.className = `px-2 py-1 text-xs rounded-full ${currentCategory === cat ? 'bg-white text-black' : 'bg-gray-600'}`;
                countSpan.textContent = count;
                
                button.appendChild(countSpan);
                categoriesList.appendChild(button);
            });
        }

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target.querySelector('img');
                    img.src = img.dataset.src;
                    img.onerror = () => {
                        img.src = "https://placehold.co/120x80/000000/FFFFFF?text=No+Image";
                    };
                    observer.unobserve(entry.target);
                }
            });
        });

        function renderChannels(channelsToRender) {
            channelsList.innerHTML = '';
            
            mainTitle.textContent = currentCategory === 'Favorites' ? 'My Favorites' : `${currentCategory === 'All' ? 'All' : currentCategory} Channels`;
            channelCountSpan.textContent = `(${channelsToRender.length})`;
            
            if (channelsToRender.length === 0) {
                channelsList.innerHTML = `<p class="text-gray-400 text-center col-span-full">No channels found for this selection.</p>`;
                return;
            }
            
            channelsToRender.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-card bg-[var(--bg-medium)] rounded-lg shadow-xl overflow-hidden cursor-pointer flex flex-col items-center justify-between transition-all duration-300 transform hover:scale-105`;
                card.setAttribute('data-id', channel.id);
                card.setAttribute('data-index', index);
                card.setAttribute('tabindex', '0');
                card.setAttribute('role', 'button');

                const isFavorite = favorites.has(channel.id);
                
                card.innerHTML = `
                    <div class="relative w-full h-36 bg-[var(--bg-medium)] overflow-hidden flex items-center justify-center">
                        <img data-src="${channel.logo}" alt="${channel.name} logo" class="w-full h-full object-contain p-2">
                        <button class="favorite-btn absolute top-2 right-2 p-2 rounded-full bg-black bg-opacity-50 text-white hover:text-yellow-400 transition-colors duration-200" tabindex="-1">
                            <i class="fa-star ${isFavorite ? 'fas text-yellow-400' : 'far'}"></i>
                        </button>
                    </div>
                    <div class="p-4 w-full">
                        <h3 class="text-lg font-semibold text-center truncate">${channel.name}</h3>
                        <p class="text-sm text-[var(--text-gray)] text-center mt-1 truncate">${channel.category}</p>
                    </div>
                `;

                card.addEventListener('click', () => playChannel(channel.id));
                const favoriteBtn = card.querySelector('.favorite-btn');
                favoriteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addFavoriteToggle(channel.id, favoriteBtn.querySelector('i'));
                });
                
                channelsList.appendChild(card);
                observer.observe(card);
            });
        }
        
        function addFavoriteToggle(channelId, iconElement) {
            const isFavorite = favorites.has(channelId);
            if (isFavorite) {
                favorites.delete(channelId);
                iconElement.classList.remove('fas', 'text-yellow-400');
                iconElement.classList.add('far');
            } else {
                favorites.add(channelId);
                iconElement.classList.remove('far');
                iconElement.classList.add('fas', 'text-yellow-400');
            }
            saveFavorites();
            if (currentCategory === 'Favorites') {
                filterChannels();
            }
        }
        
        function playChannel(channelId) {
            const channel = channelData.find(c => c.id === channelId);
            if (!channel) {
                console.error("Channel not found:", channelId);
                return;
            }

            lastSelectedChannelId = channelId;
            isInVideoMode = true;
            videoModal.classList.add('active');
            loadingSpinner.style.display = 'flex';
            videoContent.classList.add('hidden');
            
            // Hide controls initially
            hideVideoControls();
            
            if (hlsInstance) {
                hlsInstance.destroy();
            }
            
            const videoSource = channel.stream;
            
            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(videoSource);
                hlsInstance.attachMedia(videoPlayer);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                    videoPlayer.play();
                    loadingSpinner.style.display = 'none';
                    videoContent.classList.remove('hidden');
                    
                    // Show controls briefly when video starts
                    showVideoControls();
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error('HLS.js fatal error:', data);
                        loadingSpinner.style.display = 'none';
                        videoContent.classList.remove('hidden');
                        videoPlayer.src = "https://placehold.co/1280x720/000000/FFFFFF?text=Stream+Error";
                    }
                });
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = videoSource;
                videoPlayer.addEventListener('loadedmetadata', () => {
                    videoPlayer.play();
                    loadingSpinner.style.display = 'none';
                    videoContent.classList.remove('hidden');
                    
                    // Show controls briefly when video starts
                    showVideoControls();
                });
            } else {
                console.error('HLS not supported on this browser.');
                loadingSpinner.style.display = 'none';
                videoContent.classList.remove('hidden');
                videoPlayer.src = "https://placehold.co/1280x720/000000/FFFFFF?text=HLS+Not+Supported";
            }
        }
        
        function exitVideoPlayer() {
            isInVideoMode = false;
            
            if (hlsInstance) {
                hlsInstance.stopLoad();
                hlsInstance.detachMedia();
            }
            videoPlayer.pause();
            videoPlayer.src = '';
            videoModal.classList.remove('active');
            hideVideoControls();
            
            // Return focus to the last selected channel with proper highlighting
            if (lastSelectedChannelId) {
                const lastCard = document.querySelector(`[data-id="${lastSelectedChannelId}"]`);
                if (lastCard) {
                    setTimeout(() => {
                        setFocusToElement(lastCard);
                    }, 100);
                } else {
                    // If channel is not visible (different category), focus on first channel
                    const firstChannel = channelsList.querySelector('.channel-card');
                    if (firstChannel) {
                        setTimeout(() => {
                            setFocusToElement(firstChannel);
                        }, 100);
                    }
                }
            }
        }

        window.onload = () => {
             initApp();
        };

    </script>
