<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TlouTV — HLS + MPEG-TS + Double-Back</title>
<meta name="theme-color" content="#0ea5e9" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b17; --surface:#0c1224; --surface2:#111a33;
    --text:#e6e9ef; --muted:#aab3c4;
    --cy1:#06b6d4; --cy2:#22d3ee; --vio:#7c3aed;
    --ring: 0 0 0 3px rgba(34,211,238,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,58,237,.22), transparent 40%),
      radial-gradient(900px 600px at 110% 0%, rgba(34,211,238,.16), transparent 45%),
      var(--bg);
    overscroll-behavior: contain;
  }
  .app{ display:grid; grid-template-columns: 220px 1fr; gap:0; height:100%; }
  header{
    grid-column:1 / -1; padding:12px 18px; position:sticky; top:0; z-index:5;
    backdrop-filter: blur(8px);
    background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.03));
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-badge{ width:36px; height:36px; border-radius:12px; background:#0000002a; display:grid; place-items:center; }
  .brand .title{ font: 800 18px/1 Outfit,Inter,sans-serif; letter-spacing:.3px }
  .brand .sub{ font-size:10px; letter-spacing:2px; color:#a9f0ff; text-transform:uppercase }

  /* Left Menu */
  .menu{
    border-right:1px solid rgba(255,255,255,.07);
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    padding:14px 10px 18px; overflow:auto;
  }
  .menu h3{ margin:6px 10px 10px; font: 700 12px/1 Outfit,Inter; letter-spacing:1px; color:var(--muted); text-transform:uppercase }
  .mitem{
    display:flex; align-items:center; gap:12px;
    width:100%; border:1px solid rgba(255,255,255,.07);
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    color:var(--text); padding:12px; margin:8px 4px; border-radius:12px;
    text-align:left; cursor:pointer; outline: none;
  }
  .mitem .dot{ width:8px; height:8px; border-radius:50%; background:var(--cy1); opacity:.7 }
  .mitem.active{ outline:var(--ring); border-color:rgba(34,211,238,.55) }
  .focused-menu{ outline:var(--ring); border-color:rgba(34,211,238,.65) }

  /* Grid */
  .content{ overflow:auto; padding:14px 16px 24px; scroll-behavior:smooth }
  .search-row{ display:flex; gap:10px; align-items:center; margin:6px 0 14px }
  .search{
    flex:1; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.06); color:var(--text); font-size:14px;
  }
  .grid{
    display:grid; gap:12px;
    grid-template-columns: repeat(1,minmax(0,1fr));
  }
  @media(min-width:640px){ .grid{ grid-template-columns: repeat(2,minmax(0,1fr)); } }
  @media(min-width:1024px){ .grid{ grid-template-columns: repeat(3,minmax(0,1fr)); } }

  .card{
    display:flex; gap:12px; align-items:center; padding:12px;
    border-radius:16px; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.07); outline:none; cursor:pointer;
  }
  .card .logo{ width:56px; height:56px; border-radius:12px; background:#00000040; display:grid; place-items:center; overflow:hidden }
  .card .logo img{ width:100%; height:100%; object-fit:contain }
  .card .name{ font-weight:700 }
  .card .meta{ font-size:12px; color:var(--muted) }
  .focused-card{ outline:var(--ring); border-color:rgba(34,211,238,.55) }

  /* Player overlay */
  .overlay{ position:fixed; inset:0; z-index:50; display:none; }
  .overlay.show{ display:block }
  .overlay.controls-hidden .close-btn,
  .overlay.controls-hidden .error-tray{ display:none !important; }
  .shade{ position:absolute; inset:0; background:rgba(0,0,0,.86) }
  .player-wrap{ position:absolute; inset:0; display:grid; place-items:center; padding:0; }
  video{ width:100vw; height:100vh; background:#000; outline:none; }

  .close-btn{
    position:absolute; top:14px; right:14px; z-index:60;
    padding:10px 12px; border-radius:12px;
    border:1px solid rgba(255,255,255,.28);
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
    color:#fff; font-weight:800; cursor:pointer; transition:transform .08s ease;
    outline: none;
  }
  .close-btn:focus-visible, .close-btn.focused{
    outline: 4px solid var(--cy2);
    box-shadow: 0 0 0 6px rgba(34,211,238,.35), 0 10px 28px rgba(0,0,0,.5);
    transform: scale(1.05);
  }

  /* Error tray in overlay */
  .error-tray{
    position:absolute; left:16px; bottom:16px; z-index:60;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:10px 12px;
  }
  .e-btn{
    border-radius:10px; border:1px solid rgba(255,255,255,.25); padding:8px 10px; background:rgba(255,255,255,.08); color:#fff; cursor:pointer;
  }
  .e-btn:focus-visible{ outline:var(--ring); }

  /* Back toast */
  .back-toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:70; padding:10px 14px; border-radius:12px;
    background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18);
    color:#fff; font-weight:700; font-size:13px; letter-spacing:.2px;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .back-toast.show{ opacity:1; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 4l13 8-13 8z" fill="#22d3ee"/></svg>
    </div>
    <div>
      <div class="title">TlouTV</div>
      <div class="sub">Live Haitian TV</div>
    </div>
  </div>
</header>

<div class="app">
  <!-- LEFT MENU -->
  <aside class="menu" id="leftMenu">
    <h3>Browse</h3>
    <button class="mitem focused-menu" data-menu data-cat="all" id="mi-all"><span class="dot"></span><span>All Channels</span></button>
    <button class="mitem" data-menu data-cat="news" id="mi-news"><span class="dot"></span><span>News</span></button>
    <button class="mitem" data-menu data-cat="general" id="mi-general"><span class="dot"></span><span>General</span></button>
    <button class="mitem" data-menu data-cat="music" id="mi-music"><span class="dot"></span><span>Music</span></button>
    <button class="mitem" data-menu data-cat="religious" id="mi-religious"><span class="dot"></span><span>Religious</span></button>
    <button class="mitem" data-menu data-cat="sports" id="mi-sports"><span class="dot"></span><span>Sports</span></button>
    <h3>My</h3>
    <button class="mitem" data-menu data-cat="favorites" id="mi-fav"><span class="dot"></span><span>Favorites</span></button>
  </aside>

  <!-- RIGHT CONTENT -->
  <section class="content" id="content">
    <div class="search-row">
      <input id="q" class="search" placeholder="Search channels…" />
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<!-- Player Overlay -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="shade"></div>
  <div class="player-wrap">
    <video id="player" playsinline webkit-playsinline controls preload="metadata"></video>
  </div>
  <button class="close-btn" id="closeBtn" title="Close (Back ×2 to exit)">✕ Close</button>
  <div class="error-tray" id="errorTray" style="display:none">
    <span id="errMsg" style="opacity:.92">Playback error.</span>
    <button class="e-btn" id="btnRetry">Retry</button>
    <button class="e-btn" id="btnVLC">Open in VLC</button>
    <button class="e-btn" id="btnNative">Open natively</button>
  </div>
</div>

<!-- Back toast -->
<div class="back-toast" id="backToast">Press Back again to exit</div>

<!-- Players -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>

<script>
/* ---------- Data ---------- */
const normalizeStream = u => (typeof u==='string' ? u.replace('.m3d8','.m3u8') : u);
const isHls = url => /\.m3u8(\?|$)/i.test(url);
const isTs  = url => /\.ts(\?|$)/i.test(url) || /(?:^|[?&])extension=ts\b/i.test(url);
const isHttp = url => /^http:\/\//i.test(url);

/* Full channel list (trimmed here to what matters) + your new Test (TS) channel */
const CHANNELS = [
  {"id":"rtc","name":"Radio Tele Caraibes","logo":"https://play-lh.googleusercontent.com/0zXSmxhrP8BV9q7kHWNRhKf0ycn1X4IMiHe_x2GMo95hPS81w4gEFodAt_oMwhqqfOrN","url":"https://customer-gllhkkbamkskdl1p.cloudflarestream.com/eyJhbGciOiJSUzI1NiIsImtpZCI6ImI3YmIwODNmMDhkNmQ5NWExZjIzZWE3ZWRhOWY4NTZhIn0.eyJzdWIiOiJiZTgzNDM5MWViYmM1MzE2NmNmMzQ1Y2QwN2QwNDg3MiIsImtpZCI6ImI3YmIwODNmMDhkNmQ5NWExZjIzZWE3ZWRhOWY4NTZhIiwiZXhwIjoxNzU4NTUwNTAyLCJhY2Nlc3NSdWxlcyI6W3sidHlwZSI6ImlwLmdlb2lwLmNvdW50cnkiLCJhY3Rpb24iOiJibG9jayIsImNvdW50cnkiOlsiUlUiLCJCWSJdfV19.U1lorQj2Thddfay3BWowLMFihlfYqVndJNUzPlMrX6OHWrTag5Ifj44NVTnVf_y7tnAVO8PLM_AT1IXn-gTdIVGrQPqKKIXl1IhQZ9mTNNGuDhwv0cnKtOq-i6NDANdbte8T61hLbOo1dVtDr90RI8FKMQRKPTVDMKU1PjQ5heBq0kq5uSMec_5YAr9ZcqB-SQeIrumlQYvF62Sy2UhKgDZzSOJcc_KPQQbOWwPZTUllX-BkBowR_s-lGuUeByUSOaVgYuK9nbRcIBSk6EWDmkPA3EgKDJDknfNNXQGZ6y_BmxJo-551IbjiOrp0txzaybL9IP4fR1heRiYCBVYaiw/manifest/stream_t7425cef6a4f31863ae3bf51fb012436c_r1210567689.m3u8?llhlsHBs=0.5","genre":"news","description":"News & talk"},

  /* NEW: tokened MPEG-TS demo channel */
  {"id":"tokenTS1","name":"Test — Token TS","logo":"","url":"http://fuego-iptv.net:80/play/live.php?mac=00:1A:79:7d:b0:58&stream=276314&extension=ts&play_token=RRFklQu5JM","genre":"general","description":"Demo of tokened MPEG-TS stream"},

  {"id":"channel1","name":"Tele Pacific","logo":"https://static.wikia.nocookie.net/logopedia/images/e/e6/Radio_T%C3%A9l%C3%A9_Pacific_Logo.png","url":normalizeStream("https://hls-p1st0n8r.livepush.io/live_cdn/nsOk3qoty1d5HDD/emB7xoUdyMbnjH8/tracks-v1a1/mono.m3u8"),"genre":"news","description":"Stay informed with the latest news from Tele Pacific"},
  {"id":"channel3","name":"Haiti News","logo":"https://m.media-amazon.com/images/I/611Ffvky5yL.png","url":normalizeStream("https://haititivi.com/website/haitinews/index.m3u8"),"genre":"news","description":"Breaking news"},
  {"id":"channel5","name":"Telemix","logo":"https://i.ibb.co/RB7dzZq/logo-mix-2.png","url":normalizeStream("https://haititivi.com/haiti/telemix1/tracks-v1a1/mono.m3u8"),"genre":"general","description":"Entertainment"},
  {"id":"channel6","name":"SNL","logo":"https://upload.wikimedia.org/wikipedia/en/thumb/3/30/SNL_logo.svg/1200px-SNL_logo.svg.png","url":normalizeStream("https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"),"genre":"general","description":"General programming"}
  // ... (your other channels can stay here unchanged)
];

/* ---------- State ---------- */
const NS='tloutv:ts-ready';
let CURRENT_CAT='all';
let lastFocus = null;

/* ---------- Rendering ---------- */
const gridEl = document.getElementById('grid');
const qEl = document.getElementById('q');

function favorites(){ try{return JSON.parse(localStorage.getItem(NS+':fav')||'[]')}catch{return[]} }
function setFavorites(x){ localStorage.setItem(NS+':fav', JSON.stringify([...new Set(x)]) ) }

function filterChannels(){
  const q=(qEl.value||'').toLowerCase();
  return CHANNELS.filter(c=>{
    const matchQ=!q || c.name.toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q);
    const matchCat = CURRENT_CAT==='all'
      ? true
      : (CURRENT_CAT==='favorites'
         ? favorites().includes(c.id)
         : c.genre===CURRENT_CAT);
    return matchQ && matchCat;
  });
}
function card(c,i){
  return `
  <div class="card" data-card data-idx="${i}" tabindex="0" aria-label="${c.name}">
    <div class="logo">${c.logo?`<img src="${c.logo}" alt="${c.name}">`:'📺'}</div>
    <div class="info">
      <div class="name">${c.name}</div>
      <div class="meta">${c.genre||''}</div>
    </div>
    <div style="margin-left:auto">
      <button aria-label="Favorite" style="background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer" onclick="event.stopPropagation();toggleFavorite('${c.id}', this)">
        ${favorites().includes(c.id)?'❤️':'🤍'}
      </button>
    </div>
  </div>`;
}
let rendered=[];
function render(){
  const list = filterChannels();
  rendered = list;
  gridEl.innerHTML = list.map((c,i)=>card(c,i)).join('') || `<div style="opacity:.7">No results</div>`;
  const first = gridEl.querySelector('[data-card]');
  if(first && !document.querySelector('.focused-card') && document.activeElement.tagName!=='INPUT'){ focusCard(0); }
}

/* ---------- Favorites ---------- */
function toggleFavorite(id, btn){
  const s=new Set(favorites());
  if(s.has(id)){ s.delete(id); if(btn) btn.textContent='🤍'; }
  else{ s.add(id); if(btn) btn.textContent='❤️'; }
  setFavorites([...s]);
}

/* ---------- Menu ---------- */
const menuItems = Array.from(document.querySelectorAll('[data-menu]'));
function selectMenu(cat){
  CURRENT_CAT = cat;
  menuItems.forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  render();
}
menuItems.forEach(btn=>{
  btn.addEventListener('click',()=>{ selectMenu(btn.dataset.cat); focusMenu(btn); });
});
function focusMenu(el){
  menuItems.forEach(b=>b.classList.remove('focused-menu'));
  el.classList.add('focused-menu'); el.focus();
}

/* ---------- D-Pad Navigation ---------- */
let focusedIndex=0;
let lastNavTs = 0;
const NAV_GAP = 90;
function navAllowed(){ const now=Date.now(); if(now-lastNavTs<NAV_GAP) return false; lastNavTs=now; return true; }
function gridCols(){ const w=window.innerWidth; return w>=1024?3:(w>=640?2:1); }
function focusCard(idx){
  const prev = document.querySelector('.focused-card'); if(prev) prev.classList.remove('focused-card');
  const el = gridEl.querySelector(`[data-card][data-idx="${idx}"]`);
  if(el){ el.classList.add('focused-card'); el.focus({preventScroll:false}); el.scrollIntoView({block:'nearest'}); focusedIndex=idx; }
}

document.addEventListener('keydown', (e)=>{
  const ae=document.activeElement;
  if(overlay.classList.contains('show')) return;
  const onMenu = ae && ae.hasAttribute('data-menu');
  const onGrid = ae && ae.hasAttribute('data-card');
  const onInput = ae && ae.tagName==='INPUT';

  if(onGrid){
    if(!navAllowed()) return;
    const total = rendered.length; const cols = gridCols();
    if(['ArrowRight','Right'].includes(e.key)){ e.preventDefault(); focusCard(Math.min(total-1, focusedIndex+1)); return; }
    if(['ArrowLeft','Left'].includes(e.key)){ e.preventDefault();
      if(focusedIndex%cols===0){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); return; }
      focusCard(Math.max(0, focusedIndex-1)); return;
    }
    if(['ArrowDown','Down'].includes(e.key)){ e.preventDefault(); focusCard(Math.min(total-1, focusedIndex+cols)); return; }
    if(['ArrowUp','Up'].includes(e.key)){ e.preventDefault(); focusCard(Math.max(0, focusedIndex-cols)); return; }
    if(e.key==='Enter'){ e.preventDefault(); openPlayer(rendered[focusedIndex]); return; }
  }

  if(onMenu){
    if(!navAllowed()) return;
    const i = menuItems.indexOf(ae);
    if(['ArrowDown','Down'].includes(e.key)){ e.preventDefault(); focusMenu(menuItems[Math.min(menuItems.length-1,i+1)]); return; }
    if(['ArrowUp','Up'].includes(e.key)){ e.preventDefault(); focusMenu(menuItems[Math.max(0,i-1)]); return; }
    if(['ArrowRight','Right'].includes(e.key)){ e.preventDefault(); focusCard(0); return; }
    if(e.key==='Enter'){ e.preventDefault(); ae.click(); return; }
  }

  if(onInput){
    if(e.key==='Escape'){ e.preventDefault(); gridEl.querySelector('[data-card]')?.focus(); }
    return;
  }

  if(['ArrowLeft','Left','ArrowUp','Up','ArrowDown','Down','ArrowRight','Right'].includes(e.key)){
    if(!onMenu && !onGrid && !onInput){ focusMenu(document.querySelector(`[data-menu][data-cat="${CURRENT_CAT}"]`)||menuItems[0]); }
  }
});

/* ---------- Player (HLS + MPEG-TS) ---------- */
const overlay = document.getElementById('overlay');
const player = document.getElementById('player');
const closeBtn = document.getElementById('closeBtn');
const errorTray = document.getElementById('errorTray');
const errMsg = document.getElementById('errMsg');
const btnRetry = document.getElementById('btnRetry');
const btnVLC = document.getElementById('btnVLC');
const btnNative = document.getElementById('btnNative');
const backToast = document.getElementById('backToast');

let hls = null, tsPlayer = null, currentURL = null, currentChannel = null;

let overlayUIVisible = true;
let lastBackTs = 0;
const BACK_DOUBLE_MS = 1200;

function showControls(){ overlay.classList.remove('controls-hidden'); overlayUIVisible = true; }
function hideControls(){ overlay.classList.add('controls-hidden'); overlayUIVisible = false; closeBtn.classList.remove('focused'); }

let toastT=null;
function showBackToast(){ backToast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> backToast.classList.remove('show'), 1100); }

async function requestFS(el){
  try{
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
    else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if(el.msRequestFullscreen) await el.msRequestFullscreen();
  }catch(e){}
}
function exitFS(){ if(document.fullscreenElement){ document.exitFullscreen?.(); } }

function showOverlay(){
  overlay.classList.add('show'); overlay.setAttribute('aria-hidden','false');
  showControls();
  lastFocus = document.querySelector('.focused-card') || document.activeElement;
  try { history.pushState({p:'player'}, '', '#player'); } catch(e){}
  lastBackTs = 0; player.focus();
}
function destroyPlayers(){
  try{ if(hls){ hls.destroy(); hls=null; } }catch(e){}
  try{ if(tsPlayer){ tsPlayer.unload(); tsPlayer.detachMediaElement(); tsPlayer.destroy(); tsPlayer=null; } }catch(e){}
  try{ player.pause(); player.removeAttribute('src'); player.load(); }catch(e){}
}
function hideOverlay(){
  overlay.classList.remove('show'); overlay.setAttribute('aria-hidden','true');
  destroyPlayers(); exitFS();
  backToast.classList.remove('show'); errorTray.style.display='none';
  lastFocus?.focus();
}

function onFatal(msg){
  errorTray.style.display='flex';
  errMsg.textContent = msg || 'Playback error';
}
function resetErrors(){ errorTray.style.display='none'; }

function openWithApp(url, app){
  const isHttps = /^https:/.test(url);
  const hostless = url.replace(/^https?:\/\//,'');
  const pkg = app==='vlc' ? 'org.videolan.vlc' : 'is.xyz.mpv';
  const intent = `intent://${hostless}#Intent;package=${pkg};scheme=${isHttps?'https':'http'};end`;
  const scheme = app==='vlc' ? `vlc://${url}` : `mpv://${url}`;
  const start = Date.now();
  const t = setTimeout(()=>{ if(Date.now()-start<1200){ location.href=intent; setTimeout(()=>{ location.href=url; }, 700); }}, 700);
  location.href = scheme;
  const vis = ()=>{ if(document.hidden) clearTimeout(t); document.removeEventListener('visibilitychange', vis); };
  document.addEventListener('visibilitychange', vis);
}

function playHls(url){
  hls = new Hls({
    lowLatencyMode:true, enableWorker:true,
    liveSyncDurationCount:3, liveMaxLatencyDurationCount:10,
    backBufferLength:60, progressive:true
  });
  hls.attachMedia(player);
  hls.on(Hls.Events.MEDIA_ATTACHED, ()=> hls.loadSource(url));
  hls.on(Hls.Events.MANIFEST_PARSED, async ()=>{ try{ await player.play(); }catch(e){} requestFS(player); });
  hls.on(Hls.Events.ERROR, (evt,data)=>{
    if(data?.fatal){ onFatal('Playback error: ' + (data?.details || data?.type || 'HLS')); }
  });
}

function playTs(url){
  if (!window.mpegts || !mpegts.isSupported()){
    onFatal('Your device/browser cannot play MPEG-TS directly.');
    return;
  }
  tsPlayer = mpegts.createPlayer({
    type: 'mpegts', isLive: true, url
  }, {
    enableWorker: true,
    liveBufferLatencyChasing: true
  });
  tsPlayer.attachMediaElement(player);
  tsPlayer.load();
  tsPlayer.play().then(()=>requestFS(player)).catch(()=>requestFS(player));
}

function playURL(url){
  resetErrors(); currentURL = url;
  destroyPlayers(); // ensure clean

  // Mixed content note: if app is https but stream is http, most browsers block it
  if (location.protocol === 'https:' && isHttp(url)){
    onFatal('This stream is HTTP on an HTTPS page (blocked by the browser). Use VLC or open natively, or host the app over HTTP.');
    return;
  }

  if (isHls(url)){
    if (window.Hls && Hls.isSupported()) playHls(url);
    else if (player.canPlayType('application/vnd.apple.mpegurl')){  // Safari
      player.src = url;
      player.addEventListener('loadedmetadata', async ()=>{ try{ await player.play(); }catch(e){} requestFS(player); }, {once:true});
    } else {
      onFatal('HLS not supported on this device.');
    }
    return;
  }

  if (isTs(url)){
    playTs(url);
    return;
  }

  // Fallback: try native or hand off
  location.href = url;
}

async function openPlayer(ch){
  showOverlay(); currentChannel = ch;
  playURL(ch.url);
}

/* Overlay: show controls when moving */
let lastPointerTs = 0;
function maybeShowControls(){
  const now=Date.now();
  if(now - lastPointerTs > 150){ showControls(); }
  lastPointerTs = now;
}
overlay.addEventListener('mousemove', maybeShowControls);
overlay.addEventListener('pointermove', maybeShowControls);
overlay.addEventListener('touchstart', maybeShowControls);

/* Double-Back logic inside overlay */
function handleBackPress(fromPopstate=false){
  const now = Date.now();
  if(overlayUIVisible){
    hideControls(); showBackToast();
    if(fromPopstate){ try { history.pushState({p:'player'}, '', '#player'); } catch(e){} }
    lastBackTs = now;
  } else {
    if(now - lastBackTs <= BACK_DOUBLE_MS){
      hideOverlay();
    } else {
      hideControls(); showBackToast();
      lastBackTs = now;
      if(fromPopstate){ try { history.pushState({p:'player'}, '', '#player'); } catch(e){} }
    }
  }
}
document.addEventListener('keydown', (e)=>{
  if(!overlay.classList.contains('show')) return;
  const k=e.key;
  if(['ArrowUp','Up','ArrowDown','Down','ArrowRight','Right','ArrowLeft','Left'].includes(k)){
    showControls();
    if(['ArrowLeft','Left'].includes(k)){ e.preventDefault(); closeBtn.classList.add('focused'); closeBtn.focus(); }
    return;
  }
  if(k==='Enter' && document.activeElement===closeBtn){ e.preventDefault(); hideOverlay(); return; }
  if(k==='Backspace' || k==='Escape'){ e.preventDefault(); handleBackPress(false); return; }
});
window.addEventListener('popstate', ()=>{ if(overlay.classList.contains('show')) handleBackPress(true); });
closeBtn.addEventListener('focus', ()=>closeBtn.classList.add('focused'));
closeBtn.addEventListener('blur',  ()=>closeBtn.classList.remove('focused'));
closeBtn.addEventListener('click', hideOverlay);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay || e.target.classList.contains('shade')) { showControls(); } });

/* Error tray actions */
btnRetry.onclick = ()=>{ if(currentURL){ playURL(currentURL); } };
btnVLC.onclick   = ()=>{ if(currentURL){ openWithApp(currentURL,'vlc'); } };
btnNative.onclick= ()=>{ if(currentURL){ location.href = currentURL; } };

/* ---------- Wire up ---------- */
qEl.addEventListener('input', render);
selectMenu('all');
render();
gridEl.addEventListener('click', (e)=>{
  const card = e.target.closest('[data-card]'); if(!card) return;
  const idx = Number(card.dataset.idx); openPlayer(rendered[idx]);
});
</script>
</body>
</html>
